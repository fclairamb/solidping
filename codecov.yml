# Codecov configuration. Coverage is uploaded by the backend-postgres job in
# .github/workflows/ci.yml (flag: backend). The statuses below are reported on
# the pull request itself, so a coverage drop is visible before merge.
codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: "80...100"
  status:
    project:
      default:
        target: 80%
        threshold: 0.5%
        informational: false
    patch:
      default:
        target: 80%
        informational: false

comment:
  layout: "condensed_header, diff, files"
  behavior: default
  require_changes: false

ignore:
  - "server/cmd/**"
  - "server/pkg/client/**"
  - "server/third_party/**"
  - "**/*_generated.go"
  - "**/mock_*.go"
  - "**/*_mock.go"
