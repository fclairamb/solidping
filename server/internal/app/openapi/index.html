<!doctype html>
<html>
    <head>
        <title>SolidPing API Reference</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <style>
            body {
                margin: 0;
                padding: 0;
            }
        </style>
    </head>

    <body>
        <script id="api-reference" data-url="/openapi.yaml"></script>
        <script>
            // The explorer is served by the instance it documents, so the
            // current origin is always the right API server — override the
            // spec's static servers list with it (must run before the Scalar
            // script loads and reads data-configuration).
            document.getElementById("api-reference").dataset.configuration =
                JSON.stringify({
                    theme: "purple",
                    layout: "modern",
                    defaultHttpClient: {
                        targetKey: "shell",
                        clientKey: "curl",
                    },
                    hiddenClients: [],
                    authentication: {
                        preferredSecurityScheme: "bearerAuth",
                    },
                    servers: [
                        {
                            url: window.location.origin,
                            description: "This server",
                        },
                    ],
                });
        </script>
        <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
    </body>
</html>
