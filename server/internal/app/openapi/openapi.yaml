        enabled, public status page, and 404 otherwise. No body. This is the
        contract for Caddy on_demand_tls / cert-manager gating on an external
        TLS edge; it is unchanged by, and independent of, the server's own
        in-server ACME support (config acme.enabled).
      operationId: customDomainAllowed
      parameters:
        - name: domain
          in: query
          required: true
          description: The hostname to check
          schema:
            type: string
      responses:
        "204":
          description: The domain is servable (verified + enabled + public)
