  /api/v1/orgs/{org}/status-pages/{statusPageUid}/subscribers:
    get:
      tags: [StatusPages]
      summary: List subscribers of a status page
      operationId: listStatusPageSubscribers
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgPath"
        - $ref: "#/components/parameters/StatusPageUidPath"
      responses:
        "200":
          description: List of subscribers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusPageSubscriberListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    post:
      tags: [StatusPages]
      summary: Subscribe an email address to a status page
      description: >-
        PUBLIC, unauthenticated. Double opt-in: a confirmation email is sent and
        nothing is delivered until its link is followed, which is the primary
        anti-abuse control.


        Email is the ONLY channel available here. A `channel` of anything else
        is refused — a visitor pasting a webhook URL has no verification story,
        and the URL is itself a credential. Webhook and Slack deliveries are
        registered by an operator through
        POST .../subscribers/endpoints instead.
      operationId: subscribeToStatusPage
      parameters:
        - $ref: "#/components/parameters/OrgPath"
        - $ref: "#/components/parameters/StatusPageUidPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusPageSubscribeRequest"
      responses:
        "202":
          description: >-
            Accepted. A confirmation email has been sent; nothing is
            deliverable until it is confirmed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: pending_confirmation
        "401":
          $ref: "#/components/responses/StatusPageLocked"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/orgs/{org}/status-pages/{statusPageUid}/subscribers/endpoints:
    post:
      tags: [StatusPages]
      summary: Register a webhook or Slack delivery for a status page
      description: >-
        AUTHENTICATED, operator-side. Creates a subscription that delivers to a
        URL rather than a mailbox, already confirmed — the operator registering
        their own endpoint IS the verification.


        The URL must be https and must not resolve to a loopback or private
        host; a `slack` subscription must point at hooks.slack.com. It is stored
        ENCRYPTED and never returned: list responses carry only a masked
        `endpoint` hint.


        Webhook deliveries are signed with HMAC-SHA256 over
        `<timestamp>.POST.<path>.<sha256 of the raw body, hex>`, carried in
        X-SP-Signature / X-SP-Timestamp / X-SP-Key-Id. The signing secret is
        returned by THIS CALL ONLY (`data.signingSecret`) and never again — a
        receiver that loses it needs the subscription re-created.


        The path is deliberately distinct from `.../subscribers`, which is the
        public email-only route: the two cannot share a pattern on the router.
      operationId: createStatusPageEndpointSubscriber
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgPath"
        - $ref: "#/components/parameters/StatusPageUidPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStatusPageEndpointSubscriberRequest"
      responses:
        "201":
          description: >-
            The subscription, plus the signing secret — shown once, here.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/StatusPageEndpointSubscriber"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/orgs/{org}/status-pages/{statusPageUid}/subscribers/{uid}:
    delete:
      tags: [StatusPages]
      summary: Remove a subscriber from a status page
      operationId: removeStatusPageSubscriber
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgPath"
        - $ref: "#/components/parameters/StatusPageUidPath"
        - $ref: "#/components/parameters/SubscriberUidPath"
      responses:
        "204":
          description: Subscriber removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

