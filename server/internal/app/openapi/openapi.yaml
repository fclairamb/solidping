    EscalationStepInput:
      type: object
      required: [delaySeconds]
      properties:
        delaySeconds:
          type: integer
        targets:
          type: array
          items:
            $ref: "#/components/schemas/EscalationTargetInput"

    CreateEscalationPolicyRequest:
