    # Check group schemas
    CheckGroup:
      type: object
      required: [uid, name, slug, sortOrder, checkCount, status, createdAt, updatedAt]
      properties:
        uid:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        sortOrder:
          type: integer
        checkCount:
          type: integer
        status:
          type: string
          enum: [created, up, down, validating, degraded, warning]
          description: >-
            Derived, read-time rollup of the group's enabled member checks:
            "down" if all considered members are down, "degraded" if some
            (not all) are down, "warning" if none are down but at least one
            is warning, "validating" if none are down/warning but at least
            one is validating, "up" if at least one is up, otherwise
            "created" (no considered members, or only just-created ones).
            Never stored — recomputed on every read.
        memberStatusCounts:
          type: object
          additionalProperties:
            type: integer
          description: >-
            Count of enabled member checks per status (wire status name ->
            count), omitting statuses with zero members.
          example:
            up: 3
            down: 1
        escalationPolicyUid:
          type: string
          format: uuid
          nullable: true
          description: >-
            Group-level escalation policy that member checks inherit when they
            have no policy of their own. Null = no group policy.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

