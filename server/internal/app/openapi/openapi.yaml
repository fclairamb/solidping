        at:
          type: string
          format: date-time
          description: End of the step, exclusive, in UTC.
        budgetRemainingSeconds:
          type: integer
          format: int64
          description: Negative once the budget is overspent.
        idealRemainingSeconds:
          type: integer
          format: int64
          description: >-
            The pace that spends the budget exactly over the window, drawn
            against the response-level `budgetTotalSeconds` so the two series
            stay comparable.
