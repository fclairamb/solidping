  # Organization APIs
  /api/v1/orgs:
    post:
      tags: [Organizations]
      summary: Create a new organization
      description: >-
        Creates a new organization, makes the caller its OWNER, and returns a
        session scoped to the new org. Any authenticated user may create an
        organization; it is always created for the caller (the owner is taken
        from the access token, never from the request body). A slug freed by a
        previously deleted organization may be claimed again.
      operationId: createOrg
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrgRequest"
      responses:
        "201":
          description: Organization created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/orgs/{org}:
    patch:
      tags: [Organizations]
      summary: Update the organization profile
      description: >-
        Updates the organization's name, URL slug and/or logo. **Owner only** —
        an admin is refused with 403 FORBIDDEN. Standard PATCH semantics: an
        omitted field is left untouched, and `logoUrl` accepts `null` (or an
        empty string) to clear the logo.


        Renaming the slug moves every URL of the organization, including the
        public ones — status pages, SVG badges and the embed widget. Existing
        links keep working: the previous slug is remembered and answers a
        permanent redirect (301 for GET/HEAD, 308 otherwise) to the current
        slug. Every `/api/v1/orgs/{org}/...` route is covered except the
        realtime WebSocket (`/api/v1/orgs/{org}/events/ws`), where an HTTP
        redirect is meaningless — reconnect against the current slug. That
        guarantee ends as soon as another organization claims the freed slug.


        Because access tokens are scoped to an organization slug, a rename
        response also carries a freshly minted session (`accessToken`,
        `refreshToken`, `expiresIn`, `tokenType`) for the new slug; the caller
        must adopt it or every subsequent request will be refused with 403.
        Other live sessions self-heal on their next token refresh.
      operationId: updateOrgProfile
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrgProfileRequest"
      responses:
        "200":
          description: Updated organization profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgProfileResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The requested slug is already taken by a live organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Organizations]
      summary: Delete an organization
      description: >-
        Permanently deletes the organization. **Owner only** — an admin is
        refused with 403 FORBIDDEN. The request body must repeat the
        organization slug as an explicit confirmation; a mismatch is a 422
        VALIDATION_ERROR.


        Deletion stops every check, revokes every organization-scoped session
        (including the caller's own), and makes the slug 404 immediately on
        every surface: the dashboard API, public status pages, badges and the
        embed widget. The slug is released and may be claimed by a new
        organization. There is no restore endpoint.


        Every OTHER member is signed out for good. The **caller** is not: the
        200 response carries a freshly minted replacement session, because the
        token they used names an organization that no longer resolves. If they
        still belong to at least one organization, the session is scoped to the
        first one (`organization` is set, and a `refreshToken` is issued). If
        they belong to none, the session is org-less — `organization` is absent,
        `loginAction` is `noOrg`, and there is no `refreshToken` (refresh grants
        are organization-scoped), exactly like a login by a user with no
        organization. Either way the caller stays authenticated and
        `GET /api/v1/auth/me` keeps answering 200.
      operationId: deleteOrg
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteOrgRequest"
      responses:
        "200":
          description: >-
            Organization deleted, plus the replacement session for the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/orgs/{org}/logo:
    post:
      tags: [Organizations]
      summary: Upload the organization logo
      description: >-
        Stores an uploaded image as the organization's logo and points
        `logoUrl` at its public URL. **Owner only.**


        Accepted content types are `image/png`, `image/jpeg`, `image/webp`,
        `image/gif` and `image/svg+xml`, up to 1 MB. Anything else is a 422
        VALIDATION_ERROR; an oversized body is a 413.


        The content type is the one the client declares in the multipart part
        header — the bytes are never sniffed or checked against it. The declared
        value is clamped to the allowlist and is what gets stored and echoed
        back as `Content-Type`, so an SVG uploaded as `image/png` is stored and
        served as `image/png`. The serving rules below never assume the type is
        harmless, which is what makes that safe.


        The resulting URL (`/pub/assets/{fileUid}`) is unsigned and stable, but
        authorized by the stored file's attachment topic: only a file attached
        under `organizations/{orgUid}/logo` is served there, and only while that
        file row is live — so replacing or clearing the logo un-publishes the
        previous image immediately. Uploaded SVGs are always served with
        `Content-Disposition: attachment` and `X-Content-Type-Options: nosniff`
        so they cannot execute as a document on the application's origin; they
        still render normally in an `img` element.
      operationId: uploadOrgLogo
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgPath"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [logo]
              properties:
                logo:
                  type: string
                  format: binary
      responses:
        "200":
          description: Updated organization profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgLogoResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          description: The uploaded logo exceeds 1 MB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Organizations]
      summary: Clear the organization logo
      description: >-
        Removes the organization's logo. **Owner only.** An uploaded image is
        retired at the same time, so its public URL stops resolving.
      operationId: deleteOrgLogo
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgPath"
      responses:
        "200":
          description: Updated organization profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgLogoResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

