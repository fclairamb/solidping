          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    OrgPath:
      name: org
      in: path
      required: true
      description: Organization slug
      schema:
        type: string
        pattern: "^[a-z0-9-]{3,20}$"

    TokenUidPath:
      name: tokenUid
      in: path
      required: true
      schema:
        type: string
        format: uuid

    CheckUidPath:
      name: checkUid
      in: path
      required: true
      schema:
        type: string
      description: Check UID (UUID) or slug

    IncidentUidPath:
      name: uid
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Incident UID

    ChannelUidPath:
      name: uid
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Channel (connection) UID

    IdentityUserUidPath:
      name: userUid
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Organization member's user UID

    MemberUidPath:
      name: uid
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Member UID

    JobUidPath:
      name: uid
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Job UID

    CheckJobUidPath:
      name: uid
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Check-schedule job UID

    JobStatusQuery:
      name: status
      in: query
      required: false
      description: Filter by job status
      schema:
        type: string

    JobTypeQuery:
      name: type
      in: query
      required: false
      description: Filter by job type
      schema:
        type: string

    JobLimitQuery:
      name: limit
      in: query
      required: false
      description: Maximum number of rows to return (1-200)
      schema:
        type: integer

    JobOffsetQuery:
      name: offset
      in: query
      required: false
      description: Number of rows to skip
      schema:
        type: integer

    ScanJobUidPath:
      name: jobUid
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Discovery scan job UID

    StatusPageUidPath:
      name: statusPageUid
      in: path
      required: true
      schema:
        type: string
      description: Status page UID or slug

    SectionUidPath:
      name: sectionUid
      in: path
      required: true
      schema:
        type: string
      description: Section UID or slug

    ResourceUidPath:
      name: resourceUid
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Resource UID

    PublicationUidPath:
      name: uid
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Incident publication UID

    IncidentUidNamedPath:
      name: incidentUid
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: >-
        Incident UID. Distinct from IncidentUidPath, which is named `uid` — the
        publication sub-routes need both an incident UID and a publication UID
        in the same path, so the incident half is named explicitly.

    SubscriberUidPath:
      name: uid
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Subscriber UID

    StatusUpdateUidPath:
      name: uid
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Status update UID

    SLOUidPath:
      name: uid
      in: path
      required: true
      schema:
        type: string
      description: SLO UID or slug

    SLOAlertPolicyUidPath:
      name: policyUid
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Burn-rate alert policy UID

    ReportScheduleUidPath:
      name: uid
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Report schedule UID

    MaintenanceWindowUidPath:
      name: uid
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Maintenance window UID

    CheckGroupUidPath:
      name: uid
      in: path
      required: true
      schema:
        type: string
      description: Check group UID or slug

    SeverityUidPath:
      name: uid
      in: path
      required: true
      schema:
        type: string
      description: Severity UID or slug

    OncallScheduleUidPath:
      name: uid
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: On-call schedule UID

    OncallOverrideUidPath:
      name: overrideUid
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: On-call schedule override UID

    EscalationPolicyUidPath:
      name: uid
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Escalation policy UID

    InvitationUidPath:
      name: uid
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Invitation UID

    MembershipRequestUidPath:
      name: uid
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Membership request UID

    FileUidPath:
      name: uid
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: File UID

    EmailSuppressionUidPath:
      name: uid
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Email suppression UID

    NotificationUidPath:
      name: notifUid
      in: path
      required: true
      schema:
        type: string
      description: Notification delivery UID

    UserUidPath:
      name: uid
      in: path
      required: true
      schema:
        type: string
      description: User UID

    RouteUidPath:
      name: routeUid
      in: path
      required: true
      schema:
        type: string
      description: Notification route UID

    ContactUidPath:
      name: contactUid
      in: path
      required: true
      schema:
        type: string
      description: Notification contact UID

    NotificationStatusQuery:
      name: status
      in: query
      required: false
      description: Filter by delivery status (e.g. sent, failed, skipped)
      schema:
        type: string

    NotificationUserUidQuery:
      name: userUid
      in: query
      required: false
      description: Filter by target user UID
      schema:
        type: string

    NotificationConnectionUidQuery:
      name: connectionUid
      in: query
      required: false
      description: Filter by connection (channel) UID
      schema:
        type: string

    NotificationLimitQuery:
      name: limit
      in: query
      required: false
      description: Maximum rows to return (default 100)
      schema:
        type: integer

    NotificationBeforeQuery:
      name: before
      in: query
      required: false
      description: Only rows created strictly before this RFC3339 timestamp
      schema:
        type: string
        format: date-time

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    StatusPageLocked:
      description: >-
        The status page is password protected and the request carried no valid
        unlock cookie. The error `code` is `STATUS_PAGE_LOCKED`, deliberately
        distinct from a generic UNAUTHORIZED: it means "unlock me", not "log
        in" — public status pages have no accounts. Obtain the cookie from
        POST /api/v1/status-pages/{org}/{slug}/unlock and replay it.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Forbidden:
      description: Permission denied
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Conflict:
      description: Resource conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    TooManyRequests:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    SupportReplyWindow:
      type: object
      description: >
        Whether a free-form reply can be sent RIGHT NOW. Derived from the last
        inbound message's timestamp and the channel's rule at read time, never
        stored — so it cannot go stale. This is a different axis from `status`:
        a thread can be open (unanswered) and yet expired (WhatsApp will no
        longer accept a free-form reply), which is exactly the state an operator
        most needs to see.
      required: [expires, open, costsMoney]
      properties:
        expires:
          type: boolean
          description: Whether this channel has a window at all. Only WhatsApp does.
        open:
          type: boolean
        expiresAt:
          type: string
          format: date-time
          nullable: true
        reason:
          type: string
          description: Operator-facing explanation of a closed window.
        costsMoney:
          type: boolean
          description: True for channels billed per reply (SMS).

    SupportThread:
      type: object
      required: [uid, channel, channelIdentity, subject, status, lastMessageAt, unreadCount]
      properties:
        uid:
          type: string
        channel:
          type: string
          enum: [whatsapp, telegram, sms, slack, discord, email]
        channelIdentity:
          type: string
          description: E.164 number, Telegram chat id, Slack/Discord user id.
        subject:
          type: string
        status:
          type: string
          enum: [open, pending, closed]
          description: Set by the operator, deliberately. Not the reply window.
        organizationUid:
          type: string
          nullable: true
          description: >
            Attribution only. Recorded when the sender resolves to a verified
            user contact; it does NOT grant that organization visibility of the
            thread.
        userUid:
          type: string
          nullable: true
        lastMessageAt:
          type: string
          format: date-time
        lastInboundAt:
          type: string
          format: date-time
          nullable: true
        unreadCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        replyWindow:
          $ref: "#/components/schemas/SupportReplyWindow"
        canReply:
          type: boolean
          description: Whether an outbound adapter exists for this channel at all.

    SupportThreadListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/SupportThread"

    SupportMessage:
      type: object
      required: [uid, threadUid, channel, direction, body, rawType, createdAt]
      properties:
        uid:
          type: string
        threadUid:
          type: string
        channel:
          type: string
        direction:
          type: string
          enum: [inbound, outbound]
        body:
          type: string
          description: >
            Attacker-influenced free text. Never render it as HTML.
        truncated:
          type: boolean
          description: True when the body exceeded the stored-body cap and was cut.
        rawType:
          type: string
          enum: [text, image, audio, video, document, location, sticker, unsupported]
        externalId:
          type: string
          nullable: true
        authorUid:
          type: string
          nullable: true
          description: The super admin who sent an outbound reply.
        delivery:
          type: object
          additionalProperties: true
          nullable: true
        createdAt:
          type: string
          format: date-time

    SupportMessageListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/SupportMessage"

    UpdateSupportThreadRequest:
      type: object
      properties:
        status:
          type: string
          enum: [open, pending, closed]
        subject:
          type: string

    CreateSupportMessageRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string

    Error:
      type: object
      required: [title, code]
      properties:
        title:
          type: string
          description: Human-readable error description
        code:
          type: string
          description: Machine-readable error code
          enum:
            - INTERNAL_ERROR
            - VALIDATION_ERROR
            - NOT_FOUND
            - UNAUTHORIZED
            - FORBIDDEN
            - CONFLICT
            - ORGANIZATION_NOT_FOUND
            - USER_NOT_FOUND
            - CHECK_NOT_FOUND
            - TOKEN_NOT_FOUND
            - NO_TOKEN
            - INVALID_TOKEN
            - INVALID_ORG
            - INVALID_CREDENTIALS
            - CHECK_HAS_ACTIVE_INCIDENTS
        detail:
          type: string
          description: Detailed error explanation
        fields:
          type: array
          description: Field-level validation errors (present for VALIDATION_ERROR)
          items:
            $ref: "#/components/schemas/ValidationErrorField"

    ValidationErrorField:
      type: object
      required: [name, message]
      properties:
        name:
          type: string
          description: Field name the finding is about
        message:
          type: string
          description: Human-readable message for this field
        severity:
          type: string
          enum: [error, warning, info]
          description: >
            How the finding should be treated. ABSENT MEANS `error`: the field
            was added after this shape shipped, and a producer that omits it is
            always reporting a blocking error. Only `error` findings make a
            validation response invalid; `warning` and `info` never block.
        code:
          type: string
          description: >
            Stable machine identifier for the rule that produced this finding
            (e.g. `SLUG_TAKEN`, `ORG_RATE_OVER_LIMIT`). Absent when the producer
            has no code to offer, in which case clients fall back to
            `name` + `message`.

    # Management schemas
    VersionResponse:
      type: object
      properties:
        version:
          type: string
        commit:
          type: string
        gitTime:
          type: string
        runMode:
          type: string

    CostDistributionPercentiles:
      type: object
      description: p50/p90/p99/max summary of a metric (milliseconds).
      properties:
        p50:
          type: number
          format: double
        p90:
          type: number
          format: double
        p99:
          type: number
          format: double
        max:
          type: number
          format: double

    CostDistribution:
      type: object
      properties:
        totalJobs:
          type: integer
          description: Number of check_jobs rows considered.
        thresholdMs:
          type: integer
          description: Candidate fast/slow boundary used for the counts (ms).
        fastJobs:
          type: integer
          description: Count with cost_ewma_ms <= thresholdMs.
        slowJobs:
          type: integer
          description: Count with cost_ewma_ms > thresholdMs.
        costEwmaMs:
          allOf:
            - $ref: "#/components/schemas/CostDistributionPercentiles"
          description: >-
            Distribution of cost_ewma_ms — per-job EWMA of execution duration
            (ms), timeouts pinned to the execution ceiling. This is the only
            signal that steers claim ordering (deprioritization offset =
            cost × 2, clamped to 60s).
        delayEwmaMs:
          allOf:
            - $ref: "#/components/schemas/CostDistributionPercentiles"
          description: >-
            Distribution of delay_ewma_ms — per-job EWMA of probe start
            lateness versus the user-configured scheduled_at (probe start −
            scheduled_at, floored at 0, in ms). Pure telemetry: it measures
            head-of-line blocking under contention but does not steer claim
            ordering (the deprioritization offset is cost-only). A probe that
            starts on time contributes 0.

    CostDistributionResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/CostDistribution"

    LimitsRateLimit:
      type: object
      description: Rate-limit section of the limits response.
      required: [enabled]
      properties:
        enabled:
          type: boolean
        requestsPerMinute:
          type: integer
        burst:
          type: integer
        callerRemaining:
          type: number
          format: double
          description: >
            Tokens remaining in the caller's bucket. Present only when rate
            limiting is enabled.

    LimitsConcurrency:
      type: object
      description: Concurrency section of the limits response.
      required: [enabled]
      properties:
        enabled:
          type: boolean
        max:
          type: integer
        callerInFlight:
          type: integer
          description: >
            In-flight requests for the caller. Present only when concurrency
            limiting is enabled.

    LimitsResponse:
      type: object
      required: [rateLimit, concurrency, callerIp, callerBucket]
      properties:
        rateLimit:
          $ref: "#/components/schemas/LimitsRateLimit"
        concurrency:
          $ref: "#/components/schemas/LimitsConcurrency"
        callerIp:
          type: string
          description: Client IP the limiter resolved for this request (respecting trusted proxies).
        callerBucket:
          type: string
          description: Which bucket the caller's traffic is accounted against — "ip" or "token".

    MemoryRuntime:
      type: object
      description: runtime.MemStats / goroutine slice of the memory snapshot.
      properties:
        heapAllocBytes:
          type: integer
          format: int64
        heapInuseBytes:
          type: integer
          format: int64
        heapObjects:
          type: integer
          format: int64
        stackInuseBytes:
          type: integer
          format: int64
        sysBytes:
          type: integer
          format: int64
        numGoroutine:
          type: integer
        numGc:
          type: integer
          format: int64
        gcPauseTotalNs:
          type: integer
          format: int64
        nextGcBytes:
          type: integer
          format: int64
        gcCpuFraction:
          type: number
          format: double
        goMemLimitBytes:
          type: integer
          format: int64
          description: Effective GOMEMLIMIT soft cap; 0 means unlimited.
        goMaxProcs:
          type: integer

    MemoryProcess:
      type: object
      description: OS-level process memory.
      properties:
        rssBytes:
          type: integer
          format: int64

    MemorySubsystems:
      type: object
      description: Cardinalities of the suspect subsystems.
      properties:
        dekCacheEntries:
          type: integer
        rateLimitEntries:
          type: integer
        eventListeners:
          type: integer

    MemoryBuild:
      type: object
      description: Build facts relevant to off-heap accounting.
      properties:
        cgoEnabled:
          type: boolean
        sqliteDriver:
          type: string
        goVersion:
          type: string

    MemorySnapshot:
      type: object
      properties:
        runtime:
          $ref: "#/components/schemas/MemoryRuntime"
        process:
          $ref: "#/components/schemas/MemoryProcess"
        subsystems:
          $ref: "#/components/schemas/MemorySubsystems"
        build:
          $ref: "#/components/schemas/MemoryBuild"

    MemorySnapshotResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/MemorySnapshot"

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok, unhealthy]
        node:
          type: object
          properties:
            role:
              type: string
            region:
              type: string
        fault:
          type: string
          description: >
            Name of the structural database fault that made this node
            unhealthy (e.g. undefined_table). Present only with status
            "unhealthy", which is also served with HTTP 503; the node is
            shutting down because no retry can recover the condition.

    # Authentication schemas
    DeviceAuthorizationRequest:
      type: object
      properties:
        clientName:
          type: string
          maxLength: 200
          description: Label shown to the approving user on the consent page
        clientId:
          type: string
          description: Accepted for OAuth compatibility and ignored

    DeviceAuthorizationResponse:
      type: object
      required: [device_code, user_code, verification_uri, verification_uri_complete, expires_in, interval]
      properties:
        device_code:
          type: string
          description: The client's secret — the real capability. Never displayed in a browser.
        user_code:
          type: string
          description: Short human-typed code, displayed as XXXX-XXXX
        verification_uri:
          type: string
        verification_uri_complete:
          type: string
        expires_in:
          type: integer
        interval:
          type: integer
          description: Minimum seconds between polls; polling faster earns slow_down

    DeviceTokenRequest:
      type: object
      required: [grant_type, device_code]
      properties:
        grant_type:
          type: string
          enum: ["urn:ietf:params:oauth:grant-type:device_code"]
        device_code:
          type: string
        client_id:
          type: string

    DeviceTokenResponse:
      type: object
      required: [access_token, token_type]
      properties:
        access_token:
          type: string
          description: A solidping personal access token, usable directly as a bearer credential
        token_type:
          type: string
          enum: [Bearer]

    DeviceTokenError:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum:
            [
              authorization_pending,
              slow_down,
              expired_token,
              access_denied,
              invalid_request,
              unsupported_grant_type,
            ]
        error_description:
          type: string

    DeviceConsentInfo:
      type: object
      required: [clientName, userCode, status, expiresAt]
      properties:
        clientName:
          type: string
        userCode:
          type: string
        status:
          type: string
          enum: [pending, approved, denied]
        expiresAt:
          type: string
          format: date-time

    DeviceConsentRequest:
      type: object
      required: [userCode]
      properties:
        userCode:
          type: string
        org:
          type: string
          description: >-
            Slug of the organization the approved token is scoped to. Defaults to
            the approving session's organization when omitted.
        approve:
          type: boolean

    DeviceConsentResponse:
      type: object
      properties:
        approved:
          type: boolean

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        org:
          type: string
          description: Organization slug (optional, defaults to user's most recent org)
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8

    SwitchOrgRequest:
      type: object
      required: [org]
      properties:
        org:
          type: string
          description: Target organization slug

    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
        user:
          $ref: "#/components/schemas/UserSummary"
        organization:
          $ref: "#/components/schemas/OrganizationSummary"
        organizations:
          type: array
          items:
            $ref: "#/components/schemas/OrganizationMemberSummary"
          description: Available organizations for the user
        loginAction:
          type: string
          enum: ["", orgRedirect, orgChoice, noOrg]
          description: Indicates how the frontend should handle the login result

    LogoutRequest:
      type: object
      properties:
        deleteAllTokens:
          type: boolean

    LogoutResponse:
      type: object
      properties:
        success:
          type: boolean
        tokensDeleted:
          type: integer
        message:
          type: string

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    RefreshResponse:
      type: object
      properties:
        accessToken:
          type: string
        expiresIn:
          type: integer

    MeResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/UserSummary"
        organization:
          $ref: "#/components/schemas/OrganizationSummary"
        organizations:
          type: array
          items:
            $ref: "#/components/schemas/OrganizationMemberSummary"

    OrganizationSummary:
      type: object
      properties:
        uid:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string

    OrganizationMemberSummary:
      type: object
      properties:
        slug:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [owner, admin, user, viewer]

    UserSummary:
      type: object
      properties:
        uid:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        avatarUrl:
          type: string
        role:
          type: string
          enum: [owner, admin, user, viewer]
        mustChangePassword:
          type: boolean
          description: >
            True when this account must rotate its password before it can do
            anything else. The session returned alongside this flag reaches only
            POST /auth/change-password, GET /auth/me and POST /auth/logout;
            every other endpoint answers 403 with code PASSWORD_CHANGE_REQUIRED.
            Omitted when false.

    CreateTokenRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        expiresAt:
          type: string
          format: date-time

    CreateTokenResponse:
      type: object
      properties:
        token:
          type: string
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time

    Token:
      type: object
      properties:
        uid:
          type: string
          format: uuid
        name:
          type: string
        orgSlug:
          type: string
          description: Organization slug the token belongs to
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time

    TokenListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Token"

    MessageResponse:
      type: object
      properties:
        message:
          type: string

    UpdateProfileRequest:
      type: object
      properties:
        name:
          type: string
          description: New display name for the authenticated user

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8

    ConfirmRegistrationRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: Registration confirmation token from the emailed link

    RequestPasswordResetRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          description: Password reset token from the emailed link
        password:
          type: string
          minLength: 8

    ChangePasswordRequest:
      type: object
      required: [newPassword]
      properties:
        currentPassword:
          type: string
          description: >
            The password currently on the account. Required unless the account
            has no password yet (SSO-only sign-up), in which case it is ignored.
        newPassword:
          type: string
          minLength: 8
          description: Must differ from the current password.

    AcceptInviteRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: Invitation token from the emailed link
        name:
          type: string
          description: Display name for a newly created user
        password:
          type: string
          minLength: 8
          description: Password for a newly created user (ignored if the user already exists)

    InviteInfoResponse:
      type: object
      properties:
        orgName:
          type: string
        orgSlug:
          type: string
        role:
          type: string
          enum: [admin, user, viewer]
        email:
          type: string
          description: Masked email address the invitation was sent to

    AuthProvider:
      type: object
      properties:
        name:
          type: string
        type:
          type: string

    AuthProvidersResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AuthProvider"
        registrationEnabled:
          type: boolean
        passkeysEnabled:
          type: boolean

    PublicConfigResponse:
      type: object
      description: |
        Browser-safe public configuration. Designed as a general-purpose blob:
        future public feature flags are added as sibling properties rather than
        as new endpoints.
      properties:
        posthog:
          $ref: "#/components/schemas/PublicPostHogConfig"
        whatsapp:
          $ref: "#/components/schemas/PublicWhatsAppConfig"
        telegram:
          $ref: "#/components/schemas/PublicTelegramConfig"

    PublicTelegramConfig:
      type: object
      required: [enabled]
      description: |
        Instance-level Telegram capability flag. The dashboard reads it to
        decide whether to offer the "Connect Telegram" action and the
        `telegram` severity channel. The bot token and the webhook secret are
        never exposed here; the bot *username* is public by nature (anyone can
        find the bot in Telegram) and the browser needs it to build the connect
        deep link.
      properties:
        enabled:
          type: boolean
          description: |
            Resolved enablement, i.e. `telegram.enabled == true` **and** a
            non-empty bot token **and** a non-empty bot username. False on any
            deployment that has not configured a bot.
        botUsername:
          type: string
          description: |
            The bot's @username without the leading '@'. Present only when
            `enabled` is true.
          example: solidping_bot

    PublicWhatsAppConfig:
      type: object
      required: [enabled]
      description: |
        Instance-level WhatsApp capability flag. The dashboard reads it to
        decide whether to offer the WhatsApp notification-contact type and the
        `whatsapp` severity channel. No credential, phone-number id, WABA id or
        template name is ever exposed here.
      properties:
        enabled:
          type: boolean
          description: |
            Resolved enablement, i.e. `whatsapp.enabled == true` **and** a
            non-empty access token **and** a non-empty phone-number id. False
            on any deployment that has not configured a WABA.

    PublicPostHogConfig:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: |
            Resolved enablement, i.e. `posthog.enabled == true` **and** a
            non-empty `posthog.project_api_key`. False on any deployment that
            has not explicitly configured a project key.
        projectApiKey:
          type: string
          description: |
            Public `phc_…` browser ingestion key. Present **only** when
            `enabled` is true; omitted entirely otherwise.
        host:
          type: string
          description: |
            PostHog ingestion host. Present **only** when `enabled` is true;
            omitted entirely otherwise.
          example: https://eu.i.posthog.com

    # Check schemas
    Check:
      type: object
      properties:
        uid:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string
          description: Optional documentation describing what this check monitors
        type:
          type: string
          enum: [http, tcp, icmp, dns, ssl, domain]
        config:
          type: object
          description: >-
            Check-specific configuration; the fields accepted depend on
            `type`. HTTP checks additionally accept `verifySsl` (boolean,
            default true — set false to skip TLS certificate verification),
            `followRedirects` (boolean, default true — set false to stop
            at the first response instead of following redirects) and
            `capture_failure_response` (boolean, default false — when true a
            FAILING execution keeps what the probe received: status line,
            redacted response headers and a 16 KiB-capped body, stored on the
            incident it opens as `details.failureResponse`. Opt-in because a
            response body can contain PII; never exposed on a status page).
            See wiki/conventions/checker-config.md for the full per-type field
            reference.
        targetHost:
          type: string
          nullable: true
          readOnly: true
          description: >-
            Derived, read-time-only host this check probes: the config's
            `host` field when present, else the hostname parsed from `url`,
            else `target`; null when none apply (e.g. heartbeat/email passive
            checks). Not stored — renaming a host in a check's config moves it
            to a different value on the next read. Use `?sort=targetHost` on
            the list endpoint to order checks by it.
        warnings:
          type: array
          readOnly: true
          description: >-
            Advisory notes attached to a SUCCESSFUL create or update — the check
            was written and will run. Today the only one is "you pinned
            `ipVersion: ipv6` in a region whose live workers report no IPv6
            egress". Absent on read paths.
          items:
            $ref: "#/components/schemas/ValidationErrorField"
        enabled:
          type: boolean
        internal:
          type: boolean
          readOnly: true
          description: >-
            Whether this check is internal (hidden from default listings).
            READ-ONLY: `internal` marks server-created plumbing (worker
            self-stat checks) and is what exempts a check from `maxChecks`,
            from the checks-per-minute demand figure and from the per-org
            execution rate limit. A create, update, upsert or import that
            carries it is refused with a `VALIDATION_ERROR` naming the field.
        period:
          type: string
          description: Interval duration (e.g., "00:01:00" for 1 minute)
        regionSpread:
          type: string
          nullable: true
          description: >-
            Optional inter-region scheduling offset (e.g., "00:00:20"). Every
            selected region runs the check at the full period; this staggers
            their phases. Null uses the default of period ÷ region count. Must
            satisfy 0 <= regionSpread < period.
        checkGroupUid:
          type: string
          format: uuid
          nullable: true
          description: Group this check belongs to, or null.
        escalationPolicyUid:
          type: string
          format: uuid
          nullable: true
          description: >-
            Escalation policy assigned directly to this check. When null, the
            check inherits its group's policy, then the org default, then none
            (resolved once at incident-open). Assigning a zero-step policy is the
            "explicitly silent" convention.
        labels:
          type: object
          additionalProperties:
            type: string
          description: Key-value pairs for organizing and filtering checks
          example:
            env: prod
            app: api
        lastResult:
          $ref: "#/components/schemas/LastResult"
        lastStatusChange:
          type: object
          nullable: true
          description: >-
            When the check's status last changed, and what it changed to (only
            included when with=last_status_change). This is the *derived* check
            status — the same value as the `status` field, which respects the
            confirmation and recovery periods and the flapping backoff — so a
            single unconfirmed failed probe does not reset the timer.


            Absent for checks that have never recorded a status transition:
            there is no fallback to the creation time and no fallback to the
            raw probe history.
          properties:
            time:
              type: string
              format: date-time
              description: ISO 8601 timestamp of when the status change occurred
            status:
              type: string
              enum: [UP, DOWN, VALIDATING, WARNING, DEGRADED, CREATED, UNKNOWN]
              description: The status that the check transitioned to
        tracerouteOnFailure:
          type: string
          enum: [inherit, "on", "off"]
          description: >-
            Per-check path-trace policy. When a network-reachability failure
            (connect timeout, refusal, ICMP loss, TLS handshake stall) opens or
            reopens an incident for this check, an MTR-style traceroute is
            captured and attached. `inherit` defers to the organization default
            (itself on unless an admin turned it off); `on` and `off` decide for
            this check. Application-level failures (HTTP 5xx, keyword mismatch,
            certificate expiry) never trigger a trace, whatever this is set to.
          default: inherit
        flappingWindowSeconds:
          type: integer
          description: >-
            Flapping (adaptive recovery) window. If a check flaps repeatedly
            within this rolling window, it must stay stable progressively longer
            before each auto-resolve. 0 = adaptive recovery off (constant
            recovery period).
          default: 21600
        flapBackoffFactor:
          type: integer
          minimum: 1
          description: >-
            Each flap multiplies the required recovery time by this factor.
            1 = off (constant recovery period).
          default: 2
        maxRecoveryMultiplier:
          type: integer
          minimum: 1
          description: >-
            Cap on the adaptive recovery period: required recovery never exceeds
            this multiple of the base recovery period (also hard-capped at 30
            minutes).
          default: 8
        flapState:
          type: object
          nullable: true
          description: >-
            Live adaptive-recovery (flapping) state — the effective,
            lazy-reset-aware counterpart of flappingWindowSeconds /
            flapBackoffFactor / maxRecoveryMultiplier above. Omitted when the
            flapping feature is off for this check, or when no flap state has
            accumulated (no outage yet, or the rolling window has since
            lapsed).
          properties:
            flapCount:
              type: integer
              description: >-
                Number of outages counted inside the current rolling flapping
                window. 1 means the 2nd outage within the window — the first
                one that actually counts as a flap.
            lastOutageAt:
              type: string
              format: date-time
              description: >-
                Wall-clock of the most recent outage onset that counted
                against the window.
            effectiveRecoveryPeriodSeconds:
              type: integer
              description: >-
                Stability currently required before an open incident on this
                check auto-resolves, given flapCount.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        scheduling:
          $ref: "#/components/schemas/CheckScheduling"

    CheckScheduling:
      type: object
      description: >-
        Read-only scheduling telemetry, derived from the check's per-region
        scheduler jobs (max across regions). Present only on the check DETAIL
        response (GET by uid/slug) — never on list responses — and omitted
        until the check's first run produces a cost signal.
      required: [costEwmaMs, delayEwmaMs, dutyCyclePct]
      properties:
        costEwmaMs:
          type: number
          description: Smoothed execution cost in milliseconds (EWMA).
        delayEwmaMs:
          type: number
          description: >-
            Smoothed start lateness in milliseconds (EWMA, pure telemetry).
        dutyCyclePct:
          type: integer
          description: >-
            round(100 × costEwmaMs / period in ms) — the share of a runner
            slot this check permanently occupies. 100 means the check takes as
            long to run as its period (a full-time slot).

    LastResult:
      type: object
      description: >-
        Full last-execution result. Present only on the check DETAIL response
        (GET/POST/PUT/PATCH by uid/slug) — the detail page renders output,
        metrics, and the SSL-chain card from these fields. List responses
        (GET /checks) use the slimmer LastResultListItem instead, which omits
        output/metrics: no list consumer (checks table, org dashboard, status
        dashboard) reads them, and they can be large (SSL cert chains,
        DNSBL details).
      properties:
        uid:
          type: string
          format: uuid
        status:
          type: string
          enum: [up, warning, degraded, down, timeout, error, created, abandoned, unknown]
          description: >-
            Result status, mirroring every value `resultStatusString` can
            return: `up` and `warning` both count as available (`warning` is
            "up, but something to report"), `degraded` only appears on
            aggregated rollup rows, `down`/`timeout`/`error` are genuine
            failures, `created` is an attempt that has not been executed yet,
            and `unknown` covers a missing or unrecognised raw status.
            `abandoned` is server-minted by the abandoned-result
            reaper when nothing was ever reported for an attempt (a worker
            crashed, restarted, or lost its lease). It is terminal but is
            excluded from every availability calculation, so it must be
            rendered as a neutral "not counted" state, never as a failure.
        timestamp:
          type: string
          format: date-time
          description: When the check was executed
        durationMs:
          type: number
          description: Response time in milliseconds
        output:
          type: object
          description: Diagnostic output and error messages
        metrics:
          type: object
          description: Performance metrics (e.g., response time, DNS time)

    LastResultListItem:
      type: object
      description: >-
        Slim last-execution result used on list responses (GET /checks) —
        {uid, status, timestamp, durationMs} only. See LastResult for the
        full detail-response shape.
      properties:
        uid:
          type: string
          format: uuid
        status:
          type: string
          enum: [up, warning, degraded, down, timeout, error, created, abandoned, unknown]
          description: >-
            Result status, mirroring every value `resultStatusString` can
            return: `up` and `warning` both count as available (`warning` is
            "up, but something to report"), `degraded` only appears on
            aggregated rollup rows, `down`/`timeout`/`error` are genuine
            failures, `created` is an attempt that has not been executed yet,
            and `unknown` covers a missing or unrecognised raw status.
            `abandoned` is server-minted by the abandoned-result
            reaper when nothing was ever reported for an attempt (a worker
            crashed, restarted, or lost its lease). It is terminal but is
            excluded from every availability calculation, so it must be
            rendered as a neutral "not counted" state, never as a failure.
        timestamp:
          type: string
          format: date-time
          description: When the check was executed
        durationMs:
          type: number
          description: Response time in milliseconds

    CheckListItem:
      description: >-
        A check as it appears on the list endpoint (GET /checks) — identical
        to Check except lastResult is the slim LastResultListItem shape and
        scheduling is never present (detail-only, see CheckScheduling).
      allOf:
        - $ref: "#/components/schemas/Check"
        - type: object
          properties:
            lastResult:
              $ref: "#/components/schemas/LastResultListItem"

    CheckListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/CheckListItem"

    CheckStats:
      type: object
      required: [total, enabled, disabled, byStatus, down, hardDown, availability24h]
      properties:
        total:
          type: integer
          description: Every in-scope check — enabled plus disabled.
          example: 262
        enabled:
          type: integer
          description: Checks with enabled = true.
          example: 250
        disabled:
          type: integer
          description: Checks with enabled = false.
          example: 12
        byStatus:
          type: object
          additionalProperties:
            type: integer
          description: >-
            Count per check status. Every known status key (created, up, down,
            validating, degraded, warning, unknown) is always present, with 0
            when empty, so clients can index it without guards. Keys are the
            same tokens the list endpoint's `status` field carries.
          example:
            created: 2
            up: 240
            down: 6
            validating: 0
            degraded: 2
            warning: 0
            unknown: 0
        down:
          type: integer
          description: >-
            Checks the dashboard renders as failing (status down, error or
            timeout). `error` and `timeout` are result-level statuses a check
            status never holds, so in practice this equals byStatus.down.
          example: 6
        hardDown:
          type: integer
          description: >-
            Checks failing hard (status down or error), i.e. down excluding
            timeouts.
          example: 6
        availability24h:
          type: number
          nullable: true
          description: >-
            100 * successful / total over the trailing 24h window, combining
            `hour` rollup rows and `raw` result rows (successful = up +
            warning; lifecycle markers and reaped/abandoned raw rows are
            excluded from both sides). `null` when the window has no
            countable data (an empty or brand-new org) — never a fabricated
            100.
          example: 99.97

    CreateCheckRequest:
      type: object
      required: [config]
      properties:
        tracerouteOnFailure:
          type: string
          enum: [inherit, "on", "off"]
          description: >-
            Per-check path-trace policy (see the Check schema). `inherit` puts
            the check back under the organization default. Omit to leave
            unchanged.
        name:
          type: string
          description: Check name (auto-generated from URL if not provided)
        slug:
          type: string
          pattern: "^[a-z0-9_-]{3,40}$"
          description: URL-friendly identifier (auto-generated from URL if not provided)
        description:
          type: string
          description: Optional documentation about the check
        type:
          type: string
          enum: [http, tcp, icmp, dns, ssl, domain]
          description: Check type (auto-inferred from URL if not provided)
        config:
          type: object
          description: >-
            Check-specific configuration (e.g., url, port, timeout). HTTP
            checks additionally accept `verifySsl` and `followRedirects`
            (both booleans, default true) and `capture_failure_response`
            (boolean, default false) — see the Check schema above for
            details.
        enabled:
          type: boolean
          default: true
        period:
          type: string
          default: "00:01:00"
        regionSpread:
          type: string
          nullable: true
          description: >-
            Optional inter-region scheduling offset (e.g., "00:00:20"). Null (or
            omitted) uses the default of period ÷ region count. Must satisfy
            0 <= regionSpread < period.
        checkGroupUid:
          type: string
          format: uuid
          description: Group to place this check in.
        escalationPolicyUid:
          type: string
          format: uuid
          description: >-
            Escalation policy to assign to this check. Omit or empty to inherit
            (group → org default → none). A zero-step policy makes the check
            explicitly silent.
        labels:
          type: object
          additionalProperties:
            type: string
          description: Key-value pairs for organizing checks
          example:
            env: prod
            app: api
        flappingWindowSeconds:
          type: integer
          minimum: 0
          default: 21600
          description: >-
            Flapping (adaptive recovery) window in seconds. Outages within this
            rolling window accumulate the recovery backoff. 0 = off.
        flapBackoffFactor:
          type: integer
          minimum: 1
          default: 2
          description: >-
            Each flap multiplies the required recovery time by this factor.
            1 = off (constant recovery).
        maxRecoveryMultiplier:
          type: integer
          minimum: 1
          default: 8
          description: >-
            Cap: required recovery never exceeds this multiple of the base
            recovery period (also hard-capped at 30 minutes).

    UpdateCheckRequest:
      type: object
      properties:
        tracerouteOnFailure:
          type: string
          enum: [inherit, "on", "off"]
          description: >-
            Per-check path-trace policy (see the Check schema). `inherit` puts
            the check back under the organization default. Omit to leave
            unchanged.
        name:
          type: string
        slug:
          type: string
          pattern: "^[a-z0-9_-]{3,40}$"
        description:
          type: string
          description: Optional documentation about the check
        config:
          type: object
        enabled:
          type: boolean
        period:
          type: string
        regionSpread:
          type: string
          nullable: true
          description: >-
            Optional inter-region scheduling offset (e.g., "00:00:20"). An empty
            string clears it back to the default of period ÷ region count. Must
            satisfy 0 <= regionSpread < period.
        checkGroupUid:
          type: string
          nullable: true
          description: Group to move this check to; empty string clears it (no group).
        escalationPolicyUid:
          type: string
          description: >-
            Escalation policy for this check. A UID assigns it; an empty string
            clears it (inherit group → org default → none); omit to leave
            unchanged. A zero-step policy makes the check explicitly silent.
        labels:
          type: object
          additionalProperties:
            type: string
          description: Key-value pairs (null = no change, empty object = clear all)
        flappingWindowSeconds:
          type: integer
          minimum: 0
          description: >-
            Flapping (adaptive recovery) window in seconds. 0 = off. Omit to
            leave unchanged.
        flapBackoffFactor:
          type: integer
          minimum: 1
          description: >-
            Each flap multiplies the required recovery time by this factor.
            1 = off. Omit to leave unchanged.
        maxRecoveryMultiplier:
          type: integer
          minimum: 1
          description: >-
            Cap on the adaptive recovery period (multiple of the base recovery
            period). Omit to leave unchanged.

    UpsertCheckRequest:
      type: object
      required: [config]
      properties:
        tracerouteOnFailure:
          type: string
          enum: [inherit, "on", "off"]
          description: >-
            Per-check path-trace policy (see the Check schema). Sent
            explicitly by import/apply so a manifest that says `inherit` moves
            a check back off an explicit override rather than leaving it.
        name:
          type: string
          description: Check name (auto-generated from URL if not provided)
        description:
          type: string
          description: Optional documentation about the check
        type:
          type: string
          enum: [http, tcp, icmp, dns, ssl, domain]
          description: Check type (auto-inferred from URL if not provided)
        config:
          type: object
          description: >-
            Check-specific configuration. HTTP checks additionally accept
            `verifySsl` and `followRedirects` (both booleans, default true)
            and `capture_failure_response` (boolean, default false) — see the
            Check schema above for details.
        enabled:
          type: boolean
          default: true
        period:
          type: string
          default: "00:01:00"
        escalationPolicyUid:
          type: string
          description: >-
            Escalation policy for this check. Omit or empty to inherit
            (group → org default → none); a zero-step policy makes it silent.
        labels:
          type: object
          additionalProperties:
            type: string
          description: Key-value pairs for organizing checks
          example:
            env: prod
            app: api
        dependsOn:
          type: array
          description: |
            Replaces the full dependsOn set when present. Omit to leave deps
            unchanged; pass `[]` to clear.
          items:
            $ref: "#/components/schemas/ExportedDependency"

    ValidateCheckRequest:
      type: object
      required: [type, config]
      properties:
        type:
          type: string
          description: Check type (http, tcp, ping, dns, ssl, ...)
        slug:
          type: string
          description: >
            Proposed slug. Validated for format and, within the organization,
            for uniqueness against live checks.
        config:
          type: object
          additionalProperties: true
        regions:
          type: array
          description: >
            Proposed region set. Needed by the tunnel region rules, the
            region-capability hints and the checks-per-minute projection — a
            check executes once per region per period.
          items:
            type: string
        period:
          type: string
          description: >
            Proposed execution interval (`HH:MM:SS` or a Go duration). Optional;
            when absent, neither the per-type period bounds nor the
            checks-per-minute projection are evaluated.
        enabled:
          type: boolean
          description: >
            Proposed enabled state; absent means enabled. A disabled check is
            scheduled nowhere and can never push the organization over its
            checks-per-minute cap.
        excludeCheckUid:
          type: string
          description: >
            UID of the check being edited. Its slug is then not reported as a
            collision with itself, and the checks-per-minute projection replaces
            its stored row instead of adding a second one. Omit when creating.
        dependsOn:
          type: array
          items:
            $ref: "#/components/schemas/ExportedDependency"

    ValidateCheckResponse:
      type: object
      required: [valid]
      description: >
        The result of a dry run. Every finding it can compute is reported, not
        just the first, and each entry carries a `severity` and a machine
        `code`. The two arrays are the severity split: `fields` blocks,
        `warnings` advises.
      properties:
        valid:
          type: boolean
          description: >
            False exactly when `fields` is non-empty. Warnings never make a
            configuration invalid.
        fields:
          type: array
          description: >
            Every blocking finding, not just the first. Codes in use:
            `UNSUPPORTED_TYPE`, `INVALID_CONFIG`, `INVALID_PERIOD`,
            `INVALID_SLUG`, `SLUG_TAKEN`, `INVALID_DEPENDS_ON`.
            `SLUG_TAKEN` is advisory by nature — the value can be claimed
            between this answer and the save, so creation still answers 409.
          items:
            $ref: "#/components/schemas/ValidationErrorField"
        warnings:
          type: array
          description: >
            Advisory, per-field notes that do NOT make the configuration
            invalid — `valid` stays true and the write path accepts it.
            `REGION_NO_IPV6` / `REGION_NO_BROWSER` report a region whose live
            workers advertise no IPv6 egress or no headless Chrome; those are
            deliberately warnings and never rejections, because the advertised
            capability lags reality and the run-time probe is the authority.
            `ORG_RATE_OVER_LIMIT` on the `period` field reports that the
            proposed period/regions would put the organization's scheduled
            checks-per-minute demand over its `maxChecksPerMinute` cap, so some
            executions would be skipped; it never blocks, precisely because an
            over-limit organization has to be able to edit its way back under
            the cap. Passive check types (heartbeat, email) are exempt from it.
          items:
            $ref: "#/components/schemas/ValidationErrorField"

    CloneCheckRequest:
      type: object
      description: Optional overrides applied to the cloned check.
      properties:
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        checkGroupUid:
          type: string
        enabled:
          type: boolean

    ExportedDependency:
      type: object
      required: [parentSlug]
      properties:
        parentSlug:
          type: string
          description: Slug of the parent check this check depends on
        kind:
          type: string
          enum: [hard, soft]
          default: hard
        description:
          type: string

    Dependency:
      type: object
      required: [uid, parentCheck, childCheck, kind]
      properties:
        uid:
          type: string
          format: uuid
        parentCheck:
          $ref: "#/components/schemas/CheckRef"
        childCheck:
          $ref: "#/components/schemas/CheckRef"
        kind:
          type: string
          enum: [hard, soft]
        description:
          type: string

    CheckRef:
      type: object
      required: [uid, slug, name]
      properties:
        uid:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string

    PerCheckDependenciesResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            dependsOn:
              type: array
              items:
                $ref: "#/components/schemas/Dependency"
            dependedOnBy:
              type: array
              items:
                $ref: "#/components/schemas/Dependency"

    CreateDependencyRequest:
      type: object
      required: [parentCheckUid, kind]
      properties:
        parentCheckUid:
          type: string
          description: UID or slug of the parent check
        kind:
          type: string
          enum: [hard, soft]
        description:
          type: string

    UpdateDependencyRequest:
      type: object
      properties:
        kind:
          type: string
          enum: [hard, soft]
        description:
          type: string

    DependencyGraphNode:
      type: object
      required: [uid, slug, name]
      properties:
        uid:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string

    DependencyGraphEdge:
      type: object
      required: [uid, parentCheckUid, childCheckUid, kind]
      properties:
        uid:
          type: string
          format: uuid
        parentCheckUid:
          type: string
          format: uuid
        childCheckUid:
          type: string
          format: uuid
        kind:
          type: string
          enum: [hard, soft]

    OrgDependencyGraphResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            nodes:
              type: array
              items:
                $ref: "#/components/schemas/DependencyGraphNode"
            edges:
              type: array
              items:
                $ref: "#/components/schemas/DependencyGraphEdge"

    # Result schemas
    OrgResultListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/OrgResult"
        pagination:
          $ref: "#/components/schemas/ResultsCursorPagination"
        window:
          $ref: "#/components/schemas/ResultsWindow"

    ResultsWindow:
      type: object
      description: >-
        The time window the server actually queried. A raw-only request is
        clamped to the raw-retention band, so this is not always the window
        that was asked for. Always present — `clamped: false` is an answer,
        letting a client tell a clamp from a genuinely empty range and size a
        follow-up request. Additive and optional to read.
      properties:
        periodStartAfter:
          type: string
          format: date-time
          description: Effective `period_start >=` bound; absent when unbounded.
        periodEndBefore:
          type: string
          format: date-time
          description: >-
            Effective `period_start <` bound (not `period_end` — see the query
            parameter description); absent when unbounded.
        clamped:
          type: boolean
          description: >-
            True when the server moved `periodStartAfter` forward from the
            requested value.

    CheckAvailabilityResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AvailabilityPeriod"

    AvailabilityPeriod:
      type: object
      properties:
        period:
          type: string
          description: The requested period token, echoed back.
          example: "7d"
        windowStart:
          type: string
          format: date-time
          description: Start of the resolved window (inclusive).
        windowEnd:
          type: string
          format: date-time
          description: End of the resolved window (exclusive) — always "now".
        monitoredSeconds:
          type: integer
          format: int64
          description: >
            min(windowLength, now − check.createdAt). Time before the check
            existed is not measured (and not downtime).
        partial:
          type: boolean
          description: >
            True when the check is younger than the window, so it was monitored
            for only part of it.
        hasData:
          type: boolean
          description: False when the window has no countable probes (then availabilityPct is null).
        totalChecks:
          type: integer
          description: Total countable probes in the window.
        successfulChecks:
          type: integer
          description: Probes counted as up (up + warning).
        availabilityPct:
          type: number
          nullable: true
          description: >
            Probe-ratio availability (successfulChecks / totalChecks × 100).
            Null when totalChecks == 0 — no data is not 100%.
        downtimeSeconds:
          type: integer
          format: int64
          description: >
            Probe-time downtime: (1 − availabilityPct/100) × monitoredSeconds.
        incidents:
          $ref: "#/components/schemas/PeriodIncidents"

    PeriodIncidents:
      type: object
      description: >
        Confirmed-outage (wall-clock) stats for the window, built from incidents
        whose started_at falls inside it, clamped to the window edges (an
        unresolved incident runs to now).
      properties:
        count:
          type: integer
          description: Number of incidents that started in the window.
        longestSeconds:
          type: integer
          format: int64
          description: Longest single incident, clamped to the window.
        averageSeconds:
          type: integer
          format: int64
          description: Average incident duration.
        totalDowntimeSeconds:
          type: integer
          format: int64
          description: Sum of clamped incident durations.

    OrgResult:
      type: object
      properties:
        uid:
          type: string
          format: uuid
        checkUid:
          type: string
          format: uuid
        periodType:
          type: string
        periodStart:
          type: string
          format: date-time
        periodEnd:
          type: string
          format: date-time
        status:
          type: string
          enum: [up, warning, degraded, down, created, running, abandoned, unknown]
          description: >-
            Result status, mirroring every value `statusIntToString` can
            return: `up` and `warning` both count as available, `degraded` only
            appears on aggregated rollup rows, `down` covers every genuine
            failure (the raw `timeout` and `error` statuses are both reported
            as `down` here), `created` and `running` are attempts that have not
            been finalized, and `unknown` covers a missing or unrecognised raw
            status. `abandoned` marks an attempt nothing was ever
            reported for (see LastResult.status): terminal, excluded from
            availability, and never rendered as a failure. It is filterable on
            its own via `?status=abandoned`, and is deliberately NOT part of
            `?status=down`.
        durationMs:
          type: number
          description: Duration in milliseconds (with=durationMs)
        durationMinMs:
          type: number
          description: Minimum duration in milliseconds (with=durationMinMs)
        durationMaxMs:
          type: number
          description: Maximum duration in milliseconds (with=durationMaxMs)
        durationAvgMs:
          type: number
          description: >
            Average duration in milliseconds, from the stored aggregate
            (with=durationAvgMs). Populated on aggregated rollup rows
            (hour/day/month); absent on raw rows, which don't store it.
        durationP95Ms:
          type: number
          description: >
            95th-percentile duration in milliseconds, from the stored
            aggregate (with=durationP95Ms). Populated on aggregated rollup
            rows (hour/day/month); absent on raw rows, which don't store it.
        region:
          type: string
          description: Region identifier (with=region)
        checkSlug:
          type: string
          description: Check slug (with=checkSlug)
        checkName:
          type: string
          description: Check name (with=checkName)
        metrics:
          type: object
          description: Performance metrics (with=metrics)
        output:
          type: object
          description: Diagnostic output (with=output)
        availabilityPct:
          type: number
          description: >
            Availability percentage for aggregated periods, derived from
            successfulChecks / totalChecks × 100 (with=availabilityPct).

    GetOrgResultResponse:
      description: >
        Single-result detail response. Extends OrgResult with all optional
        `with` fields always populated, plus fallback and neighbor UIDs.
      allOf:
        - $ref: "#/components/schemas/OrgResult"
        - type: object
          properties:
            fallback:
              $ref: "#/components/schemas/ResultFallbackInfo"
            previousUid:
              type: string
              format: uuid
              description: >
                Next-older result in the same check + periodType series
                (optionally narrowed by ?region=). Omitted when this is the
                oldest result in scope.
            nextUid:
              type: string
              format: uuid
              description: >
                Next-newer result in the same series. Omitted when this is
                the newest result in scope.

    ResultFallbackInfo:
      type: object
      description: >
        Present when the requested raw result UID had already been rolled up
        into an aggregation; describes the substitution.
      properties:
        requestedUid:
          type: string
          format: uuid
          description: The originally requested (now-deleted) raw result UID.
        requestedAt:
          type: string
          format: date-time
          description: Timestamp embedded in the requested UUIDv7 UID.
        reason:
          type: string
          enum: [rolled_up_to_hour, rolled_up_to_day, rolled_up_to_month]

    CursorPagination:
      type: object
      properties:
        total:
          type: integer
        cursor:
          type: string
          description: Cursor for next page (empty if no more results)
        size:
          type: integer

    ResultsCursorPagination:
      type: object
      description: >-
        Cursor pagination for the results endpoint only — deliberately no
        `total`. `results` is the largest table in the system, and an
        unbounded COUNT(*) on every page load is too expensive to compute
        (see the Results section of the API wiki). Page forward with
        `cursor` until it comes back empty.
      properties:
        cursor:
          type: string
          description: Cursor for next page (empty if no more results)
        size:
          type: integer

    # Incident schemas
    IncidentListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/IncidentDetail"
        pagination:
          $ref: "#/components/schemas/CursorPagination"

    IncidentDetail:
      type: object
      properties:
        uid:
          type: string
          format: uuid
        number:
          type: integer
          format: int64
          description: >-
            Short per-organization incident reference, rendered as `#42` in the
            dashboard, Slack and Telegram. Assigned at creation, never reused.
        checkUid:
          type: string
          format: uuid
        checkSlug:
          type: string
        checkName:
          type: string
        state:
          type: string
          enum: [active, resolved]
        startedAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
        escalatedAt:
          type: string
          format: date-time
        acknowledgedAt:
          type: string
          format: date-time
        acknowledgedBy:
          type: string
          format: uuid
          description: >-
            UID of the SolidPing user credited with the acknowledgment.


            **Present only when the acker maps to a platform account** — the
            dashboard, a magic link whose recipient address matches a user, or
            a linked Telegram chat. A Slack, Discord or phone acknowledgment
            leaves this null, because those people have no `users` row. Read
            `acknowledgedByActor` to render an attribution; this field alone
            says "nobody" for the majority of real acknowledgments.
        acknowledgedByActor:
          allOf:
            - $ref: "#/components/schemas/IncidentActor"
          description: >-
            Resolved, display-ready identity of the acker: a name to render
            and the channel it came from. Derived from the `users` row when
            `acknowledgedBy` is set, and from the `incident.acknowledged`
            event payload otherwise.


            **Returned by the DETAIL endpoint and by `POST .../ack` only.**
            The list endpoint omits it — resolving it costs a user lookup and
            an event lookup per incident, which a 100-row page cannot afford.
        failureCount:
          type: integer
        flapLevel:
          type: integer
          description: >-
            The check's flap count at the moment this incident opened or last
            reopened — a snapshot, not a live value. 0 (omitted) means it
            opened at the base level, not escalated by the adaptive-recovery
            flapping layer.
        title:
          type: string
        description:
          type: string
        check:
          $ref: "#/components/schemas/IncidentCheck"
        details:
          type: object
          additionalProperties: true
          description: >-
            Snapshot of the failing result captured at incident open/reopen:
            `failure_reason` (string), `first_result` (object —
            resultUid/status/region/duration/periodStart/output), and, after a
            relapse, `last_failure` (same shape as `first_result`).


            `failureResponse` (object) is present only for HTTP checks with
            `capture_failure_response` enabled that failed AFTER receiving a
            response: what the probe saw at the incident's current onset —
            `url`, `statusLine`, `statusCode`, `headers` (sensitive values
            replaced with `[redacted]`; request headers are never captured),
            `body` (16 KiB cap, with `truncated` and the original
            `contentLength`), `contentType`, `bodyBytes`, `bodySha256`,
            `binary` (true when only metadata was kept), `capturedAt`,
            `remoteAddr` and `region`. It is overwritten on reopen, and
            dropped when the new onset has no capture. **This block is
            operator-only — it is never serialized onto a status page or a
            subscriber payload.**
        attachments:
          type: array
          description: >-
            Evidence blobs attached to this incident (spec 2026-08-21-01).
            Present on the DETAIL endpoint only — the list endpoint never
            populates it. Today the only kind is `screenshot`: the PNG a
            browser check captured when the incident opened or reopened, for
            checks with the browser `screenshot` option enabled.


            **Operator-only, exactly like `details`.** Each entry carries a
            short-lived SIGNED download URL, so it is never serialized onto a
            status page or a subscriber payload.
          items:
            $ref: "#/components/schemas/IncidentAttachment"

    IncidentActor:
      type: object
      description: >-
        Display identity of whoever performed an incident action, for the
        surfaces that must name a human rather than a UUID.
      required: [name]
      properties:
        name:
          type: string
          description: >-
            Human label to render — the SolidPing user's name or email, or the
            chat username / email address / phone number recorded on the event.
            Never empty; falls back to `Unknown` when nothing is recoverable.
        via:
          type: string
          description: >-
            Channel the action came from. Absent for actions recorded before
            the channel was captured.
          enum: [web, slack, discord, telegram, email, phone, manual, auto]
        userUid:
          type: string
          format: uuid
          description: >-
            SolidPing user the action is credited to. Absent for chat and
            phone actors with no platform account.

    IncidentAttachment:
      type: object
      description: >-
        One stored evidence blob hanging off an incident. The bytes are fetched
        through `downloadUrl`, never inlined.
      required: [uid, kind, name, mimeType, size, downloadUrl, createdAt]
      properties:
        uid:
          type: string
          format: uuid
          description: The `files` row uid.
        kind:
          type: string
          enum: [screenshot, traceroute]
          description: >-
            Attachment kind. `screenshot` is a PNG of what a failing browser
            check's page looked like; `traceroute` is a JSON MTR-style path
            capture (`nettrace.Capture`: mode, hops with address/PTR/loss and
            min/avg/max RTT) taken after a network-reachability failure opened
            the incident. Fetch and parse the JSON from `downloadUrl` — it is
            never inlined into this payload.
        name:
          type: string
        mimeType:
          type: string
          description: >-
            Content type as SNIFFED at write time from the bytes themselves,
            not as declared by the uploader.
        size:
          type: integer
          format: int64
        downloadUrl:
          type: string
          description: >-
            RELATIVE, short-lived signed URL
            (`/pub/files/<uid>?exp=…&sig=…`). Relative so it resolves against
            whichever host served the dashboard — SolidPing answers on
            several. Re-signed on every fetch of the incident; do not cache it.
        createdAt:
          type: string
          format: date-time
        capturedAt:
          type: string
          format: date-time
          description: >-
            When the probe took the capture. For a screenshot this is a moment
            AFTER failure detection, not the failing frame itself; for a
            traceroute it is when the sweep STARTED, which is always after the
            failing result was already reported.
        region:
          type: string
          description: >-
            Probing region, stamped server-side from the persisted result row.
        checkUid:
          type: string
          format: uuid
        trigger:
          type: string
          description: What caused the capture to be kept.
          enum: [incident-open, incident-reopen, agent-upload]

    IncidentCheck:
      type: object
      description: Embedded check details for incidents
      properties:
        slug:
          type: string
        type:
          type: string
        config:
          type: object

    IncidentAckRequest:
      type: object
      description: Optional note recorded with the acknowledge/resolve action.
      properties:
        note:
          type: string

    IncidentSnoozeRequest:
      type: object
      description: >-
        Snooze target. Provide either an absolute `until` timestamp or a
        relative `duration` (e.g. "1h", "30m").
      properties:
        until:
          type: string
          format: date-time
        duration:
          type: string
          description: Go duration string, e.g. "1h", "30m"
        reason:
          type: string

    IncidentCommentRequest:
      type: object
      required: [text]
      description: A free-text comment to append to the incident timeline.
      properties:
        text:
          type: string
          maxLength: 4096
          description: Comment body, plain text, non-empty after trimming.

    # Event schemas
    EventListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Event"
        pagination:
          $ref: "#/components/schemas/CursorPagination"

    Event:
      type: object
      properties:
        uid:
          type: string
          format: uuid
        incidentUid:
          type: string
          format: uuid
        checkUid:
          type: string
          format: uuid
        eventType:
          type: string
          description: >-
            Event type. Deliberately NOT an enum: the catalogue grows with the
            product (see wiki/api-specification/events-catalogue.md), and a client that
            hard-fails on an unknown value would break on every new family.
        actorType:
          type: string
          enum: [system, user, api_token, service]
        actorUid:
          type: string
          format: uuid
          description: >-
            Acting user. This is the audit trail's `actor_user_uid` — filter on
            it with the `actorUserUid` query parameter.
        actorName:
          type: string
          description: Acting user's display name, resolved for the returned page.
        actorEmail:
          type: string
          format: email
          description: Acting user's email, resolved for the returned page.
        sourceIp:
          type: string
          description: >-
            Client address the action came from. Returned to org admins and
            owners only, and absent entirely when `audit.capture_ip` is off.
        userAgent:
          type: string
          description: >-
            User-Agent of the originating request, truncated. Admin/owner only.
        payload:
          type: object
        createdAt:
          type: string
          format: date-time

    # Member schemas
    MemberListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Member"

    Member:
      type: object
      properties:
        uid:
          type: string
          format: uuid
        userUid:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        avatarUrl:
          type: string
        role:
          type: string
          enum: [owner, admin, user, viewer]
        joinedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    AddMemberRequest:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          enum: [owner, admin, user, viewer]
          description: >-
            Member role. `owner` may only be granted by a caller who is already
            an owner of the organization; anybody else gets 403 FORBIDDEN.

    UpdateMemberRequest:
      type: object
      properties:
        role:
          type: string
          enum: [owner, admin, user, viewer]
          description: >-
            New member role. Granting `owner`, or changing the role of a member
            who currently IS an owner, requires the caller to be an owner
            (403 FORBIDDEN otherwise). The organization's last owner can never
            be demoted (409 CONFLICT) — transfer ownership by promoting a second
            owner first, then demoting yourself.

    # Notification schemas
    NotificationListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Notification"

    Notification:
      type: object
      description: A single notification delivery audit row.
      properties:
        uid:
          type: string
        incidentUid:
          type: string
        eventType:
          type: string
        source:
          type: string
        stepUid:
          type: string
        repeatIndex:
          type: integer
        channelType:
          type: string
        status:
          type: string
        skipReason:
          type: string
        error:
          type: string
        messageId:
          type: string
        createdAt:
          type: string
          format: date-time
        sentAt:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/NotificationUser"
        connection:
          $ref: "#/components/schemas/NotificationConnection"
        incident:
          $ref: "#/components/schemas/NotificationIncident"

    NotificationUser:
      type: object
      properties:
        uid:
          type: string
        name:
          type: string

    NotificationConnection:
      type: object
      properties:
        uid:
          type: string
        name:
          type: string
        type:
          type: string

    NotificationIncident:
      type: object
      properties:
        uid:
          type: string
        title:
          type: string
        state:
          type: string
        startedAt:
          type: string
          format: date-time

    NotificationDetail:
      type: object
      description: A notification delivery row with the extra lifecycle fields.
      allOf:
        - $ref: "#/components/schemas/Notification"
        - type: object
          properties:
            failedAt:
              type: string
              format: date-time
            cancelledAt:
              type: string
              format: date-time
            jobUid:
              type: string
            deliveryDetails:
              type: object
              additionalProperties: true
              description: Structured per-attempt delivery artifacts

    NotificationRouteListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/NotificationRoute"
        slackSuggestion:
          $ref: "#/components/schemas/NotificationSlackSuggestion"

    NotificationRoute:
      type: object
      required: [uid, enabled, position, contact, createdAt]
      properties:
        uid:
          type: string
        enabled:
          type: boolean
        position:
          type: integer
        contact:
          $ref: "#/components/schemas/NotificationContact"
        createdAt:
          type: string
          format: date-time

    NotificationContact:
      type: object
      required: [uid, type, value, label]
      properties:
        uid:
          type: string
        type:
          type: string
        value:
          type: string
        label:
          type: string
        verifiedAt:
          type: string
          format: date-time

    NotificationSlackSuggestion:
      type: object
      properties:
        slackUserId:
          type: string
        workspaceName:
          type: string
        channelUid:
          type: string

    AddNotificationContactRequest:
      type: object
      required: [type, value]
      properties:
        type:
          type: string
          description: >-
            Contact type (email, phone, whatsapp, slack_user, webpush, ...).
            `whatsapp` is deliberately distinct from `phone` even for the same
            number: verification proves WhatsApp reachability specifically and
            is Meta's required opt-in record. WhatsApp values must be E.164.

            `telegram` is **rejected** here with `VALIDATION_ERROR`: a Telegram
            contact's value is a chat id and there is no verification round-trip
            to catch a wrong one, so accepting one from a request body would let
            any user page a stranger. Use the connect-link endpoint instead.
        value:
          type: string
        label:
          type: string

    TelegramLinkResponse:
      type: object
      required: [url, expiresAt]
      properties:
        url:
          type: string
          description: The t.me deep link to open, carrying the single-use token.
          example: https://t.me/solidping_bot?start=Zm9vYmFyYmF6
        expiresAt:
          type: string
          format: date-time
          description: When the token stops working (15 minutes after minting).

    UpdateNotificationRouteRequest:
      type: object
      description: Toggle the enabled flag and/or reorder the full route list.
      properties:
        enabled:
          type: boolean
        routeUids:
          type: array
          description: Full ordered list of route UIDs for a reorder
          items:
            type: string

    # Channel schemas
    Channel:
      type: object
      required: [uid, type, name, enabled, isDefault, createdAt, updatedAt]
      properties:
        uid:
          type: string
          format: uuid
        type:
          type: string
          description: Channel type (slack, discord, webhook, email, ...)
        name:
          type: string
        enabled:
          type: boolean
        isDefault:
          type: boolean
        settings:
          type: object
          additionalProperties: true
          description: Public (non-secret) settings for the channel
        settingsPrivateKeys:
          type: array
          items:
            type: string
          description: Names of settings stored encrypted (values omitted)
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ChannelListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Channel"

    CreateChannelRequest:
      type: object
      required: [type, name]
      properties:
        type:
          type: string
          description: Channel type (slack, discord, webhook, email, ...)
        name:
          type: string
        enabled:
          type: boolean
        isDefault:
          type: boolean
        settings:
          type: object
          additionalProperties: true

    UpdateChannelRequest:
      type: object
      properties:
        name:
          type: string
        enabled:
          type: boolean
        isDefault:
          type: boolean
        settings:
          type: object
          additionalProperties: true

    ChannelTestResult:
      type: object
      required: [success, statusCode, durationMs]
      properties:
        success:
          type: boolean
        statusCode:
          type: integer
          description: HTTP status for HTTP-based channels; 0 otherwise
        durationMs:
          type: integer
          format: int64
        error:
          type: string
        detail:
          type: string
          description: Optional human-readable success note

    MemberChannelCoverage:
      type: object
      required: [type, verified, enabled]
      properties:
        type:
          type: string
          description: Contact channel type (email, phone, whatsapp, telegram, webpush, …)
        verified:
          type: boolean
        enabled:
          type: boolean

    MemberCoverage:
      type: object
      required: [userUid, email, role, channels, emailFallbackOnly]
      properties:
        userUid:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
        role:
          type: string
        channels:
          type: array
          items:
            $ref: "#/components/schemas/MemberChannelCoverage"
        emailFallbackOnly:
          type: boolean
          description: >-
            True when no enabled AND verified channel other than email exists —
            escalation can still reach this member, but only by email.

    MemberCoverageListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/MemberCoverage"

    AddMemberContactRequest:
      type: object
      required: [type, value]
      properties:
        type:
          type: string
          enum: [phone, whatsapp]
        value:
          type: string
          description: E.164 number (e.g. +15551234567)
        label:
          type: string

    AdminMemberContact:
      type: object
      required: [uid, userUid, type, verified]
      properties:
        uid:
          type: string
          format: uuid
        userUid:
          type: string
          format: uuid
        type:
          type: string
        label:
          type: string
        verified:
          type: boolean
          description: Always false — an admin can never create a verified contact.

    IntegrationIdentity:
      type: object
      required: [userUid, email, status]
      properties:
        userUid:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [matched, notFound, ambiguous]
          description: >-
            matched = the member has an identity on this integration;
            notFound = their email resolved to nobody in the workspace;
            ambiguous = the match collided with another member and was
            deliberately not written.
        externalId:
          type: string
          description: Provider-side identifier (Slack user id) rendered as <@id>
        displayName:
          type: string
        source:
          type: string
          enum: [auto, manual]
          description: auto = email auto-match; manual = an admin picked it. A re-sync never overwrites manual.

    IntegrationIdentityListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/IntegrationIdentity"

    IntegrationIdentitySyncResponse:
      type: object
      required: [data, matchedCount, notFoundCount, ambiguousCount]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/IntegrationIdentity"
        matchedCount:
          type: integer
        notFoundCount:
          type: integer
        ambiguousCount:
          type: integer

    SetIntegrationIdentityRequest:
      type: object
      required: [externalId]
      properties:
        externalId:
          type: string
          description: Workspace user id to map this member to
        displayName:
          type: string

    CheckChannel:
      type: object
      required: [uid, type, name, enabled, isDefault]
      properties:
        uid:
          type: string
          format: uuid
        type:
          type: string
        name:
          type: string
        enabled:
          type: boolean
        isDefault:
          type: boolean

    CheckChannelListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/CheckChannel"

    SetCheckChannelsRequest:
      type: object
      required: [connectionUids]
      properties:
        connectionUids:
          type: array
          items:
            type: string
            format: uuid

    # Status page schemas
    StatusPage:
      type: object
      required:
        - uid
        - name
        - slug
        - visibility
        - isDefault
        - enabled
        - showAvailability
        - showResponseTime
        - historyDays
        - historyPeriod
        - availabilityThresholds
      properties:
        uid:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        visibility:
          type: string
          enum: [public, private, password]
          description: >-
            public = world-readable; private = hidden entirely (public
            endpoints answer 404); password = shared with a secret (public
            endpoints answer 401 STATUS_PAGE_LOCKED until unlocked).
        hasPassword:
          type: boolean
          description: >-
            Whether an unlock password is stored. The hash itself is never
            serialized.
        hideBranding:
          type: boolean
          description: >-
            On admin payloads: the page's raw white-label opt-in. On the PUBLIC
            payload: the RESOLVED decision, already ANDed with the org's
            whiteLabel entitlement.
        whiteLabelAllowed:
          type: boolean
          description: >-
            Whether the org holds the whiteLabel entitlement. Admin payloads
            only — plan state is never disclosed publicly.
        logoUrl:
          type: string
          description: Public path of the page's uploaded logo, if any.
        faviconUrl:
          type: string
          description: Public path of the page's uploaded favicon, if any.
        isDefault:
          type: boolean
        enabled:
          type: boolean
        showAvailability:
          type: boolean
        showResponseTime:
          type: boolean
        historyDays:
          type: integer
        historyPeriod:
          type: string
          description: History window (24h, 7d, 30d, 90d)
        language:
          type: string
        autoPublish:
          type: boolean
          description: >-
            Whether incidents affecting this page's resources are published
            automatically as public incidents. FALSE on every page that existed
            before this feature shipped (the migration deliberately did not opt
            anyone in retroactively); TRUE by default on pages created since.
        autoPublishDelaySeconds:
          type: integer
          minimum: 0
          maximum: 86400
          description: >-
            Debounce before an incident becomes public. 0 publishes
            immediately; an incident that resolves inside this window is never
            published at all.
        autoResolve:
          type: string
          enum: [always, if_untouched, never]
          description: >-
            What an auto-created publication does when its incident resolves.
            "if_untouched" (the default) resolves it only while nobody has
            edited it; once a human owns the narrative the automation posts a
            "component recovered" note and leaves the final resolve to them.
        customCss:
          type: string
          nullable: true
          description: >-
            Operator-authored CSS the public status page injects as a <style>
            text node, overriding its CSS custom properties (--brand,
            --background, --card, --border, the status colors, .dark). Unlike
            the custom-domain fields this IS returned on the public view — the
            public renderer is its consumer. Max 64 KB, @import rejected.
        customDomain:
          type: string
          nullable: true
          description: >-
            Customer-owned hostname the page is served on (punycode/ASCII).
            Present only on the authenticated org endpoints, never on the public
            view.
        customDomainStatus:
          type: string
          enum: [unverified, verified]
          description: >-
            Custom-domain verification state. Authenticated endpoints only.
        customDomainCertStatus:
          type: string
          enum: [none, issued, error]
          description: >-
            TLS certificate state for the custom domain when the server
            terminates TLS itself (config acme.enabled). "none" = nothing issued
            yet (issuance is on-demand, on the first HTTPS request), "issued" =
            a certificate is in storage, "error" = the last issuance attempt
            failed (see the server log). Omitted when in-server TLS is disabled
            or the domain is not verified yet. Authenticated endpoints only.
        customDomainState:
          type: string
          enum: [none, pending, active, grace, demoted]
          description: >-
            Custom-domain lifecycle state (spec 2026-08-23-03). "grace" is the
            one customDomainStatus cannot express: the page is STILL served,
            but its periodic DNS re-checks are failing and it will stop being
            served if nothing is done. "demoted" means it already has, and is
            recoverable — the sweep re-promotes after several consecutive
            successful checks while a valid certificate is still held.
            Authenticated endpoints only.
        customDomainDegradedSince:
          type: string
          format: date-time
          nullable: true
          description: >-
            When the domain entered "grace". Absent otherwise. Authenticated
            endpoints only.
        customDomainLastCheck:
          type: string
          nullable: true
          description: >-
            One-line diagnostic from the last DNS re-check: the verification
            mode used, the CNAME target expected, what DNS actually returned,
            and the lookup error if any. Exists so a failing verification is
            diagnosable from the API instead of by correlating server logs with
            manual dig runs. Authenticated endpoints only.
        customDomainRecords:
          type: array
          description: >-
            The DNS records the customer must create. Since v0.8.0 this is
            exactly ONE entry: the routing CNAME. Its value is the installation
            CNAME target in "shared" mode, or the page-specific
            "<token>.cname.<target>" host in "token" mode
            (server.custom_domain_cname_mode). The TXT ownership challenge was
            removed. Authenticated endpoints only.
          items:
            $ref: "#/components/schemas/DnsRecord"
        settings:
          $ref: "#/components/schemas/StatusPageSettings"
          nullable: true
          description: >-
            Per-page display customization, mirroring the storage shape.
            An unset section (e.g. availability absent) means "using the
            default". Present on both admin and public payloads.
        availabilityThresholds:
          $ref: "#/components/schemas/AvailabilityThresholds"
          description: >-
            The RESOLVED effective availability thresholds (submitted value,
            or the platform default when unset) — never null, so consumers
            never need to know the defaults themselves.
        sections:
          type: array
          items:
            $ref: "#/components/schemas/StatusPageSection"
        recentUpdates:
          type: array
          items:
            $ref: "#/components/schemas/StatusUpdatePublic"
        createdAt:
          type: string
          format: date-time
        overallStatus:
          type: string
          enum: [operational, degraded, down, maintenance, unknown]
          description: >-
            Page-level rollup computed server-side from the live status of
            every resource on the page, so the public views, the summary
            endpoint, and the SVG badge always agree. Only populated on the
            live public view paths (GET /api/v1/status-pages/{org} and
            GET /api/v1/status-pages/{org}/{slug}) — omitted on the
            authenticated admin listing, which doesn't load live resource data.
        statusCounts:
          $ref: "#/components/schemas/StatusCounts"
          description: Same population rule as overallStatus.
        activeIncidents:
          type: array
          description: >-
            Currently-open incident publications for this page. Same population
            rule as overallStatus (public view paths only). Every field on them
            is operator-authored or templated from the page's own public
            resource names — probe output, error strings and results.output
            never reach this payload.
          items:
            $ref: "#/components/schemas/PublicIncident"

    PublicIncident:
      type: object
      description: >-
        One customer-facing incident on a status page — the PUBLICATION, not
        the internal incident. The operational `incidents` row carries
        ack/snooze metadata, an auto-generated title built from the check slug,
        and probe diagnostics; none of that has a field here.
      required: [uid, title, state, startedAt]
      properties:
        uid:
          type: string
          format: uuid
        title:
          type: string
        state:
          type: string
          enum: [investigating, identified, monitoring, resolved]
        severity:
          type: string
          enum: [minor, major, critical]
          description: Display-only public badge. Absent when the operator set none.
        startedAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
        affectedResources:
          type: array
          description: >-
            Public display names of the page resources this incident covers.
            Resolved by walking the PAGE's own resources, so it can only ever
            contain names the page already renders.
          items:
            type: string
        updates:
          type: array
          items:
            $ref: "#/components/schemas/PublicIncidentUpdate"

    PublicIncidentUpdate:
      type: object
      required: [uid, kind, title, bodyMarkdown, publishedAt]
      properties:
        uid:
          type: string
          format: uuid
        kind:
          type: string
          enum: [investigating, identified, monitoring, resolved, maintenance, info]
        title:
          type: string
        bodyMarkdown:
          type: string
        publishedAt:
          type: string
          format: date-time

    IncidentPublication:
      type: object
      description: >-
        The operator-facing view of a publication.
      required: [uid, statusPageUid, title, state, autoCreated, humanTouched, publishedAt]
      properties:
        uid:
          type: string
          format: uuid
        statusPageUid:
          type: string
          format: uuid
        incidentUid:
          type: string
          format: uuid
          description: >-
            The internal incident this publication tracks. Absent for a
            hand-authored publication, which tracks nothing.
        title:
          type: string
        state:
          type: string
          enum: [investigating, identified, monitoring, resolved]
        severity:
          type: string
          enum: [minor, major, critical]
        autoCreated:
          type: boolean
          description: >-
            True when the auto-publish pipeline minted it. Only auto-created
            publications are candidates for auto-resolve and relapse reopen.
        humanTouched:
          type: boolean
          description: >-
            True once a person edited the publication or posted an update on
            it. This flag is the whole basis of the `if_untouched` auto-resolve
            policy.
        publishedAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        affectedResources:
          type: array
          items:
            type: string
        updates:
          type: array
          items:
            $ref: "#/components/schemas/PublicationUpdate"

    PublicationUpdate:
      type: object
      required: [uid, kind, title, bodyMarkdown, publishedAt]
      properties:
        uid:
          type: string
          format: uuid
        kind:
          type: string
          enum: [investigating, identified, monitoring, resolved, maintenance, info]
        title:
          type: string
        bodyMarkdown:
          type: string
        publishedAt:
          type: string
          format: date-time
        authorUid:
          type: string
          format: uuid
          description: >-
            Absent for updates generated by the auto-publish pipeline — a
            machine post has no author, and attributing it to a human would be
            a lie the UI then renders.

    IncidentPublicationListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/IncidentPublication"

    PublicIncidentListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/PublicIncident"

    CreateIncidentPublicationRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          maxLength: 200
          description: Customer-facing title. Never paste probe output into it.
        state:
          type: string
          enum: [investigating, identified, monitoring, resolved]
        severity:
          type: string
          enum: [minor, major, critical]
        incidentUid:
          type: string
          format: uuid
        bodyMarkdown:
          type: string
          maxLength: 16384
          description: Optional first narrative entry.

    UpdateIncidentPublicationRequest:
      type: object
      description: >-
        PATCH semantics. ANY field present stamps human_touched_at, which stops
        the auto-resolve pipeline from closing the incident behind the
        operator's back.
      properties:
        title:
          type: string
          maxLength: 200
        state:
          type: string
          enum: [investigating, identified, monitoring, resolved]
        severity:
          type: string
          description: >-
            One of minor | major | critical, or an empty string to clear the
            badge.

    AppendPublicationUpdateRequest:
      type: object
      required: [kind, bodyMarkdown]
      description: >-
        Updates are APPEND-ONLY: there is deliberately no edit and no delete
        endpoint for them.
      properties:
        kind:
          type: string
          enum: [investigating, identified, monitoring, resolved, maintenance, info]
          description: >-
            The first four also advance the publication's state, so the header
            and the timeline can never disagree.
        title:
          type: string
          maxLength: 200
        bodyMarkdown:
          type: string
          maxLength: 16384

    PublishIncidentRequest:
      type: object
      required: [statusPageUid]
      properties:
        statusPageUid:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 200
          description: >-
            Templated from the page's public resource name when omitted. The
            incident's internal title is never used — it is built from the
            check slug.
        severity:
          type: string
          enum: [minor, major, critical]

    StatusCounts:
      type: object
      required: [operational, degraded, down, maintenance, unknown]
      description: Tallies the page's resources per overallStatus category.
      properties:
        operational:
          type: integer
        degraded:
          type: integer
        down:
          type: integer
        maintenance:
          type: integer
        unknown:
          type: integer

    StatusPageSummary:
      type: object
      required: [status, counts, page, generatedAt]
      description: >-
        The lightweight "is it up?" public rollup — a cheap alternative to the
        full status page view (no sections, no per-resource availability/
        response-time series).
      properties:
        status:
          type: string
          enum: [operational, degraded, down, maintenance, unknown]
        counts:
          $ref: "#/components/schemas/StatusCounts"
        page:
          type: object
          required: [name, slug, url]
          properties:
            name:
              type: string
            slug:
              type: string
            url:
              type: string
              format: uri
              description: >-
                The canonical public URL: the verified custom domain when
                active, otherwise the absolute /status0/{org}/{slug} URL
                derived from the request host.
        generatedAt:
          type: string
          format: date-time

    AvailabilitySettings:
      type: object
      description: >-
        Customizes the green/amber/red availability thresholds rendered on a
        status page's bars. Omitted fields fall back to the platform defaults
        (thresholdUp 99.9, thresholdDegraded 99.0).
      properties:
        thresholdUp:
          type: number
          format: double
          description: Green floor — pct >= this renders "up". Default 99.9.
        thresholdDegraded:
          type: number
          format: double
          description: >-
            Amber floor — pct >= this (and < thresholdUp) renders "degraded";
            below it renders "down", subject to the small-bucket calibration
            guard (a single failed sample never renders down). Default 99.0.

    StatusPageSettings:
      type: object
      description: >-
        Per-page display customization. Typed rather than a free-form map;
        unknown keys are rejected on write (VALIDATION_ERROR).
      properties:
        availability:
          $ref: "#/components/schemas/AvailabilitySettings"
          nullable: true

    AvailabilityThresholds:
      type: object
      required: [thresholdUp, thresholdDegraded]
      properties:
        thresholdUp:
          type: number
          format: double
        thresholdDegraded:
          type: number
          format: double

    DnsRecord:
      type: object
      required: [type, name, value]
      properties:
        type:
          type: string
          description: DNS record type. Always "CNAME" since v0.8.0.
        name:
          type: string
          description: Fully-qualified record name to create
        value:
          type: string
          description: Record value

    StatusPageListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/StatusPage"

    CreateStatusPageRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        slug:
          type: string
          pattern: "^[a-z][a-z0-9-]{2,99}$"
          description: >-
            URL-friendly identifier, unique within the organization. Omit it
            (or send "") to have one derived from `name`, disambiguated with a
            numeric suffix on collision. A slug you supply is never renamed: a
            collision returns VALIDATION_ERROR instead.
        description:
          type: string
        visibility:
          type: string
          enum: [public, private, password]
        password:
          type: string
          description: >-
            WRITE-ONLY. Required when visibility is "password". Minimum 6
            characters. Never returned — reads expose hasPassword instead.
        hideBranding:
          type: boolean
          description: >-
            Page-level white-label opt-in. Stored whether or not the org is
            entitled, so an upgrade applies without re-saving the page.
        isDefault:
          type: boolean
        showAvailability:
          type: boolean
        showResponseTime:
          type: boolean
        historyDays:
          type: integer
        historyPeriod:
          type: string
        language:
          type: string
        autoPublish:
          type: boolean
          description: >-
            Publish incidents affecting this page's resources automatically as
            public incidents. OMITTING the field opts the new page IN (true) —
            only pages that predate the feature default to false, and they do
            so because the migration deliberately did not opt anyone in
            retroactively.
        autoPublishDelaySeconds:
          type: integer
          minimum: 0
          maximum: 86400
          default: 60
          description: >-
            Debounce before an incident becomes public. 0 is legal and
            publishes immediately; an incident that resolves inside this window
            is never published at all. Outside 0–86400 is a VALIDATION_ERROR.
        autoResolve:
          type: string
          enum: [always, if_untouched, never]
          default: if_untouched
          description: >-
            What an auto-created publication does when its incident resolves.
            "if_untouched" (the default) resolves it only while nobody has
            edited it; once a human owns the narrative the automation posts a
            "component recovered" note and leaves the final resolve to them.
            Any other value is a VALIDATION_ERROR.
        customCss:
          type: string
          description: >-
            Optional custom stylesheet for the public page. Max 64 KB;
            @import is rejected (VALIDATION_ERROR). External url() references
            are allowed.
        customDomain:
          type: string
          description: >-
            Optional customer-owned hostname to bind to the new page. A fresh
            verification token is generated; verify it afterward via the
            custom-domain verify endpoint.
        settings:
          $ref: "#/components/schemas/StatusPageSettings"
          description: >-
            Optional page settings (e.g. availability thresholds) at create
            time. Unknown keys are rejected (VALIDATION_ERROR). The effective
            thresholds (submitted or default) must satisfy
            0 < thresholdDegraded < thresholdUp <= 100.

    UpdateStatusPageRequest:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        visibility:
          type: string
          enum: [public, private, password]
        password:
          type: string
          description: >-
            WRITE-ONLY. A non-empty value sets/replaces the unlock password
            (invalidating every outstanding unlock cookie); "" clears it
            (refused while visibility is still "password"); omitting it leaves
            the stored one untouched.
        hideBranding:
          type: boolean
        isDefault:
          type: boolean
        enabled:
          type: boolean
        showAvailability:
          type: boolean
        showResponseTime:
          type: boolean
        historyDays:
          type: integer
        historyPeriod:
          type: string
        language:
          type: string
        autoPublish:
          type: boolean
          description: >-
            Turn automatic incident publication on or off for this page. Omit
            the field to leave it unchanged.
        autoPublishDelaySeconds:
          type: integer
          minimum: 0
          maximum: 86400
          description: >-
            Debounce before an incident becomes public. 0 is legal and
            publishes immediately. Omit the field to leave it unchanged;
            outside 0–86400 is a VALIDATION_ERROR.
        autoResolve:
          type: string
          enum: [always, if_untouched, never]
          description: >-
            What an auto-created publication does when its incident resolves.
            Omit the field to leave it unchanged; any other value is a
            VALIDATION_ERROR.
        customCss:
          type: string
          description: >-
            Set/replace the custom stylesheet, or clear it with an empty
            string. Omit the field to leave it unchanged. Max 64 KB; @import
            is rejected (VALIDATION_ERROR).
        customDomain:
          type: string
          nullable: true
          description: >-
            Set/change the custom domain (non-empty), or clear it (null or "").
            Omit the field to leave the domain unchanged. Setting a new domain
            generates a fresh verification token and resets verification.
        settings:
          $ref: "#/components/schemas/StatusPageSettings"
          nullable: true
          description: >-
            No deep merge. Omit the field to leave settings untouched entirely.
            When present, each top-level section provided (e.g. availability)
            replaces that section wholly (not a field-by-field merge); an
            explicit `null` section resets it to defaults; a section not
            mentioned is left untouched. Unknown keys are rejected
            (VALIDATION_ERROR). The effective thresholds (submitted or
            default) must satisfy 0 < thresholdDegraded < thresholdUp <= 100.

    StatusPageSection:
      type: object
      required: [uid, name, slug, position]
      properties:
        uid:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        position:
          type: integer
        resources:
          type: array
          items:
            $ref: "#/components/schemas/StatusPageResource"
        createdAt:
          type: string
          format: date-time

    StatusPageSectionListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/StatusPageSection"

    CreateStatusPageSectionRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        slug:
          type: string
          pattern: "^[a-z][a-z0-9-]{2,99}$"
          description: >-
            URL-friendly identifier, unique within the status page. Omit it (or
            send "") to have one derived from `name`, disambiguated with a
            numeric suffix on collision. A slug you supply is never renamed: a
            collision returns VALIDATION_ERROR instead.
        position:
          type: integer

    UpdateStatusPageSectionRequest:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
        position:
          type: integer

    StatusPageResource:
      type: object
      description: >-
        A component displayed on a status page section. It targets either a
        single check (checkUid) or a whole check group (checkGroupUid) — exactly
        one is set. A group resource renders as ONE aggregated component: rolled
        up status, weighted-average availability across its members, and
        maintenance from a group- or member-targeted window. Its members are
        never listed publicly.
      required: [uid, position]
      properties:
        uid:
          type: string
          format: uuid
        checkUid:
          type: string
          format: uuid
          description: Set when the resource targets an individual check.
        checkGroupUid:
          type: string
          format: uuid
          description: Set when the resource targets a check group.
        publicName:
          type: string
        explanation:
          type: string
        autoPublish:
          type: boolean
          nullable: true
          description: >-
            Per-resource auto-publish override. ABSENT/null means "inherit the
            page setting", which is NOT the same as an explicit false — a page
            can therefore be flipped on or off without rewriting every
            resource's intent.
        position:
          type: integer
        createdAt:
          type: string
          format: date-time

    StatusPageResourceListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/StatusPageResource"

    CreateStatusPageResourceRequest:
      type: object
      description: >-
        Exactly one of checkUid or checkGroupUid must be set; zero or both is a
        VALIDATION_ERROR naming both fields.
      properties:
        checkUid:
          type: string
          description: >-
            Check UID or slug to attach as a resource. Mutually exclusive with
            checkGroupUid.
        checkGroupUid:
          type: string
          description: >-
            Check group UID or slug to attach as one aggregated resource.
            Mutually exclusive with checkUid.
        publicName:
          type: string
        explanation:
          type: string
        autoPublish:
          type: boolean
          nullable: true
          description: >-
            Per-resource auto-publish override. ABSENT/null means "inherit the
            page setting", which is NOT the same as an explicit false — so a
            component can be excluded from (or included in) automatic
            publication independently of how the page itself is configured.
        position:
          type: integer

    UpdateStatusPageResourceRequest:
      type: object
      description: >-
        Supplying checkUid or checkGroupUid switches the resource's target kind;
        supplying both is a VALIDATION_ERROR naming both fields, and supplying
        neither leaves the target untouched.
      properties:
        checkUid:
          type: string
          description: Switch the resource to target this check (UID or slug).
        checkGroupUid:
          type: string
          description: Switch the resource to target this check group (UID or slug).
        publicName:
          type: string
        explanation:
          type: string
        autoPublish:
          type: boolean
          nullable: true
          description: >-
            Per-resource auto-publish override, which is three-state. OMITTING
            the key leaves the override exactly as it is; sending an explicit
            `null` RESETS it to "inherit the page setting"; sending true or
            false pins it. Those are three distinct outcomes, so the server
            detects key presence on the raw body rather than relying on the
            decoded value.
        position:
          type: integer

    ReorderUidsRequest:
      type: object
      required: [uids]
      properties:
        uids:
          type: array
          items:
            type: string
            format: uuid

    StatusPageSubscriber:
      type: object
      required: [uid, channel, scope, confirmed, createdAt]
      properties:
        uid:
          type: string
          format: uuid
        email:
          type: string
          description: Absent for a webhook/Slack subscription.
        channel:
          type: string
          enum: [email, webhook, slack]
        endpoint:
          type: string
          description: >-
            MASKED delivery URL, endpoint channels only. The real URL is stored
            encrypted and is never returned — an incoming-webhook URL is a
            credential, so a list endpoint that echoed it would turn every read
            into a credential disclosure.
        failureCount:
          type: integer
          description: Consecutive delivery failures; reset by a success.
        disabled:
          type: boolean
          description: >-
            True once repeated delivery failures tripped the circuit breaker.
            A `statuspage.subscriber.disabled` event records why.
        scope:
          type: string
          description: Subscription scope ("page" or "incident")
        incidentUid:
          type: string
          format: uuid
        confirmed:
          type: boolean
        createdAt:
          type: string

    StatusPageUnlockRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          description: The page password, as given to the visitor by the operator.

    StatusPageSubscribeRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
        channel:
          type: string
          enum: [email]
          description: >-
            Accepted only so a client asking for a non-email channel gets a
            clear refusal. Public self-serve is email-only.
        scope:
          type: string
          enum: [page, incident]
        incidentUid:
          type: string
          format: uuid
          description: Required when scope is "incident".

    CreateStatusPageEndpointSubscriberRequest:
      type: object
      required: [channel, url]
      properties:
        channel:
          type: string
          enum: [webhook, slack]
        url:
          type: string
          format: uri
          description: >-
            https only, and never a loopback/private host. A "slack"
            subscription must point at hooks.slack.com.
        signingSecret:
          type: string
          description: >-
            Optional. Supply your own when the receiver already verifies a
            known secret; omit it and one is generated. WRITE-ONLY — it is
            echoed once in the create response and never readable again.
        scope:
          type: string
          enum: [page, incident]
        incidentUid:
          type: string
          format: uuid

    StatusPageEndpointSubscriber:
      allOf:
        - $ref: "#/components/schemas/StatusPageSubscriber"
        - type: object
          required: [signingSecret]
          properties:
            signingSecret:
              type: string
              description: >-
                Returned EXACTLY ONCE, on creation. It is stored encrypted and
                never appears on any other response, so copy it now: without it
                the HMAC on every delivery is unverifiable.

    StatusPageSubscriberListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/StatusPageSubscriber"
        meta:
          type: object
          properties:
            count:
              type: integer

    # Status update schemas
    StatusUpdate:
