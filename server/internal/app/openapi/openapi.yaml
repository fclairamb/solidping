  /api/v1/orgs/{org}/slos/{uid}/burndown:
    get:
      tags: [SLOs]
      summary: Error-budget burn-down for the current window
      description: >-
        Cumulative series. Consumption is accrued per step and summed forward,
        so `budgetRemainingSeconds` is monotonically non-increasing by
        construction — it cannot climb back up when probe density changes. It is
        not clamped at zero: an overspent budget reports a negative remainder.
        A step with no countable probe spends nothing (no data is not downtime).
      operationId: getSloBurndown
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgPath"
        - $ref: "#/components/parameters/SLOUidPath"
      responses:
        "200":
          description: Burn-down series
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SLOBurndownResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orgs/{org}/slos/{uid}/alert-policies:
    get:
      tags: [SLOs]
      summary: List an objective's burn-rate alert policies
      description: >-
        Two built-in multiwindow burn-rate policies (`fast` and `slow`),
        materialized on demand so an objective created before the feature
        existed answers exactly like a new one. Both start disabled — alerting
        is opt-in. `longBurnRate` / `shortBurnRate` are recomputed for the
        request rather than read back from the stored readout, and are null
        (never 0) when a window carries no countable probe.
      operationId: listSloAlertPolicies
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgPath"
        - $ref: "#/components/parameters/SLOUidPath"
      responses:
