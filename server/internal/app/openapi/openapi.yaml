  # Superadmin entitlements editor (spec 2026-08-26-06). Instance-level, NOT
  # org-scoped: a super admin edits somebody else's limits, so these routes
  # deliberately sit outside the /orgs/{org} chain (which would pin them to the
  # organization they happen to be signed into).
  /api/v1/system/entitlements:
    get:
      tags: [Entitlements]
      summary: List organizations with their resolved entitlements (super admin)
      operationId: listAdminEntitlements
      description: |
        One row per organization: resolved limits, their source, plan display
        identity, and the checks-per-minute demand/cap pair so orgs currently
        over their execution cap can be spotted without opening each one.
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          description: Case-insensitive substring match on the org slug or name
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Page size (1-200, default 50)
          schema:
            type: integer
        - name: offset
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Organizations with resolved entitlements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEntitlementsListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/system/entitlements/{org}:
    get:
      tags: [Entitlements]
      summary: Get one organization's entitlements and audit trail (super admin)
      operationId: getAdminEntitlements
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgPath"
        - name: limit
          in: query
          required: false
          description: Maximum audit entries (1-200, default 50)
          schema:
            type: integer
      responses:
        "200":
          description: Entitlements detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEntitlementsDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Entitlements]
      summary: Write an organization's entitlements as an admin override (super admin)
      operationId: setAdminEntitlements
      description: |
        Writes a complete admin-sourced row (whole-row only; there are no
        per-field overrides). The request body's `source` is ignored — a super
        admin write is always `admin`, so a body claiming to be the billing
        service cannot launder itself past the precedence rule.

        Because the row is complete, an `admin` row resolves whole-row: a
        `null` cap means **unlimited**, not "inherit the deployment default".
        That is what makes the editor's Unlimited switch mean what it says on a
        SaaS deployment, where every default is a real number. `whiteLabel` is
        the exception — being a boolean, its `null` keeps meaning "use the
        deployment default".

        While the stored row is admin-sourced, billing pushes to
        `PUT /api/v1/orgs/{org}/entitlements` are accepted with 200 but NOT
        applied (`applied: false`, `suppressedBy: admin`) and recorded in the
        audit log. Use `DELETE` on this path to release the override.

        An optional `X-Entitlements-Reason` header is stored on the audit row.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetEntitlementsRequest"
      responses:
        "200":
          description: Updated entitlements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEntitlementsWriteResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Entitlements]
      summary: Release an organization back to billing (super admin)
      operationId: releaseAdminEntitlements
      description: |
        Drops the stored entitlements row. The organization immediately
        resolves to the deployment-mode defaults, and the next billing push is
        applied normally. Releasing an organization that has no stored row is a
        no-op (`released: false`), not an error.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgPath"
      responses:
        "200":
          description: Entitlements after the release
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEntitlementsWriteResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

