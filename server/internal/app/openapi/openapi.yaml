            "" is a VALIDATION_ERROR (send null to clear). Clearing checkUid
            does not implicitly clear sectionUid.
        incidentUid:
          type: string
          format: uuid
          nullable: true
          description: >-
            Set/change the incident, or clear it with null. Omit the field to
            leave it unchanged; "" is a VALIDATION_ERROR (send null to clear).
        title:
          type: string
        bodyMarkdown:
          type: string
        linkUrl:
