  # Event APIs
  /api/v1/orgs/{org}/events:
    get:
      tags: [Events]
      summary: List events
      operationId: listEvents
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgPath"
        - name: eventType
          in: query
          description: Filter by event type (comma-separated)
          schema:
            type: string
        - name: checkUid
          in: query
          description: Filter by check UID
          schema:
            type: string
        - name: incidentUid
          in: query
          description: Filter by incident UID
          schema:
            type: string
        - name: type
          in: query
          description: >-
            Filter by event-type FAMILY (comma-separated prefixes, e.g.
            `auth,member`). Distinct from `eventType`, which matches exactly.
            The `auth` family is only returned to org admins and owners.
          schema:
            type: string
        - name: actorUserUid
          in: query
          description: >-
            Filter to the events caused by one user. `actorUid` is accepted as
            an alias.
          schema:
            type: string
            format: uuid
        - name: targetType
          in: query
          description: >-
            Filter to one kind of acted-on object (`integration`, `member`,
            `escalation_policy`, …), matched against the payload's
            `target_type`.
          schema:
            type: string
        - name: targetUid
          in: query
          description: >-
            Filter to the events about one object, matched EXACTLY against the
            payload's `target_uid`.
          schema:
            type: string
        - name: target
          in: query
          description: >-
            Free-text target filter: matches an exact `target_uid`, or a
            case-insensitive substring of the `target_name` captured on the
            event. This is what the dashboard's "target name or UID" box sends.
          schema:
            type: string
        - name: sourceIp
          in: query
          description: >-
            Filter to one client address. Honoured for org admins and owners
            ONLY; for anyone else it is silently ignored rather than rejected,
            so it cannot be used as an oracle for a column they are not
            allowed to read.
          schema:
            type: string
        - name: since
          in: query
          description: Only events created at or after this RFC3339 timestamp
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          description: Only events created strictly before this RFC3339 timestamp
          schema:
            type: string
            format: date-time
        - name: cursor
          in: query
          description: Cursor for pagination
          schema:
            type: string
        - name: size
          in: query
          description: Results per page (default 20, max 100)
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        "200":
          description: List of events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventListResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # NOTE: GET /api/v1/orgs/{org}/events/ws (the live update hint WebSocket,
