  /api/v1/orgs/{org}/incidents/{uid}/snooze:
    post:
      tags: [Incidents]
      summary: Snooze an incident
      description: >-
        Suppresses notifications until an explicit time (`until`) or for a
        relative duration (`duration`, e.g. "1h", "30m"). One of the two must
        be provided.
      operationId: snoozeIncident
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgPath"
        - $ref: "#/components/parameters/IncidentUidPath"
      requestBody:
        required: false
        content:
