          type: integer
          format: int64
          description: The whole window's monitorable duration; the budget basis.
        elapsedSeconds:
          type: integer
          format: int64
          description: The part of monitoredSeconds already elapsed; the consumption basis.
        budgetTotalSeconds:
          type: integer
          format: int64
        budgetConsumedSeconds:
          type: integer
          format: int64
        budgetRemainingSeconds:
          type: integer
          format: int64
          description: Negative when the budget is overspent.
        excludedMaintenanceSeconds:
          type: integer
          format: int64
        burnRate:
          type: number
          format: double
          nullable: true
          description: Observed error rate divided by allowed error rate.
