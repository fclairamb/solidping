  /api/v1/orgs/{org}/users/me/telegram/link:
    post:
      tags: [Notifications]
      summary: Mint a single-use Telegram connect link for the caller
      description: |
        Returns a `https://t.me/<botUsername>?start=<token>` deep link carrying
        a single-use, high-entropy token (TTL 15 minutes).

        Nothing is created by this call. The Telegram contact only comes into
        existence when the user actually presses **Start** in Telegram and the
        resulting `/start <token>` reaches the instance webhook — pressing Start
        is both the proof of reachability and the opt-in, which is why this
        channel has no verification code round-trip.

        A replayed token is a no-op, not a second contact. Poll
        `GET /api/v1/orgs/{org}/users/me/notification-routes` to observe the new
        contact appear.
      operationId: createMyTelegramLink
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgPath"
      responses:
        "201":
          description: Connect link minted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramLinkResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orgs/{org}/users/me/notification-contacts/{contactUid}:
    delete:
      tags: [Notifications]
      summary: Remove one of the caller's notification contacts
      operationId: removeMyNotificationContact
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgPath"
        - $ref: "#/components/parameters/ContactUidPath"
      responses:
        "204":
          description: Contact removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orgs/{org}/users/me/notification-contacts/{contactUid}/verify:
    post:
      tags: [Notifications]
      summary: Send a verification code to a phone contact
      description: >
        Issues a 6-digit code (10-minute expiry, rate-limited to 3/hour per
        contact) and sends it via the organization's default Twilio connection.
        Only phone contacts can be verified.
      operationId: verifyMyNotificationContact
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgPath"
        - $ref: "#/components/parameters/ContactUidPath"
      responses:
        "204":
          description: Code sent
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: No SMS provider configured for this organization
        "429":
          description: Verification code requested too recently

  /api/v1/orgs/{org}/users/me/notification-contacts/{contactUid}/verify/confirm:
    post:
      tags: [Notifications]
      summary: Confirm a phone contact with its verification code
      description: >
        Constant-time compares the submitted code; after 5 failed attempts the
        code is invalidated and a new one must be requested. Success stamps the
        contact verified.
      operationId: confirmMyNotificationContact
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgPath"
        - $ref: "#/components/parameters/ContactUidPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: The 6-digit verification code
                  example: "123456"
      responses:
        "204":
          description: Contact verified
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          description: Too many incorrect attempts; request a new code

