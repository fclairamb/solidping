openapi: 3.0.0
info:
  title: SolidPing API
  description: Multi-protocol monitoring and health checking API
  version: 1.0.0
  contact:
    name: Florent Clairambault - https://github.com/fclairamb/solidping/issues
  license:
    name: AGPL-3.0

servers:
  - url: https://solidping.io
    description: SolidPing cloud
  - url: http://localhost:4000
    description: Local development server

tags:
  - name: Management
    description: System management endpoints
  - name: Authentication
    description: Authentication and token management
  - name: Checks
    description: Monitoring check management
  - name: Badges
    description: Status badge generation
  - name: Results
    description: Check results and statistics
  - name: Incidents
    description: Incident management and tracking
  - name: Channels
    description: Notification channels / integrations and per-check bindings
  - name: Notifications
    description: Per-incident/user/org notification delivery audit and per-user notification routes and contacts
  - name: Events
    description: Audit events and activity log
  - name: Members
    description: Organization member management
  - name: Jobs
    description: Background job management
  - name: Discovery
    description: Network discovery scans and suggested checks
  - name: System
    description: System-wide configuration (super admin only)
  - name: Support
    description: >
      Instance support inbox — inbound human messages captured from the bot
      channels, and replies back through them. Super admin only. Threads belong
      to the INSTANCE, not to an organization: the sender is frequently a phone
      number with no org to attribute it to, and a message from a stranger must
      not be dropped for lack of one. organizationUid/userUid on a thread are
      attribution hints for the operator, never an access boundary.
  - name: MaintenanceWindows
    description: Scheduled maintenance windows and their check coverage
  - name: SLOs
    description: Service-level objectives, error budgets, and scheduled uptime reports
  - name: CheckGroups
    description: Check group management
  - name: Severities
    description: Severity primitives (channel-set bundles)
  - name: Labels
    description: Label key/value autocomplete
  - name: Regions
    description: Available monitoring regions
  - name: CheckTypes
    description: Check type catalog and sample configurations
  - name: OnCallSchedules
    description: On-call schedules, overrides, rotation preview, and iCal feeds
  - name: EscalationPolicies
    description: Escalation policies with ordered steps and targets
  - name: Organizations
    description: Organization creation and settings
  - name: Invitations
    description: Organization invitations
  - name: MembershipRequests
    description: Requests to join an organization (requester and admin sides)
  - name: Entitlements
    description: Per-organization entitlement limits and audit log
  - name: Files
    description: Org-scoped file storage metadata and content
  - name: EmailSuppressions
    description: Per-recipient email suppression (unsubscribe) list

paths:
  # Management APIs
  /api/mgmt/version:
    get:
      tags: [Management]
      summary: Get system version
      operationId: getVersion
      responses:
        "200":
          description: Version information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"

  /api/mgmt/health:
    get:
      tags: [Management]
      summary: System health check
      operationId: getHealth
      responses:
        "200":
          description: Health status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: >
            The node cannot serve: a structural database fault (the schema it
            needs is gone) was detected and the process is shutting down.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/mgmt/scheduling/cost-distribution:
    get:
      tags: [Management]
      summary: Scheduler cost/delay distribution
      description: >
        Returns an aggregate, low-cardinality distribution of the scheduler's
        per-job cost_ewma_ms and delay_ewma_ms across all check_jobs, plus
        fast/slow job counts at a candidate threshold. Read-only and
        super-admin guarded. Used to decide whether fast/slow scheduling lanes
        are warranted.
      operationId: getCostDistribution
      security:
        - bearerAuth: []
      parameters:
        - name: thresholdMs
          in: query
          required: false
          description: Candidate fast/slow boundary in milliseconds (default 1000).
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Cost/delay distribution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CostDistributionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/mgmt/limits:
    get:
      tags: [Management]
      summary: Rate-limit and concurrency introspection
      description: >
        Returns the server's rate-limit and concurrency configuration together
        with the calling client's live counters (remaining tokens, in-flight
        requests), the resolved caller IP and which bucket ("ip" or "token")
        the caller's traffic is accounted against. Public, no authentication.
      operationId: getLimits
      responses:
        "200":
          description: Rate-limit and concurrency state for the caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LimitsResponse"

  /api/mgmt/memory:
    get:
      tags: [Management]
      summary: Runtime memory snapshot
      description: >
        Returns a JSON snapshot of runtime memory (heap / stack / goroutines /
        GC), process RSS, suspect-subsystem cardinalities (DEK cache, rate-limit
        entries, event listeners) and build facts (cgo, SQLite driver, Go
        version). Super-admin only; the raw pprof surface stays on the
        localhost-bound profiler server.
      operationId: getMemory
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Memory snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemorySnapshotResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/system/scheduling/lane-load:
    get:
      tags: [System]
      summary: Per-worker check-lane load statistics
      description: >
        Computes, server-side, each worker's offered check load per scheduling
        lane (fast / slow): eligible job counts, summed cost and delay EWMAs,
        and the summed duty cycle (100 × cost EWMA / period, i.e. how many
        runner slots the lane's steady-state demand occupies). "Offered" means
        every enabled job the worker is eligible to claim — jobs without a
        region count for every worker, region-scoped jobs count for workers
        whose region has the job's region as a prefix — so workers sharing a
        region report the same load. Super-admin only.
      operationId: getSchedulingLaneLoad
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Per-worker lane load report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LaneLoadResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # System actions (Super Admin Only)
  /api/v1/system/regions/migrate:
    post:
      tags: [System]
      summary: Migrate every reference to a region slug
      description: >
        Reassigns a region slug server-wide and across every organization:
        `checks.regions` is rewritten in one transaction, then each affected
        check's `check_jobs` are re-materialized under the new slug through the
        normal reconcile (so the unique `(checkUid, region)` pair, the phase
        stagger, the plan weight and the schedule are all recomputed).


        This exists because renaming a worker region — an `SP_NODE_REGION` /
        `SP_REGIONS` change, with no check ever edited — leaves every job row
        under the old spelling, and a worker only claims a job whose region its
        own region matches by prefix. Those jobs become unclaimable by every
        worker, silently and forever. The migration is the recovery, and it is
        server-scope because org-scoped credentials cannot reach the jobs of
        the other tenants a rename breaks.


        `to` must be a declared region (present in the `regions` system
        parameter) or served by a live worker — migrating to a slug nobody
        serves would only move the stranding. `from` deliberately need not be
        declared: cleaning up a slug that no longer exists is the point. A
        private (`@…`) region may only migrate to another private region, since
        its sealed configs are encrypted to the private region's agent keys and
        cannot be re-targeted server-side.


        Idempotent: a second call with the same pair finds no references and
        returns zeros. Super-admin only.
      operationId: migrateRegion
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegionMigrationRequest"
      responses:
        "200":
          description: Migration report (identical shape for a dry run)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegionMigrationReport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/system/regions/health:
    get:
      tags: [System]
      summary: Ghost-region detection report
      description: >
        One row per region slug seen anywhere — in the declared `regions`
        system parameter, in a check's `regions` array, in a
        `check_jobs.region`, or in a live or previously-live worker's
        announced region — so the caller gets the ghosts and the healthy
        baseline in one call.


        A **ghost** is a slug something depends on (a job or a check
        reference) that nothing live can serve: `(jobs > 0 || checksReferencing
        > 0) && liveWorkers == 0`. A declared region with zero live workers
        and zero references is dark but unused, not a ghost — the alarm
        condition is work assigned to nobody, not an idle region.


        `liveWorkers` reuses the exact prefix rule the scheduler claims jobs
        with (`workerRegion` has the slug as a prefix, so a `us` job is
        served by a `us-1` worker) and the same liveness window as the region
        capability report. `lastWorkerSeenAt` spans every matching worker,
        soft-deleted included, so it dates when the region actually went
        dark. NULL-region (any-region) jobs never count toward any row — they
        are claimable by every cloud worker by construction.


        Read-side companion of `POST /system/regions/migrate`: its output
        names exactly the `from` slugs a migration should target. Cheap and
        unpaginated — a handful of bounded scans, not a query per region.
        Super-admin only.
      operationId: getRegionHealth
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Ghost-region detection report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegionHealthReport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/system/test-email:
    post:
      tags: [System]
      summary: Send a test email
      description: >
        Sends a test email to the given recipient using the currently saved
        SMTP parameters, and reports whether the send succeeded. Super-admin
        only.
      operationId: sendTestEmail
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestEmailRequest"
      responses:
        "200":
          description: Test email result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestEmailResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/system/email-inbox/config:
    get:
      tags: [System]
      summary: Get the email-inbox (JMAP) configuration
      description: >
        Returns the saved JMAP inbox configuration with the password elided.
        Super-admin only.
      operationId: getEmailInboxConfig
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Email-inbox configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailInboxConfigResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/system/email-inbox/status:
    get:
      tags: [System]
      summary: Get the email-inbox connection status
      description: >
        Reports whether the email inbox is enabled and connected, the mode, the
        last sync time, the last error and the address domain. Super-admin only.
      operationId: getEmailInboxStatus
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Email-inbox status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailInboxStatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/system/email-inbox/test:
    post:
      tags: [System]
      summary: Test the email-inbox connection
      description: >
        Connects to the configured JMAP inbox and lists its resolved mailboxes.
        Super-admin only.
      operationId: testEmailInbox
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailInboxTestResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/system/email-inbox/sync:
    post:
      tags: [System]
      summary: Trigger an email-inbox sync
      description: >
        Runs one immediate sync pass over the configured JMAP inbox.
        Super-admin only.
      operationId: syncEmailInbox
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailInboxSyncResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/system/activation:
    get:
      tags: [System]
      summary: Organization activation funnel
      description: >
        Returns one row per organization with the timestamps for each activation
        milestone (signup, first check, first result, first notification, first
        incident). Super-admin only.
      operationId: getActivationFunnel
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Activation funnel rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivationFunnelResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # System Parameters APIs (Super Admin Only)
  /api/v1/system/parameters:
    get:
      tags: [System]
      summary: List all system parameters
      description: Returns all system-wide configuration parameters. Secret values are masked.
      operationId: listSystemParameters
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of system parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemParameterListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/system/parameters/{key}:
    get:
      tags: [System]
      summary: Get a system parameter
      description: Returns a single system parameter by key. Secret values are masked.
      operationId: getSystemParameter
      security:
        - bearerAuth: []
      parameters:
        - name: key
          in: path
          required: true
          description: Parameter key
          schema:
            type: string
      responses:
        "200":
          description: System parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemParameter"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags: [System]
      summary: Set a system parameter
      description: Creates or updates a system parameter value.
      operationId: setSystemParameter
      security:
        - bearerAuth: []
      parameters:
        - name: key
          in: path
          required: true
          description: Parameter key
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetSystemParameterRequest"
      responses:
        "200":
          description: Parameter updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemParameter"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    delete:
      tags: [System]
      summary: Delete a system parameter
      description: Soft-deletes a system parameter.
      operationId: deleteSystemParameter
      security:
        - bearerAuth: []
      parameters:
        - name: key
          in: path
          required: true
          description: Parameter key
          schema:
            type: string
      responses:
        "204":
          description: Parameter deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # Support inbox (Super Admin Only)
  /api/v1/support/threads:
    get:
      tags: [Support]
      summary: List support threads
      description: >
        Returns captured support conversations, most recent activity first.
        Super-admin only.
      operationId: listSupportThreads
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [open, pending, closed]
        - name: channel
          in: query
          schema:
            type: string
            enum: [whatsapp, telegram, sms, slack, discord, email]
        - name: q
          in: query
          description: Case-insensitive substring match on subject or channel identity
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 500
      responses:
        "200":
          description: Support threads
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportThreadListResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/support/threads/{uid}:
    get:
      tags: [Support]
      summary: Get one support thread
      description: >
        Returns the thread, marking it read. Super-admin only.
      operationId: getSupportThread
      security:
        - bearerAuth: []
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Support thread
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportThread"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Support]
      summary: Update a support thread
      description: Change the operator-set status or the subject. Super-admin only.
      operationId: updateSupportThread
      security:
        - bearerAuth: []
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSupportThreadRequest"
      responses:
        "200":
          description: Updated thread
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportThread"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/support/threads/{uid}/messages:
    get:
      tags: [Support]
      summary: List a thread's messages
      description: Chronological order, oldest first. Super-admin only.
      operationId: listSupportMessages
      security:
        - bearerAuth: []
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 200
            maximum: 1000
      responses:
        "200":
          description: Support messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportMessageListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Support]
      summary: Reply to a support thread
      description: >
        Sends the reply through the channel the thread arrived on AND records it.
        Returns 409 when the channel will not accept a free-form reply right now
        — a lapsed WhatsApp 24-hour window, or a channel with no reply adapter —
        which is a refusal we make deliberately rather than a provider error
        surfaced after the fact. Returns 202 when the row was recorded but the
        provider send failed, so an operator is never left unsure whether the
        attempt happened. Super-admin only.
      operationId: createSupportMessage
      security:
        - bearerAuth: []
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSupportMessageRequest"
      responses:
        "201":
          description: Reply sent and recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportMessage"
        "202":
          description: Reply recorded but the provider send failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportMessage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  # Authentication APIs (root-level)
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Login with email/password
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      summary: Logout current session
      operationId: logout
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "200":
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResponse"

  /api/v1/auth/refresh:
    post:
      tags: [Authentication]
      summary: Refresh access token
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/me:
    get:
      tags: [Authentication]
      summary: Get current user info
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [Authentication]
      summary: Update the authenticated user's profile
      operationId: updateMe
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated user information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/providers:
    get:
      tags: [Authentication]
      summary: List configured auth providers
      operationId: listAuthProviders
      responses:
        "200":
          description: Configured providers plus registration/passkey availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthProvidersResponse"

  /api/v1/config:
    get:
      tags: [System]
      summary: Public browser-safe configuration
      description: |
        Unauthenticated configuration blob the dashboard reads at boot, before
        any login. Contains **only** non-secret, browser-safe values; no
        parameter marked `secret` in the system-parameter registry is ever
        exposed here (in particular `posthog.personal_api_key` is not).

        When a feature is disabled its configuration fields are **omitted**
        rather than returned empty — e.g. with PostHog unconfigured the
        response is exactly `{"posthog": {"enabled": false}}`. The same rule
        applies to `whatsapp` and `telegram`: `whatsapp` is a single resolved
        boolean, and `telegram` emits its public bot username only while it is
        enabled.
      operationId: getPublicConfig
      security: []
      responses:
        "200":
          description: Public configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicConfigResponse"

  /api/v1/auth/register:
    post:
      tags: [Authentication]
      summary: Self-service account registration
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "200":
          description: Registration accepted; confirmation email sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/ValidationError"

  /api/v1/auth/confirm-registration:
    post:
      tags: [Authentication]
      summary: Confirm a pending registration with an emailed token
      operationId: confirmRegistration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmRegistrationRequest"
      responses:
        "200":
          description: Registration confirmed; user logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/ValidationError"

  /api/v1/auth/request-password-reset:
    post:
      tags: [Authentication]
      summary: Request a password reset email
      operationId: requestPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestPasswordResetRequest"
      responses:
        "200":
          description: Reset request accepted (always returned, anti-enumeration)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/reset-password:
    post:
      tags: [Authentication]
      summary: Set a new password using a reset token
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "410":
          description: Reset link has expired or is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/auth/change-password:
    post:
      tags: [Authentication]
      summary: Change (or set) the authenticated user's password
      description: >
        Rotates the caller's password without an emailed reset token.
        `currentPassword` is required when the account already has a password;
        for an SSO-only account (`hasPassword: false` on `/api/v1/auth/me`) it is
        ignored and this call sets the initial password. All of the caller's
        *other* sessions are revoked; the calling session and any personal access
        tokens keep working. A confirmation email is sent.
      operationId: changePassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: >
            Not authenticated, or the supplied `currentPassword` is wrong
            (error code `INVALID_CURRENT_PASSWORD`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/invite/{token}:
    get:
      tags: [Authentication]
      summary: Inspect an invitation by token
      operationId: getInvite
      parameters:
        - name: token
          in: path
          required: true
          description: Invitation token
          schema:
            type: string
      responses:
        "200":
          description: Public invitation info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteInfoResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/auth/accept-invite:
    post:
      tags: [Authentication]
      summary: Accept an invitation
      operationId: acceptInvite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInviteRequest"
      responses:
        "200":
          description: Invitation accepted; user logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/auth/switch-org:
    post:
      tags: [Authentication]
      summary: Switch organization context
      operationId: switchOrg
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SwitchOrgRequest"
      responses:
        "200":
          description: Organization switched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # OAuth 2.0 Device Authorization Grant (RFC 8628) — `sp auth login`.
  # Field names on the two public endpoints below are the RFC's snake_case
  # spellings, not solidping's house camelCase: they are the interoperable
  # OAuth contract every device-flow client expects.
  /api/v1/auth/device:
    post:
      tags: [Authentication]
      summary: Start a device authorization request (RFC 8628)
      operationId: startDeviceAuthorization
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceAuthorizationRequest"
      responses:
        "200":
          description: Device authorization request opened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceAuthorizationResponse"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/auth/device/token:
    post:
      tags: [Authentication]
      summary: Poll for the device authorization result (RFC 8628 token endpoint)
      operationId: pollDeviceToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceTokenRequest"
      responses:
        "200":
          description: The request was approved; the personal access token is delivered exactly once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceTokenResponse"
        "400":
          description: >-
            RFC 6749 §5.2 error envelope carrying an RFC 8628 error code
            (authorization_pending, slow_down, expired_token, access_denied,
            invalid_request, unsupported_grant_type)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceTokenError"

  /api/v1/auth/device/consent:
    get:
      tags: [Authentication]
      summary: Look up a pending device authorization request by user code
      operationId: getDeviceConsent
      security:
        - bearerAuth: []
      parameters:
        - name: userCode
          in: query
          required: true
          description: The short user code, in any spelling (case and dash insensitive)
          schema:
            type: string
      responses:
        "200":
          description: The pending request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceConsentInfo"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Authentication]
      summary: Approve or deny a pending device authorization request
      operationId: respondToDeviceConsent
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceConsentRequest"
      responses:
        "200":
          description: Decision recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceConsentResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The request was already approved or denied

  /api/v1/auth/tokens:
    get:
      tags: [Authentication]
      summary: List all user's tokens across orgs
      operationId: listAllTokens
      security:
        - bearerAuth: []
      parameters:
        - name: type
          in: query
          description: Filter by token type
          schema:
            type: string
      responses:
        "200":
          description: List of tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenListResponse"

  /api/v1/auth/tokens/{tokenUid}:
    delete:
      tags: [Authentication]
      summary: Revoke API token
      operationId: revokeToken
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TokenUidPath"
      responses:
        "204":
          description: Token revoked
        "404":
          $ref: "#/components/responses/NotFound"

  # Org-scoped token management
  /api/v1/orgs/{org}/tokens:
    get:
      tags: [Authentication]
      summary: List user's tokens for an organization
      operationId: listOrgTokens
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgPath"
        - name: type
          in: query
          description: Filter by token type
          schema:
            type: string
      responses:
        "200":
          description: List of tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenListResponse"
    post:
      tags: [Authentication]
      summary: Create Personal Access Token for organization
      operationId: createToken
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTokenRequest"
      responses:
        "201":
          description: Token created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateTokenResponse"

  # Check APIs
  /api/v1/orgs/{org}/checks:
    get:
      tags: [Checks]
      summary: List monitoring checks
      operationId: listChecks
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgPath"
        - name: labels
          in: query
          description: Filter by labels (format key1:value1,key2:value2 for AND logic)
          schema:
            type: string
          example: "env:prod,app:api"
        - name: with
          in: query
          description: >-
            Comma-separated list of additional data to include: "last_result"
            (the check's newest raw result) and "last_status_change" (when the
            derived check status last changed — served from the check row
            itself, so it costs no extra query and is omitted for checks that
            have never transitioned).
          schema:
            type: string
        - name: internal
          in: query
          description: Filter by internal status. "false" (default) shows only non-internal checks, "true" shows only internal checks, "all" shows all checks.
          schema:
            type: string
            enum: ["true", "false", "all"]
            default: "false"
        - name: sort
          in: query
          description: >-
            Opt-in ordering. "group" orders by group sortOrder ascending with
            ungrouped checks last, then created_at descending within a bucket —
            matching the dashboard's display order. "targetHost" orders by the
            derived targetHost ascending (case-sensitive, byte/codepoint order —
            e.g. "Zebra.example.com" sorts before "api.example.com"), checks
            with no targetHost last, then name ascending as a tiebreaker — lets
            a by-host view paginate consistently server-side. Omitted keeps the
            default created_at descending ordering. Any other value is a
            validation error.
          schema:
            type: string
            enum: ["group", "targetHost"]
      responses:
        "200":
          description: List of checks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckListResponse"
    post:
      tags: [Checks]
      summary: Create monitoring check
      operationId: createCheck
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCheckRequest"
      responses:
        "201":
          description: Check created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Check"
        "400":
          description: >-
            Validation error (code VALIDATION_ERROR) — e.g. a period below the
            check type's minimum. Heavy types enforce a per-type floor (browser
            60s, js 30s); every other type has a global 10s floor. Internal
            checks and the synthetic `sleep` type are exempt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/orgs/{org}/checks/stats:
    get:
      tags: [Checks]
      summary: Aggregate check counters for an organization
      operationId: getCheckStats
      description: >-
        Org-wide check counters computed server-side with a single SQL
        aggregation, so they are unaffected by the list endpoint's 100-row page
        clamp. Scope is the same set the list endpoint shows by default:
        non-deleted, non-internal checks. `total`, `byStatus`, `down` and
        `hardDown` span enabled and disabled checks alike; `enabled` and
        `disabled` partition the same set.


        The response is served from a per-organization in-memory cache with a
        1-minute TTL, so it can lag a check create/delete or a status flip by up
        to that long. Clients needing an exact, immediately consistent count
        should read `pagination.total` from the list endpoint instead.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgPath"
      responses:
        "200":
          description: Aggregate check counters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckStats"
        "404":
          description: Organization not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/orgs/{org}/checks/{slug}:
    put:
      tags: [Checks]
      summary: Create or update check by slug (upsert)
      operationId: upsertCheck
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgPath"
        - name: slug
          in: path
          required: true
          description: Check slug
          schema:
            type: string
            pattern: "^[a-z0-9-]{3,40}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertCheckRequest"
      responses:
        "200":
          description: Check updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Check"
        "201":
          description: Check created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Check"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/orgs/{org}/checks/{checkUid}:
    get:
      tags: [Checks]
      summary: Get check details
      operationId: getCheck
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgPath"
        - $ref: "#/components/parameters/CheckUidPath"
        - name: with
          in: query
          description: >-
            Comma-separated list of additional data to include: "last_result"
            (the check's newest raw result) and "last_status_change" (when the
            derived check status last changed — served from the check row
            itself, so it costs no extra query and is omitted for checks that
            have never transitioned).
          schema:
            type: string
      responses:
        "200":
          description: Check details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Check"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Checks]
      summary: Update monitoring check
      operationId: updateCheck
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgPath"
        - $ref: "#/components/parameters/CheckUidPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCheckRequest"
      responses:
        "200":
          description: Check updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Check"
        "400":
          description: >-
            Validation error (code VALIDATION_ERROR) — e.g. shrinking the
            period below the check type's minimum (browser 60s, js 30s,
            global 10s floor). Existing values are grandfathered; the bound
            bites on the next write to the period.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Checks]
      summary: Soft delete check
      operationId: deleteCheck
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgPath"
        - $ref: "#/components/parameters/CheckUidPath"
      responses:
        "204":
          description: Check deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Check has active incidents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/orgs/{org}/checks/validate:
    post:
      tags: [Checks]
      summary: Validate a check configuration without persisting it
      description: >-
        Runs the same validation the create/update paths run, but never writes.
        Returns whether the payload is valid plus any per-field validation
        messages.
      operationId: validateCheck
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateCheckRequest"
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidateCheckResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orgs/{org}/checks/{checkUid}/clone:
    post:
      tags: [Checks]
      summary: Clone an existing check
      description: >-
        Creates a near-identical copy of an existing check. Runtime state
        (status, results, incidents, scheduler row) is not copied; labels and
        channel bindings are re-linked to the new check.
      operationId: cloneCheck
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgPath"
        - $ref: "#/components/parameters/CheckUidPath"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloneCheckRequest"
      responses:
        "201":
          description: Check cloned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Check"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Slug already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/orgs/{org}/checks/{checkUid}/rotate-token:
    post:
      tags: [Checks]
      summary: Rotate a heartbeat check's ping token
      description: >-
        Mints a fresh ping token for a heartbeat check (heartbeat checks
        only) and persists it, invalidating every previously issued ping URL
        immediately — unlike webhook signing-secret rotation, there is no
        grace period, since heartbeat pings are frequent and the operator is
        expected to update the sender right away. Returns 400 for
        non-heartbeat checks.
      operationId: rotateHeartbeatToken
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgPath"
        - $ref: "#/components/parameters/CheckUidPath"
      responses:
        "200":
          description: Token rotated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Check"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orgs/{org}/dependencies:
    get:
      tags: [Checks]
      summary: Org-wide check dependency graph
      description: Returns every check (node) and every dependency edge in the organization.
      operationId: getOrgDependencyGraph
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgPath"
      responses:
        "200":
          description: Dependency graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgDependencyGraphResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orgs/{org}/checks/{check}/dependencies:
    get:
      tags: [Checks]
      summary: List dependencies for a check
      description: Returns the dependsOn (parents) and dependedOnBy (children) edges of the given check.
      operationId: listCheckDependencies
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgPath"
        - name: check
          in: path
          required: true
          description: Check uid or slug
          schema:
            type: string
      responses:
        "200":
          description: Per-check dependencies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerCheckDependenciesResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Checks]
      summary: Add a dependency edge to a check
      operationId: createCheckDependency
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgPath"
        - name: check
          in: path
          required: true
          description: Child check uid or slug
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDependencyRequest"
      responses:
        "201":
          description: Dependency created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dependency"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Dependency already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/orgs/{org}/checks/{check}/dependencies/{uid}:
    patch:
      tags: [Checks]
      summary: Update a dependency edge
      operationId: updateCheckDependency
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgPath"
        - name: check
          in: path
          required: true
          description: Child check uid or slug
          schema:
            type: string
        - name: uid
          in: path
          required: true
          description: Dependency edge uid
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDependencyRequest"
      responses:
        "200":
          description: Dependency updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dependency"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Checks]
      summary: Remove a dependency edge
      operationId: deleteCheckDependency
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgPath"
        - name: check
          in: path
          required: true
          description: Child check uid or slug
          schema:
            type: string
        - name: uid
          in: path
          required: true
          description: Dependency edge uid
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Dependency removed
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orgs/{org}/checks/{checkUid}/events:
    get:
      tags: [Events]
      summary: List events for a check
      operationId: listCheckEvents
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgPath"
        - $ref: "#/components/parameters/CheckUidPath"
        - name: cursor
          in: query
          description: Cursor for pagination
          schema:
            type: string
        - name: size
          in: query
          description: Results per page (default 20, max 100)
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        "200":
          description: List of events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # Badge APIs
  /api/v1/orgs/{org}/checks/{check}/badges/{format}:
    get:
      tags: [Badges]
      summary: Get status badge for a check
      operationId: getBadge
      description: Returns an SVG badge showing the check's current status. No authentication required.
      parameters:
        - $ref: "#/components/parameters/OrgPath"
        - name: check
          in: path
          required: true
          description: Check UID or slug
          schema:
            type: string
        - name: format
          in: path
          required: true
          description: Badge format
          schema:
            type: string
            enum: [status, uptime, response-time]
        - name: period
          in: query
          description: Time period for uptime calculation
          schema:
            type: string
        - name: label
          in: query
          description: Custom label for the badge
          schema:
            type: string
        - name: style
          in: query
          description: Badge style
          schema:
            type: string
            enum: [flat, flat-square, plastic]
      responses:
        "200":
          description: SVG badge image
          content:
            image/svg+xml:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"

  # Public status page views (no authentication). Disabled and private pages,
  # and pages that don't exist, all return the same NotFound shape — existence
  # is never leaked.
  /api/v1/status-pages/{org}:
    get:
      tags: [StatusPages]
      summary: View an organization's default public status page
      description: >-
        Renders the same payload as GET /api/v1/status-pages/{org}/{slug},
        resolved to the organization's default page. No authentication
        required.
      operationId: viewDefaultStatusPage
      parameters:
        - $ref: "#/components/parameters/OrgPath"
      responses:
        "200":
          description: The default status page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusPage"
        "401":
          $ref: "#/components/responses/StatusPageLocked"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/status-pages/{org}/{slug}:
    get:
      tags: [StatusPages]
      summary: View a public status page
      description: >-
        Full public rendering of a status page: sections, per-resource live
        status, and (when enabled) availability/response-time history. A
        disabled or non-public page returns 404, identical to a page that
        doesn't exist. No authentication required. Caching follows the page's
        visibility: a `public` page carries Cache-Control: public, max-age=60,
        while a `password` or `private` page — and every 401/404 answer —
        carries Cache-Control: private, no-store, so a shared cache can never
        retain a gated page's body. Holding a valid unlock cookie does not
        change that: it authorizes the visitor, not the CDN in front of them.
        Public responses carry Vary: X-Forwarded-Proto (the header the
        absolute URLs in these payloads derive their scheme from); gated ones
        add Cookie.
      operationId: viewStatusPage
      parameters:
        - $ref: "#/components/parameters/OrgPath"
        - name: slug
          in: path
          required: true
          description: Status page slug
          schema:
            type: string
      responses:
        "200":
          description: The status page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusPage"
        "401":
          $ref: "#/components/responses/StatusPageLocked"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/status-pages/{org}/{slug}/summary:
    get:
      tags: [StatusPages]
      summary: Lightweight status summary for a status page
      description: >-
        Cheap "is it up?" companion to the full page view: overall status,
        per-category counts, page identity, and the canonical public URL —
        no sections, no per-resource history. Same visibility gate AND the
        same caching rule as the full page view: Cache-Control: public,
        max-age=60 for a `public` page, private, no-store for a `password` or
        `private` one (unlocked or not) and for every 401/404 answer. A
        disabled or non-public page returns 404, identical to a page that
        doesn't exist. No authentication required.
      operationId: viewStatusPageSummary
      parameters:
        - $ref: "#/components/parameters/OrgPath"
        - name: slug
          in: path
          required: true
          description: Status page slug
          schema:
            type: string
      responses:
        "200":
          description: The status page summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusPageSummary"
        "401":
          $ref: "#/components/responses/StatusPageLocked"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/status-pages/{org}/{slug}/badge:
    get:
      tags: [StatusPages, Badges]
      summary: SVG badge for a status page's overall status
      description: >-
        Public SVG badge (shields.io style) reflecting the page-level rollup
        status — the static, script-free sibling of the JS embed widget, for
        contexts like GitHub READMEs where scripts can't run. Same visibility
        gate as the full view and the summary endpoint: a disabled or
        non-public page returns 404, identical to a page that doesn't exist.
        Same caching rule too: Cache-Control: public, max-age=60 for a
        `public` page, private, no-store for a `password` or `private` one —
        the badge renders the rollup status of a page the requester may not be
        entitled to see. No authentication required.
      operationId: getStatusPageBadge
      parameters:
        - $ref: "#/components/parameters/OrgPath"
        - name: slug
          in: path
          required: true
          description: Status page slug
          schema:
            type: string
        - name: label
          in: query
          description: Custom left-side label (default the page name)
          schema:
            type: string
        - name: style
          in: query
          description: Badge style
          schema:
            type: string
            enum: [flat, flat-square]
        - name: minWidth
          in: query
          description: Minimum badge width in pixels (0-800)
          schema:
            type: integer
        - name: width
          in: query
          description: Badge width in pixels (60-800)
          schema:
            type: integer
      responses:
        "200":
          description: SVG badge image
          content:
            image/svg+xml:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/StatusPageLocked"
        "404":
          $ref: "#/components/responses/NotFound"

  /embed/v1/widget.js:
    get:
      tags: [StatusPages]
      summary: Embeddable live status widget script
      description: >-
        Self-contained JavaScript (IIFE) that renders a live status pill on a
        third-party site. It is loaded by an async script tag carrying
        data-page="org/slug", and configured entirely through data-attributes:
        data-mode (inline|floating), data-position (bottom-right|bottom-left),
        data-theme (light|dark|auto), data-size (sm|md|lg), per-state label
        overrides data-label-operational|degraded|down|maintenance|unknown,
        and data-force-status (operational|degraded|down|maintenance|unknown)
        to render a status statically without polling. The widget polls the
        status page summary endpoint every 60 s with an uncredentialed
        request and renders into a shadow root; a failed request or an
        unknown page renders nothing. Everything under /embed/v1/ is a frozen
        public contract — behavior changes ship under /embed/v2/, but
        additive, backward-compatible data-attributes may land within v1.
        Response carries Cache-Control: public, max-age=3600. No authentication
        required.
      operationId: getEmbedWidgetV1
      responses:
        "200":
          description: The widget script
          content:
            application/javascript:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/status-pages/{org}/{slug}/incidents:
    get:
      tags: [StatusPages]
      summary: Public incident history for a status page
      description: >-
        The customer-facing incidents published on this page (spec
        2026-08-19-08). Without `active`, returns the page's history window;
        with `active=true`, only the incidents that are still open — the same
        set the full page view embeds as `activeIncidents[]`.

        Same visibility gate as the full page view: a disabled or non-public
        page returns 404, identical to a page that doesn't exist. Same caching
        rule too — Cache-Control: public, max-age=60 for a `public` page,
        private, no-store for a `password` or `private` one (unlocked or not),
        since this payload quotes incident titles and update bodies verbatim.
        No authentication required.

        Every field is operator-authored or templated from the page's own
        public resource names. Probe output, error strings and internal
        hostnames are structurally unable to reach this payload.
      operationId: viewPublicStatusPageIncidents
      parameters:
        - $ref: "#/components/parameters/OrgPath"
        - name: slug
          in: path
          required: true
          description: Status page slug
          schema:
            type: string
        - name: active
          in: query
          description: When "true", returns only incidents that are not resolved.
          schema:
            type: boolean
      responses:
        "200":
          description: The page's public incidents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicIncidentListResponse"
        "401":
          $ref: "#/components/responses/StatusPageLocked"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/status-pages/{org}/{slug}/feed.xml:
    get:
      tags: [StatusPages]
      summary: Atom feed of a status page's status-update timeline
      description: >-
        Public Atom/RSS feed of the page's recent status updates (incident
        posts and manual updates). Same visibility gate as the full page
        view, and the same visibility-driven caching: Cache-Control: public,
        max-age=300 for a `public` page, private, no-store for a `password` or
        `private` one — the feed quotes update titles and bodies verbatim. No
        authentication required.
      operationId: statusPageFeed
      parameters:
        - $ref: "#/components/parameters/OrgPath"
        - name: slug
          in: path
          required: true
          description: Status page slug
          schema:
            type: string
      responses:
        "200":
          description: Atom feed XML
          content:
            application/atom+xml:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/StatusPageLocked"
        "404":
          $ref: "#/components/responses/NotFound"

  # Unlock a password-protected status page (spec 2026-08-21-07). Public and
  # unauthenticated by design: the password IS the credential.
  /api/v1/status-pages/{org}/{slug}/unlock:
    post:
      tags: [StatusPages]
      summary: Unlock a password-protected status page
      description: >-
        Verifies the page password and, on success, sets the unlock cookie
        every gated public read then requires.


        The cookie is HOST-ONLY (no Domain attribute), HttpOnly, SameSite=Lax,
        Secure when the request arrived over TLS, and lasts 12 hours. Host-only
        is what makes it work on a customer's own domain without ever minting a
        cookie for solidping.io. It is signed with a key derived from the stored
        password hash, so changing or clearing the password invalidates every
        outstanding unlock immediately.


        Attempts are rate limited per (client IP, page).
      operationId: unlockStatusPage
      parameters:
        - $ref: "#/components/parameters/OrgPath"
        - name: slug
          in: path
          required: true
          description: Status page slug
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusPageUnlockRequest"
      responses:
        "204":
          description: >-
            Unlocked. The response carries Set-Cookie: sp_unlock_<pageUid>.
          headers:
            Set-Cookie:
              description: The host-only unlock cookie.
              schema:
                type: string
        "401":
          description: >-
            Incorrect password. Same STATUS_PAGE_LOCKED code the gated reads
            use, so a client can keep the visitor on the unlock form with one
            branch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >-
            No live, password-protected page under this slug. A public page
            answers 404 here too — telling a caller "this page exists but needs
            no password" would be a needless disclosure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/status-pages/{org}/unlock:
    post:
      tags: [StatusPages]
      summary: Unlock an organization's password-protected default status page
      description: >-
        Same as POST /api/v1/status-pages/{org}/{slug}/unlock, resolved to the
        organization's default page — the form a client reaching a default page
        through /status0/{org} can use, having no slug to send.
      operationId: unlockDefaultStatusPage
      parameters:
        - $ref: "#/components/parameters/OrgPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusPageUnlockRequest"
      responses:
        "204":
          description: Unlocked. The response carries the unlock cookie.
          headers:
            Set-Cookie:
              description: The host-only unlock cookie.
              schema:
                type: string
        "401":
          description: Incorrect password (code STATUS_PAGE_LOCKED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No live, password-protected default page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # Results APIs
  /api/v1/orgs/{org}/results:
    get:
      tags: [Results]
      summary: List results across all checks in organization
      operationId: listOrgResults
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgPath"
        - name: checkUid
          in: query
          description: Filter by check UID or slug (comma-separated for multiple)
          schema:
            type: string
        - name: checkType
          in: query
          description: Filter by check type (comma-separated for multiple)
          schema:
            type: string
          example: "http,dns"
        - name: status
          in: query
          description: Filter by status (comma-separated for multiple)
          schema:
            type: string
          example: "up,down"
        - name: region
          in: query
          description: Filter by region (comma-separated for multiple)
          schema:
            type: string
        - name: periodType
          in: query
          description: >
            Filter by period type (comma-separated for multiple). Both useful
            indexes on `results` are partial and split on
            `period_type = 'raw'`, so a single request naming raw AND a rollup
            tier is served by neither and sequentially scans the table — ask
            for one side per request. A raw-only request is additionally
            clamped server-side to the raw-retention band (see the `window`
            object on the response); rows older than that were deleted by the
            aggregation job, so nothing is lost.
          schema:
            type: string
          example: "raw"
        - name: periodStartAfter
          in: query
          description: >
            RFC3339 timestamp. Filters on `period_start >= value`. For a
            raw-only request the server may move this forward to the
            raw-retention boundary; the effective value is echoed in the
            response's `window` object.
          schema:
            type: string
            format: date-time
        - name: periodEndBefore
          in: query
          description: >
            RFC3339 timestamp. Despite the name it filters on
            `period_start < value`, NOT on `period_end` — an aggregated bucket
            that starts inside the window and ends outside it IS returned.
            That is deliberate and charting depends on it: a partially visible
            bucket should still be drawn.
          schema:
            type: string
            format: date-time
        - name: cursor
          in: query
          description: Cursor for pagination
          schema:
            type: string
        - name: limit
          in: query
          description: Results per page (default 100, max 1000)
          schema:
            type: integer
            default: 100
            maximum: 1000
        - name: size
          in: query
          description: Deprecated alias for `limit`.
          deprecated: true
          schema:
            type: integer
        - name: with
          in: query
          description: >
            Comma-separated optional fields to include. durationAvgMs and
            durationP95Ms are populated on aggregated rollup rows (hour/day/
            month) from the stored duration_avg/duration_p95 columns; both
            are absent on raw rows, which don't store them.
          schema:
            type: string
          example: "metrics,output,durationMs,region"
      responses:
        "200":
          description: List of results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgResultListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orgs/{org}/checks/{check}/availability:
    get:
      tags: [Results]
      summary: Per-period availability statistics for a single check
      description: >
        Returns real, server-measured availability for each requested period
        (replacing the old client-side estimate). availabilityPct and
        downtimeSeconds are probe-ratio (the share of probes that succeeded);
        the incidents block reports confirmed-outage wall-clock time. A period
        with no data has availabilityPct=null and hasData=false (no data is not
        100%).
      operationId: getCheckAvailability
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgPath"
        - name: check
          in: path
          required: true
          description: Check UID (UUID) or slug
          schema:
            type: string
        - name: periods
          in: query
          required: true
          description: >
            Comma-separated period tokens. Each is a trailing duration
            (suffixes h/d/w/y, e.g. 24h, 7d, 30d, 90d, 365d, 1y) or a calendar
            token (today, mtd, ytd) resolved against tz. Unknown tokens are
            rejected (VALIDATION_ERROR); at most 12 periods, none exceeding the
            day-tier retention horizon (~12 months).
          schema:
            type: string
          example: "today,7d,30d,365d"
        - name: tz
          in: query
          required: false
          description: >
            IANA time zone used to resolve the calendar tokens (today/mtd/ytd).
            Trailing durations are tz-independent. Defaults to UTC.
          schema:
            type: string
            default: UTC
          example: "Europe/Paris"
      responses:
        "200":
          description: Per-period availability statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckAvailabilityResponse"
        "400":
          description: Invalid period or timezone parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orgs/{org}/checks/{check}/results/{uid}:
    get:
      tags: [Results]
      summary: Get a single result, with chronological neighbor UIDs
      description: >
        Returns one result row by UID. When the raw row has been rolled up
        into an aggregation (see retention/aggregation), falls back to the
        smallest-period aggregation covering the requested UID's embedded
        UUIDv7 timestamp and includes a `fallback` block describing the
        substitution. previousUid/nextUid identify the next-older/next-newer
        row in the same check + periodType series (the covering
        aggregation's series when a fallback applies), omitted at either
        boundary. Two rows sharing periodStart are ordered by uid, so
        stepping across them never skips or repeats.
      operationId: getOrgResult
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgPath"
        - name: check
          in: path
          required: true
          description: Check UID or slug
          schema:
            type: string
        - name: uid
          in: path
          required: true
          description: Result UID
          schema:
            type: string
            format: uuid
        - name: region
          in: query
          description: >
            Narrows the previousUid/nextUid neighbor scope only
            (comma-separated for multiple); the requested row is still
            resolved by uid regardless of region. Omitted, neighbors are
            chronological across all regions.
          schema:
            type: string
      responses:
        "200":
          description: The result, with optional fallback and neighbor UIDs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetOrgResultResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # Incident APIs
  /api/v1/orgs/{org}/incidents:
    get:
      tags: [Incidents]
      summary: List incidents
      operationId: listIncidents
