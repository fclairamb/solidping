    # Entitlements schemas
    EntitlementLimits:
      type: object
      description: Per-org numeric limits; null/absent means unlimited
      properties:
        maxChecks:
          type: integer
          nullable: true
          description: Maximum non-internal checks (null = unlimited)
        maxUsers:
          type: integer
          nullable: true
          description: >-
            Maximum organization members (null = unlimited). The deprecated
            key `maxSsoUsers` is still accepted as a decode-only alias on
            write; responses always use `maxUsers`.
        maxChecksPerMinute:
          type: integer
          nullable: true
          description: Aggregate check dispatch rate per minute (null = unlimited)
        maxSmsPerMonth:
          type: integer
          nullable: true
          description: Outbound SMS per UTC month (null = unlimited)
        maxCallsPerMonth:
          type: integer
          nullable: true
          description: Outbound voice calls per UTC month (null = unlimited)
        maxWhatsappPerMonth:
          type: integer
          nullable: true
          description: >-
            Outbound WhatsApp template messages per UTC month
            (null = unlimited)
        maxSlos:
          type: integer
          nullable: true
          description: Maximum service-level objectives (null = unlimited)
        whiteLabel:
          type: boolean
          nullable: true
          description: >-
            Whether the organization may hide the "powered by SolidPing" badge
            on its status pages. Unlike the caps above, null does NOT mean
            unlimited — it means "use the deployment default" (true
            self-hosted, false on the SaaS).

    EntitlementsUsage:
      type: object
      required: [checks, checksPerMinute, ssoUsers]
      properties:
        checks:
          type: integer
        checksPerMinute:
          type: number
          format: double
        ssoUsers:
          type: integer
        whatsappThisMonth:
          type: integer
          description: >-
            Outbound WhatsApp template messages sent in the current UTC month.
            A persistent counter, not a live count.

    EntitlementsChecksPerMinute:
      type: object
      description: >-
        The organization's scheduled check-execution rate against its
        MaxChecksPerMinute cap, plus how many executions the rate gate actually
        skipped today. Always present (it is not behind `?with=usage`), because
        it drives the over-limit banner on pages that do not need the full usage
        roll-up. Omitted only when it could not be computed.
      required: [demand, skippedToday]
      properties:
        demand:
          type: number
          format: double
          description: >-
            Sum over enabled, non-deleted, non-internal, non-passive checks of
            max(1, regions) x 60s / period. Passive types (heartbeat, email)
            are excluded: they return before the rate gate and consume no
            execution budget.
        limit:
          type: integer
          nullable: true
          description: Resolved MaxChecksPerMinute cap; null means unlimited.
        skippedToday:
          type: integer
          description: >-
            Check executions deferred by the per-organization rate gate today
            (UTC), counted across both the in-process worker path and the agent
            dispatch path.

    EntitlementsResponse:
      type: object
      required: [limits, source, stale]
      properties:
        limits:
          $ref: "#/components/schemas/EntitlementLimits"
        source:
          type: string
          description: >-
            Where the entitlements came from. `default` / `self-hosted` (no
            stored row), `billing-service`, `org-admin` (org-scoped write by an
            org admin) or `admin` (superadmin override). An `admin` row resolves
            WHOLE-ROW — a null cap means unlimited rather than "inherit the
            deployment default" — and suppresses billing pushes until released.
          enum: [default, self-hosted, org-admin, admin, billing-service]
        displayName:
          type: string
        displayEmoji:
          type: string
        expiresAt:
          type: string
          format: date-time
        lastSyncedAt:
          type: string
          format: date-time
        stale:
          type: boolean
        usage:
          $ref: "#/components/schemas/EntitlementsUsage"
        checksPerMinute:
          $ref: "#/components/schemas/EntitlementsChecksPerMinute"
        upgradeUrl:
          type: string
        applied:
          type: boolean
          description: >-
            Present on write responses only. False when the precedence rule
            discarded the write — a billing push onto an admin override is
            accepted with 200 (billing must not error-loop) but changes
            nothing.
        suppressedBy:
          type: string
          description: >-
            The entitlement source that won, when `applied` is false. Today
            always `admin`.
        message:
          type: string
          description: Why the write was not applied, in words.

    SetEntitlementsRequest:
      type: object
      properties:
        limits:
          $ref: "#/components/schemas/EntitlementLimits"
        source:
          type: string
          description: >-
            IGNORED for user-driven writes — the server decides the source,
            because it is an authorization outcome rather than a label. A
            superadmin write records `admin`, any other authenticated caller
            records `org-admin`, and a trusted service defaults to
            `billing-service`.
        displayName:
          type: string
        displayEmoji:
          type: string
        externalRef:
          type: string
        metadata:
          type: object
          additionalProperties: true
        expiresAt:
          type: string
          format: date-time
        lastSyncedAt:
          type: string
          format: date-time

    EntitlementsAudit:
      type: object
      required: [uid, organizationUid, source, actor, afterSnapshot, createdAt]
      properties:
        uid:
          type: string
        organizationUid:
          type: string
        source:
          type: string
        actor:
          type: string
        beforeSnapshot:
          type: object
          additionalProperties: true
          nullable: true
        afterSnapshot:
          type: object
          additionalProperties: true
        reason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    EntitlementsAuditListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/EntitlementsAudit"

    AdminEntitlementsRow:
      type: object
      description: One organization in the super-admin entitlements list.
      required: [organizationUid, slug, name, limits, source, stale, overCheckRate]
      allOf:
        - $ref: "#/components/schemas/EntitlementsResponse"
        - type: object
          properties:
            organizationUid:
              type: string
            slug:
              type: string
            name:
              type: string
            overCheckRate:
              type: boolean
              description: >-
                Scheduled check demand exceeds the resolved MaxChecksPerMinute
                cap. An unlimited cap is never over.
            adminOverrideSince:
              type: string
              format: date-time
              description: >-
                When the current admin override was written. Absent unless the
                stored row is admin-sourced.

    AdminEntitlementsListResponse:
      type: object
      required: [data, total]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AdminEntitlementsRow"
        total:
          type: integer
          description: Organizations matching the search, before paging.

    AdminEntitlementsStoredRow:
      type: object
      description: >-
        The raw stored org_entitlements row. Absent entirely when the
        organization has never had one, which is exactly the "resolving to
        deployment defaults" state.
      required: [source, limits, createdAt, updatedAt]
      properties:
        source:
          type: string
        limits:
          $ref: "#/components/schemas/EntitlementLimits"
        displayName:
          type: string
        displayEmoji:
          type: string
        externalRef:
          type: string
        expiresAt:
          type: string
          format: date-time
        lastSyncedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AdminEntitlementsDetail:
      type: object
      required: [organizationUid, slug, name, limits, source, stale, defaults, audits]
      allOf:
        - $ref: "#/components/schemas/EntitlementsResponse"
        - type: object
          properties:
            organizationUid:
              type: string
            slug:
              type: string
            name:
              type: string
            overCheckRate:
              type: boolean
            stored:
              $ref: "#/components/schemas/AdminEntitlementsStoredRow"
            defaults:
              $ref: "#/components/schemas/EntitlementLimits"
            audits:
              type: array
              items:
                $ref: "#/components/schemas/EntitlementsAudit"

    AdminEntitlementsWriteResponse:
      type: object
      required: [limits, source, stale, applied]
      allOf:
        - $ref: "#/components/schemas/EntitlementsResponse"
        - type: object
          properties:
            applied:
              type: boolean
            released:
              type: boolean
              description: >-
                A stored row was actually removed. False when releasing an
                organization that had no override.

    # File schemas
    FileResponse:
