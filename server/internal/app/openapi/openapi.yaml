        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orgs/{org}/members/{uid}/contacts:
    post:
      tags: [Members]
      summary: Pre-provision an unverified paging contact for a member
      description: >-
        Lets an admin add a phone or WhatsApp contact for another member, in
        UNVERIFIED state. The contact becomes pageable only after its owner
