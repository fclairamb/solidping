          type: string
        position:
          type: integer

    EscalationStep:
      type: object
      required: [uid, position, delaySeconds]
      properties:
        uid:
          type: string
          format: uuid
        position:
          type: integer
        delaySeconds:
          type: integer
        targets:
          type: array
          items:
            $ref: "#/components/schemas/EscalationTarget"

    EscalationPolicy:
      type: object
      required: [uid, name, repeatMax, createdAt, updatedAt]
      properties:
        uid:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        repeatMax:
          type: integer
        repeatAfterSeconds:
          type: integer
        steps:
          type: array
          items:
            $ref: "#/components/schemas/EscalationStep"
        stepCount:
          type: integer
          description: >-
            Number of steps in the policy. A value of 0 marks a "silent" policy
            (the null-object convention — pages nobody). Always present,
            including on the light list response where steps are omitted.
        usageCheckCount:
          type: integer
          description: >-
            Checks directly referencing this policy. Present only on the list
            response (drives the delete-guard confirmation).
        usageGroupCount:
          type: integer
          description: >-
            Check groups directly referencing this policy. Present only on the
            list response.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    EscalationPolicyListResponse:
      type: object
