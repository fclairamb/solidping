    SLO:
      type: object
      properties:
        uid:
          type: string
        name:
          type: string
        slug:
          type: string
        checkUid:
          type: string
          description: Set when the objective is scoped to one check
        checkGroupUid:
          type: string
          description: Set when the objective is scoped to one check group
        checkName:
          type: string
        checkGroupName:
          type: string
        targetPct:
          type: number
          format: double
        timezone:
          type: string
          description: IANA zone the calendar month is resolved in
        excludeMaintenance:
          type: boolean
        enabled:
          type: boolean
        burning:
          type: boolean
          description: >-
            True while at least one burn-rate alert policy on this objective has
            an open incident. Derived from the incident rows, never stored.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SLOAlertPolicy:
      type: object
      description: >-
        One built-in multiwindow burn-rate alert policy. An alert fires only
        when BOTH windows exceed the threshold: the long window proves the burn
        is significant, the short one proves it is still happening.
      properties:
        uid:
          type: string
          format: uuid
        sloUid:
          type: string
          format: uuid
        kind:
          type: string
          enum: [fast, slow]
          description: Built-in identity. Not writable.
        enabled:
          type: boolean
        longWindowSeconds:
          type: integer
          description: Significance window. Stored, never derived.
        shortWindowSeconds:
          type: integer
          description: Confirmation window. Must be <= longWindowSeconds.
        threshold:
          type: number
          format: double
          description: >-
            Burn-rate multiple both windows must exceed. 1.0 spends the calendar
            budget exactly by period end.
        severity:
          type: string
          enum: [critical, warning]
        minSamples:
          type: integer
          description: >-
            Per-window probe floor. Below it the window is inconclusive: it does
            not fire, and it does not count as below-threshold for auto-resolve.
        lastEvaluatedAt:
          type: string
          format: date-time
          nullable: true
        longBurnRate:
          type: number
          format: double
          nullable: true
          description: Null when the window carries no countable probe. Never 0.
        shortBurnRate:
          type: number
          format: double
          nullable: true
        longSamples:
          type: integer
        shortSamples:
          type: integer
        longConclusive:
          type: boolean
        shortConclusive:
          type: boolean
        overThresholdNow:
          type: boolean
          description: Both windows are conclusively over the threshold right now.
        firing:
          type: boolean
          description: An open burn incident exists for this policy.
        incidentUid:
          type: string
          format: uuid
          nullable: true
        incidentNumber:
          type: integer
          format: int64
          nullable: true
        firingSince:
          type: string
          format: date-time
          nullable: true
        resolvingSince:
          type: string
          format: date-time
          nullable: true
          description: >-
            Hysteresis anchor: both windows have been below threshold since this
            instant, and the incident auto-resolves once that has held for a
            full short window.

