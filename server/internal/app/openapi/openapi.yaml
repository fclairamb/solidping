          nullable: true
        type:
          type: string
        config:
          type: object
          additionalProperties: true
        encryptedKeys:
          type: array
          items:
            type: string
        encrypted:
          type: boolean
        periodSeconds:
          type: integer
          format: int64
        scheduledAt:
          type: string
          format: date-time
          nullable: true
        leaseWorkerUid:
          type: string
          nullable: true
        leaseExpiresAt:
          type: string
          format: date-time
          nullable: true
        leaseStarts:
          type: integer
        updatedAt:
          type: string
          format: date-time
        state:
