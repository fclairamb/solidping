    # Organization schemas
    CreateOrgRequest:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
          description: Human-readable organization name
        slug:
          type: string
          description: URL-friendly identifier (3-20 chars, lowercase alphanumeric with hyphens)

    DeleteOrgRequest:
      type: object
      required: [slug]
      properties:
        slug:
          type: string
          description: >-
            The organization's own slug, retyped as confirmation. Must match the
            `org` path parameter exactly.

    OrgResponse:
      type: object
      required: [uid, slug, name, accessToken, refreshToken, expiresIn, tokenType]
      properties:
        uid:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        logoUrl:
          type: string
          nullable: true
          description: >-
            The organization's logo: an absolute http(s) URL, or a relative
            `/pub/assets/{fileUid}` path for an uploaded image. Null when the
            organization has no logo.
        accessToken:
          type: string
          description: Access token scoped to the new organization
        refreshToken:
          type: string
        expiresIn:
          type: integer
          description: Access token lifetime in seconds
        tokenType:
          type: string

    UpdateOrgProfileRequest:
      type: object
      description: >-
        All fields are optional. An omitted field is left untouched; `logoUrl`
        additionally accepts an explicit null (or empty string) meaning "clear
        the logo".
      properties:
        name:
          type: string
          maxLength: 100
          description: Display name. Must not be blank.
        slug:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{1,18}[a-z0-9]$"
          description: >-
            New URL slug, 3-20 characters, lowercase alphanumeric with hyphens.
            Must not be held by another live organization; a slug held only as
            another organization's previous slug is claimable.
        logoUrl:
          type: string
          nullable: true
          maxLength: 2048
          description: >-
            Absolute http(s) URL of the logo. Null or an empty string clears it.
            Relative paths are rejected — an uploaded logo is set through
            `POST /api/v1/orgs/{org}/logo`, not here.

    OrgProfileResponse:
      type: object
      required: [uid, slug, name, logoUrl]
      properties:
        uid:
          type: string
          format: uuid
        slug:
          type: string
          description: The organization's current slug.
        name:
          type: string
        logoUrl:
          type: string
          nullable: true
        previousSlug:
          type: string
          description: >-
            The slug that was just freed by a rename. It keeps redirecting to
            `slug` until another organization claims it. Absent when the slug did
            not change.
        accessToken:
          type: string
          description: >-
            Access token scoped to the new slug. Present only when the slug
            changed — the caller's previous token is scoped to the old slug and
            is refused against the new one.
        refreshToken:
          type: string
        expiresIn:
          type: integer
          description: Access token lifetime in seconds
        tokenType:
          type: string

    OrgLogoResponse:
      type: object
      required: [uid, slug, name, logoUrl]
      properties:
        uid:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        logoUrl:
          type: string
          nullable: true

    OrgSettingsResponse:
      type: object
      required: [registrationEmailPattern, inheritingCheckCount, tracerouteOnFailure]
      properties:
        registrationEmailPattern:
          type: string
          description: Auto-join email regex; empty when unset
        sessionMaxDurationSeconds:
          type: integer
          description: Org-level session max duration override in seconds; omitted when inherited
        defaultEscalationPolicyUid:
          type: string
          format: uuid
          nullable: true
          description: >-
            Org-wide fallback escalation policy for checks that resolve to no
            policy of their own (check → group → org default → none). Omitted
            when unset (legacy behavior).
        inheritingCheckCount:
          type: integer
          description: >-
            How many live checks currently resolve to no policy of their own —
            the blast radius of setting or changing the org default.
        tracerouteOnFailure:
          type: boolean
          description: >-
            Organization default for path-trace-on-failure. Applies to every
            check whose own `tracerouteOnFailure` is `inherit`. True when the
            organization has never set it.

    UpdateOrgSettingsRequest:
      type: object
      properties:
        registrationEmailPattern:
          type: string
          description: Auto-join email regex; empty string clears it
        sessionMaxDurationSeconds:
          type: integer
          description: Session max duration override in seconds; <=0 clears the override
        defaultEscalationPolicyUid:
          type: string
          description: >-
            A UID sets the org default escalation policy (must be a policy in
            this org); an empty string clears it; omit to leave unchanged.
        tracerouteOnFailure:
          type: boolean
          description: >-
            Sets the organization default for path-trace-on-failure. Omit to
            leave unchanged.

