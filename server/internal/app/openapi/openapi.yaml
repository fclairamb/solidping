    # System Parameters
    SystemParameter:
      type: object
      properties:
        key:
          type: string
          description: Parameter key
        value:
          description: Parameter value (masked with "******" for secrets)
        secret:
          type: boolean
          description: Whether this is a secret parameter
        updatedAt:
          type: string
          format: date-time
          description: When the parameter was last updated

    SystemParameterListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/SystemParameter"

    SetSystemParameterRequest:
      type: object
      properties:
        value:
          description: The parameter value to set
        secret:
          type: boolean
          description: Whether this is a secret parameter (optional, defaults to false)

    LaneLoadStats:
      type: object
      description: One lane's offered load for a worker.
      required: [jobs, costEwmaSumMs, delayEwmaSumMs, dutySumPct]
      properties:
        jobs:
          type: integer
          description: Enabled check jobs in this lane the worker is eligible to claim.
        costEwmaSumMs:
          type: number
          description: Sum of the jobs' cost EWMAs (ms) — wall-clock cost of one full pass.
        delayEwmaSumMs:
          type: number
          description: Sum of the jobs' start-lateness EWMAs (ms) — grows when the lane runs behind.
        dutySumPct:
          type: number
          description: >
            Sum of per-job duty cycles (100 × cost EWMA / period). 100 ≈ one
            permanently occupied runner slot; compare against the worker's
            pool capacity to judge overload.

    WorkerLaneLoad:
      type: object
      required: [workerUid, name, fast, slow]
      properties:
        workerUid:
          type: string
        name:
          type: string
        region:
          type: string
        lastActiveAt:
          type: string
          format: date-time
        fast:
          $ref: "#/components/schemas/LaneLoadStats"
        slow:
          $ref: "#/components/schemas/LaneLoadStats"

    LaneLoadResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/WorkerLaneLoad"

    RegionMigrationRequest:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
          description: >
            The region slug to migrate away from. Need NOT be a declared
            region — a slug that no longer exists anywhere is the normal case.
          example: default
        to:
          type: string
          description: >
            The region slug to migrate to. Must be declared in the `regions`
            system parameter or served by a live worker.
          example: gravelines
        dryRun:
          type: boolean
          default: false
          description: >
            When true, returns the full report without writing anything. The
            numbers are computed from the same pre-state the real run uses, so
            a dry run and the apply that follows it agree.

    RegionMigrationReport:
      type: object
      required:
        [
          from,
          to,
          dryRun,
          checksUpdated,
          jobsReassigned,
          jobsDeleted,
          byOrg,
          overdueRecovered,
        ]
      properties:
        from:
          type: string
        to:
          type: string
        dryRun:
          type: boolean
        checksUpdated:
          type: integer
          description: >
            Checks the migration touches: their `regions` array was rewritten,
            they owned a job stranded under `from`, or both.
        jobsReassigned:
          type: integer
          description: Stranded `from` jobs that come back to life under `to`.
        jobsDeleted:
          type: integer
          description: >
            `from` jobs removed without a replacement — the check does not
            declare `to`, is disabled, or already owns a `to` job (the unique
            `(checkUid, region)` case, where the correct job is kept).
        byOrg:
          type: object
          additionalProperties:
            type: integer
          description: checksUpdated split by organization slug.
        overdueRecovered:
          type: integer
          description: >
            Reassigned jobs whose `scheduledAt` was already in the past — the
            stranded backlog that starts running again.

    RegionHealthRow:
      type: object
      required:
        [
          slug,
          declared,
          liveWorkers,
          lastWorkerSeenAt,
          checksReferencing,
          jobs,
          jobsOverdue,
          oldestOverdueAt,
          ghost,
        ]
      properties:
        slug:
          type: string
        declared:
          type: boolean
          description: Whether the slug is present in the `regions` system parameter.
        liveWorkers:
          type: integer
          description: >
            Non-deleted workers within the liveness window whose announced
            region has this slug as a prefix.
        lastWorkerSeenAt:
          type: string
          format: date-time
          nullable: true
          description: >
            Max `lastActiveAt` across every matching worker, including
            soft-deleted ones — dates when the region went dark.
        checksReferencing:
          type: integer
          description: Distinct, non-deleted checks whose `regions` array names this slug.
        jobs:
          type: integer
          description: check_jobs rows carrying this slug. NULL-region jobs are never counted.
        jobsOverdue:
          type: integer
          description: Subset of `jobs` whose `scheduledAt` has already passed.
        oldestOverdueAt:
          type: string
          format: date-time
          nullable: true
          description: Earliest `scheduledAt` among the overdue jobs, null when there are none.
        ghost:
          type: boolean
          description: >
            `(jobs > 0 || checksReferencing > 0) && liveWorkers == 0` — work
            assigned to a slug nothing live can serve.

    RegionHealthReport:
      type: object
      required: [regions, ghostCount, generatedAt]
      properties:
        regions:
          type: array
          items:
            $ref: "#/components/schemas/RegionHealthRow"
        ghostCount:
          type: integer
          description: Count of rows where `ghost` is true.
        generatedAt:
          type: string
          format: date-time

