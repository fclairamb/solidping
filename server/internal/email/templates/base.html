<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- iOS Mail otherwise re-flows (and shrinks) the whole message on its own. -->
    <meta name="x-apple-disable-message-reformatting">
    <!-- Stops clients auto-linking incident ids, durations and dates as phone
         numbers / addresses, which turns them blue-underlined mid-sentence. -->
    <meta name="format-detection" content="telephone=no,date=no,address=no,email=no,url=no">
    <!-- The light pin. "No dark styles" is NOT the same as "renders in light":
         Apple Mail, Outlook.com and Gmail's Android app auto-INVERT a
         light-only email, which turns the white card grey and recolors the
         state pill and stripe that carry the meaning of an incident alert. Declaring light-only opts out of
         that forced inversion, so the design below is what actually reaches
         the reader.

         This pin STAYS even though the stylesheet now ships a designed dark
         palette (see the prefers-color-scheme block at the bottom of <style>).
         The two are not in conflict: the pin is what keeps Gmail — which does
         not support the media query at all — on the designed light rendering
         instead of its own auto-darkening, while the media query is evaluated
         from the OS/app setting by the clients that support it. Worst case a
         client honours the pin so strictly that the dark block never fires,
         which is exactly today's rendering.

         These two metas and the :root rule below are ONE declaration in three
         places — change them together or not at all. Flipping them to
         "light dark" is the separate, human-gated Gmail decision written up in
         wiki/features/email-dark-mode.md; it is deliberately not made here. -->
    <meta name="color-scheme" content="light only">
    <meta name="supported-color-schemes" content="light only">
    <title>SolidPing</title>
    <style>
        /* SolidPing email palette, flattened to hex (email clients have neither
           CSS custom properties nor oklch()). Primary #1E64EF is the dashboard's
           --primary; white on it is 5.1:1.

           Layout: logo above a plain white card, footer below it. The card
           carries only what the reader acts on. State (down, recovered...) is
           a thin colored stripe on the card plus a tinted pill, not a
           full-width saturated banner: the alert reads as calm and precise,
           and a tinted pill survives Gmail's forced darkening far better than
           white-on-red. */
        :root { color-scheme: light only; supported-color-schemes: light only; }
        body { margin: 0; padding: 0; background-color: #f3f5f8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #1f2937; line-height: 1.55; -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; mso-line-height-rule: exactly; }
        table { border-collapse: collapse; mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
        img { border: 0; outline: none; -ms-interpolation-mode: bicubic; }
        .wrapper { width: 100%; background-color: #f3f5f8; }
        /* Padding on the cell: a <table> ignores its own padding in most engines. */
        .wrapper-cell { padding: 28px 12px 40px; }
        .shell { width: 100%; max-width: 560px; margin: 0 auto; }
        .header { padding: 0 4px 16px; text-align: left; }
        .header-logo { color: #0b1220; font-size: 17px; font-weight: 700; letter-spacing: -0.01em; text-decoration: none; }
        .header-mark { width: 26px; padding-right: 9px; vertical-align: middle; }
        .header-name { vertical-align: middle; }
        .header-logo-img { display: block; border: 0; outline: none; text-decoration: none; }
        .header-org-logo { display: block; border: 0; outline: none; max-height: 32px; }
        .header-attribution { vertical-align: middle; }
        .header-wordmark { color: #8a94a6; font-size: 12px; white-space: nowrap; }
        .container { width: 100%; background-color: #ffffff; border-radius: 12px; overflow: hidden; border: 1px solid #e2e7ee; border-collapse: separate; border-spacing: 0; }
        /* Height from font-size/line-height: Outlook ignores CSS height on a <td>. */
        .stripe { font-size: 0; line-height: 0; height: 4px; }
        .stripe-down { background-color: #dc2626; }
        .stripe-recovered { background-color: #16a34a; }
        .stripe-escalated { background-color: #d97706; }
        .stripe-reopened { background-color: #ea580c; }
        .stripe-comment { background-color: #94a3b8; }
        .stripe-acknowledged { background-color: #0284c7; }
        .pill-row { padding: 28px 36px 0; }
        .pill { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; line-height: 1.3; }
        .pill-dot { font-size: 10px; padding-right: 5px; }
        .pill-down { background-color: #fee2e2; color: #b91c1c; }
        .pill-recovered { background-color: #dcfce7; color: #15803d; }
        .pill-escalated { background-color: #fef3c7; color: #a16207; }
        .pill-reopened { background-color: #ffedd5; color: #c2410c; }
        .pill-comment { background-color: #eef2f6; color: #475569; }
        .pill-acknowledged { background-color: #e0f2fe; color: #0369a1; }
        .content { padding: 16px 36px 32px; color: #1f2937; font-size: 15px; }
        /* Top of a card without a state pill. */
        .top-space { font-size: 0; line-height: 0; height: 16px; }
        .content h1 { margin: 0 0 12px; font-size: 22px; font-weight: 700; color: #0b1220; letter-spacing: -0.02em; line-height: 1.3; }
        .content h1 a { color: #0b1220 !important; font-weight: 700; }
        .content h2 { margin: 0 0 14px; font-size: 17px; font-weight: 700; color: #0b1220; line-height: 1.35; }
        .content p { margin: 0 0 16px; }
        .content a { color: #1e64ef; text-decoration: none; font-weight: 500; }
        .content h2.section-title { margin: 28px 0 8px; font-size: 13px; font-weight: 600; color: #6b7280; text-transform: uppercase; letter-spacing: 0.05em; }
        .content p.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: #6b7280; margin: 0 0 6px; }
        .content p.lead { font-size: 16px; color: #374151; }
        .content .prose { white-space: pre-wrap; margin: 0 0 16px; }
        .quote { margin: 18px 0; padding: 12px 16px; border-left: 3px solid #cbd5e1; background-color: #f8fafc; color: #1f2937; white-space: pre-wrap; border-radius: 0 8px 8px 0; }
        /* The failure cause: the one line an on-call reader needs before they
           decide whether to get up. */
        .cause { margin: 4px 0 20px; padding: 12px 14px; background-color: #fef2f2; border: 1px solid #fecaca; border-radius: 8px; }
        .cause-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 13px; color: #991b1b; word-break: break-word; overflow-wrap: anywhere; }
        .cta-wrap { margin: 24px 0 8px; }
        .actions-table { margin: 24px 0 8px; }
        .action-cell { padding-right: 10px; padding-bottom: 8px; vertical-align: middle; }
        .btn-table { border-collapse: separate; }
        .btn-table td { border-radius: 8px; text-align: center; }
        .btn { display: inline-block; padding: 11px 20px; text-decoration: none; font-weight: 600; font-size: 14px; border-radius: 8px; mso-padding-alt: 0; }
        .btn-primary td { background-color: #1e64ef; }
        .btn-primary a.btn { color: #ffffff !important; }
        .btn-success td { background-color: #1e64ef; }
        .btn-success a.btn { color: #ffffff !important; }
        .btn-secondary td { background-color: #ffffff; border: 1px solid #d1d7e0; }
        .btn-secondary a.btn { color: #1f2937 !important; }
        .cta { display: inline-block; padding: 11px 20px; background-color: #1e64ef; color: #ffffff !important; text-decoration: none; border-radius: 8px; font-weight: 600; font-size: 14px; }
        .cta-success { background-color: #1e64ef; }
        /* Facts: label / value rows with hairlines only, no shaded label column.
           border-collapse separate so the rounded outer box draws fully. */
        .details-table { width: 100%; margin: 16px 0 8px; border-collapse: separate; border-spacing: 0; }
        .details-table td { padding: 9px 0; font-size: 14px; border-bottom: 1px solid #eef1f5; vertical-align: top; }
        .details-table tr:last-child td { border-bottom: none; }
        .details-table td.label { color: #6b7280; width: 32%; padding-right: 12px; }
        .details-table td.value { color: #0b1220; }
        .details-table th { padding: 9px 12px 9px 0; font-size: 14px; border-bottom: 1px solid #eef1f5; vertical-align: top; text-align: left; color: #6b7280; width: 32%; font-weight: 400; }
        .details-table tr:last-child th { border-bottom: none; }
        .metric { margin: 12px 0 24px; border-collapse: separate; border-spacing: 0; }
        .metric-value { display: block; font-size: 34px; line-height: 1.1; font-weight: 700; color: #0b1220; letter-spacing: -0.03em; }
        .metric-value.is-bad { color: #b91c1c; }
        .metric-value.is-good { color: #15803d; }
        .metric-value.is-warn { color: #b45309; }
        .metric-label { display: block; font-size: 13px; color: #6b7280; margin-top: 4px; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
        .badge-ok { background-color: #dcfce7; color: #166534; }
        .badge-warn { background-color: #fef3c7; color: #92400e; }
        .badge-bad { background-color: #fee2e2; color: #991b1b; }
        .badge-neutral { background-color: #f1f5f9; color: #475569; }
        .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 13px; color: #475569; }
        .fallback { font-size: 13px; color: #6b7280; word-break: break-word; overflow-wrap: anywhere; }
        .meta { font-size: 13px; color: #6b7280; line-height: 1.5; }
        .content p.meta { margin: 12px 0 0; }
        .footer { padding: 20px 8px 0; color: #8a94a6; font-size: 12px; text-align: center; line-height: 1.6; }
        .footer a { color: #6b7280; text-decoration: underline; }
        .footer p { margin: 0 0 6px; }
        .footer p:last-child { margin: 0; }
        /* Designed dark palette, for the clients that evaluate the media query
           (Apple Mail, Outlook Mac/iOS, Thunderbird). Gmail ignores it and
           keeps the light design (see the light pin and
           wiki/features/email-dark-mode.md). */
        @media (prefers-color-scheme: dark) {
            body, .wrapper { background-color: #0e141b !important; }
            .container { background-color: #161e27 !important; border-color: #263241 !important; }
            .header-logo { color: #f1f5f9 !important; }
            .content, .content p { color: #d1d9e2 !important; }
            .content h1, .content h1 a, .content h2 { color: #f5f7fa !important; }
            .content a { color: #57a8ff !important; }
            /* Buttons keep white text: the generic link color above must not win. */
            .content a.btn { color: #ffffff !important; }
            .btn-secondary td { background-color: #1f2a36 !important; border-color: #374557 !important; }
            .content .btn-secondary a.btn { color: #e5ebf1 !important; }
            .pill-down { background-color: #4a1d1d !important; color: #fca5a5 !important; }
            .pill-recovered { background-color: #133a24 !important; color: #86efac !important; }
            .pill-escalated { background-color: #43320c !important; color: #fcd34d !important; }
            .pill-reopened { background-color: #47260f !important; color: #fdba74 !important; }
            .pill-comment { background-color: #263241 !important; color: #cbd5e1 !important; }
            .pill-acknowledged { background-color: #0f3147 !important; color: #7dd3fc !important; }
            .cause { background-color: #2a1618 !important; border-color: #5b2427 !important; }
            .cause-text { color: #fca5a5 !important; }
            .quote { background-color: #1c2631 !important; border-left-color: #3b4a5c !important; color: #d1d9e2 !important; }
            .details-table td, .details-table th { border-bottom-color: #232e3b !important; }
            .details-table td.label, .details-table th { color: #8f9bab !important; }
            .details-table td.value { color: #eef2f6 !important; }
            .metric-value { color: #f5f7fa !important; }
            .metric-value.is-bad { color: #f87171 !important; }
            .metric-value.is-good { color: #4ade80 !important; }
            .metric-value.is-warn { color: #fbbf24 !important; }
            .metric-label, .meta, .fallback, .mono, .content p.meta { color: #8f9bab !important; }
            .content p.lead { color: #d1d9e2 !important; }
            .badge-ok { background-color: #133a24 !important; color: #86efac !important; }
            .badge-warn { background-color: #43320c !important; color: #fcd34d !important; }
            .badge-bad { background-color: #4a1d1d !important; color: #fca5a5 !important; }
            .badge-neutral { background-color: #263241 !important; color: #cbd5e1 !important; }
            .footer, .footer p { color: #7d8a9b !important; }
            .footer a { color: #a3afbe !important; }
        }
        @media (max-width: 480px) {
            .wrapper-cell { padding: 16px 8px 28px !important; }
            .pill-row { padding: 22px 22px 0 !important; }
            .content { padding: 14px 22px 26px !important; }
            .top-space { height: 10px !important; }
            .content h1 { font-size: 20px !important; }
            .details-table td.label, .details-table th { width: 38% !important; }
            .metric-value { font-size: 30px !important; }
            .action-cell { display: block !important; width: 100% !important; padding-right: 0 !important; }
            .action-cell .btn-table, .action-cell .btn-table td { width: 100% !important; }
            .action-cell .btn-table a.btn { display: block !important; }
        }
    </style>
</head>
<body>
    {{- /* Preheader: the grey line the inbox shows next to the subject. Hidden
         with an inline style so it survives clients that drop <style>. */ -}}
    <div style="display:none;font-size:1px;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;mso-hide:all;">
        {{block "preheader" .}}{{end}}
        &#8203;&#847;&#8203;&#847;&#8203;&#847;&#8203;&#847;&#8203;&#847;&#8203;&#847;&#8203;&#847;&#8203;&#847;&#8203;&#847;&#8203;&#847;&#8203;&#847;&#8203;&#847;&#8203;&#847;&#8203;&#847;&#8203;&#847;&#8203;&#847;&#8203;&#847;&#8203;&#847;&#8203;&#847;&#8203;&#847;
    </div>
    <table class="wrapper" role="presentation" width="100%" cellpadding="0" cellspacing="0">
        <tr>
            <td class="wrapper-cell" align="center">
                <table class="shell" role="presentation" width="560" cellpadding="0" cellspacing="0">
                    <tr>
                        <td class="header">
                            {{- /* Branding. Every key goes through the nil-tolerant
                                 "field" helper: html/template errors on a missing
                                 STRUCT field, and some view models are structs.
                                 OrgLogoURL is the org's logo (the status page's for
                                 subscriber mail), BrandName its alt text, and
                                 HideBranding the white-label opt-in. */ -}}
                            {{- $hideBranding := field . "HideBranding" -}}
                            {{- $brandName := field . "BrandName" -}}
                            {{- $orgLogo := absURL (field . "OrgLogoURL") -}}
                            {{- $productLogo := productLogoURL -}}
                            {{if $hideBranding}}
                            {{- if $brandName}}<span class="header-logo">{{$brandName}}</span>{{end -}}
                            {{else if $orgLogo}}
                            <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                                <tr>
                                    <td align="left"><img class="header-org-logo" src="{{$orgLogo}}" alt="{{if $brandName}}{{$brandName}}{{else}}Logo{{end}}" height="32"></td>
                                    <td class="header-attribution" align="right"><span class="header-wordmark">sent by SolidPing</span></td>
                                </tr>
                            </table>
                            {{else if and (field . "BrandIsSender") $brandName}}
                            <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                                <tr>
                                    <td align="left"><span class="header-logo">{{$brandName}}</span></td>
                                    <td class="header-attribution" align="right"><span class="header-wordmark">sent by SolidPing</span></td>
                                </tr>
                            </table>
                            {{else if $productLogo}}
                            <table role="presentation" cellpadding="0" cellspacing="0">
                                <tr>
                                    <td class="header-mark"><img class="header-logo-img" src="{{$productLogo}}" alt="SolidPing" width="26" height="26"></td>
                                    <td class="header-name"><span class="header-logo">SolidPing</span></td>
                                </tr>
                            </table>
                            {{else}}
                            <span class="header-logo">SolidPing</span>
                            {{end}}
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <table class="container" role="presentation" width="100%" cellpadding="0" cellspacing="0">
                                {{- /* Incident mail overrides this with a stripe and a
                                     state pill; everything else gets nothing. */ -}}
                                {{block "statusbanner" .}}<tr><td class="top-space">&nbsp;</td></tr>{{end}}
                                <tr>
                                    <td class="content">
                                        {{block "content" .}}{{end}}
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                    <tr>
                        <td class="footer">
                            {{- $footerOrgName := field . "OrgName" -}}
                            {{- $dashboardURL := field . "DashboardURL" -}}
                            {{- $unsubscribeURL := field . "UnsubscribeURL" -}}
                            {{- $unsubscribeCheckName := field . "UnsubscribeCheckName" -}}
                            {{if not (field . "HideBranding")}}<p>{{if $footerOrgName}}{{$footerOrgName}} · sent by{{else}}Sent by{{end}} <a href="https://solidping.io">SolidPing</a>{{if $dashboardURL}} · <a href="{{$dashboardURL}}">Dashboard</a>{{end}}</p>{{end}}
                            {{if $unsubscribeURL}}<p><a href="{{$unsubscribeURL}}">{{if $unsubscribeCheckName}}Stop alerts for {{$unsubscribeCheckName}}{{else}}Unsubscribe{{end}}</a></p>{{end}}
                            {{block "footernote" .}}{{end}}
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
{{/* button renders a bulletproof, table-based CTA button. Params: URL,
     Label, Variant ("primary" | "success" | "secondary", defaults to
     primary when empty/unrecognized). Usable from any template via
     {{template "button" dict "URL" .SomeURL "Label" "Click me" "Variant" "success"}} —
     templates build the param map with the local "dict" helper below. */}}
{{define "button"}}
<table class="btn-table {{if eq .Variant "success"}}btn-success{{else if eq .Variant "secondary"}}btn-secondary{{else}}btn-primary{{end}}" role="presentation" cellpadding="0" cellspacing="0" border="0">
    <tr>
        <td><a href="{{.URL}}" class="btn">{{.Label}}</a></td>
    </tr>
</table>
{{end}}
{{/* cause renders the failure cause an incident recorded, when there is one. */}}
{{define "cause"}}{{with field . "FailureReason"}}<div class="cause"><span class="cause-text">{{.}}</span></div>{{end}}{{end}}
{{/* incident-actions renders the buttons of an actionable incident mail:
     "I'm on it" (the per-recipient ack magic link) first when there is one,
     then "View incident". */}}
{{define "incident-actions"}}
{{- $ack := field . "AckURL" -}}
{{- $incident := field . "IncidentURL" -}}
{{if or $ack $incident}}
<table class="actions-table" role="presentation" cellpadding="0" cellspacing="0" border="0">
    <tr>
        {{if $ack}}<td class="action-cell">{{template "button" dict "URL" $ack "Label" "I'm on it" "Variant" "primary"}}</td>{{end}}
        {{if $incident}}<td class="action-cell">{{template "button" dict "URL" $incident "Label" "View incident" "Variant" "secondary"}}</td>{{end}}
    </tr>
</table>
{{end}}
{{if $ack}}<p class="meta">"I'm on it" tells your team you are handling it and stops escalation. The link works for 7 days.</p>{{end}}
{{end}}
{{/* statusbanner-render draws the state of an incident mail: a 4px colored
     stripe across the top of the card and a tinted pill above the headline.
     Params: Variant ("down" | "recovered" | "escalated" | "reopened" |
     "comment" | "acknowledged") and Label. A template overrides base.html's
     {{block "statusbanner" .}}<tr><td class="top-space">&nbsp;</td></tr>{{end}} with:
     {{define "statusbanner"}}{{template "statusbanner-render" dict "Variant" "down" "Label" "Down"}}{{end}} */}}
{{define "statusbanner-render"}}
<tr><td class="stripe stripe-{{.Variant}}">&nbsp;</td></tr>
<tr><td class="pill-row"><span class="pill pill-{{.Variant}}"><span class="pill-dot">&#9679;</span>{{.Label}}</span></td></tr>
{{end}}
