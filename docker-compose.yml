services:
  postgres:
    image: postgres:18.6
    container_name: solidping-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      # CI sets SP_PG_HOST_PORT below the ephemeral range (.github/workflows/ci.yml, e2e-tests).
      - "${SP_PG_HOST_PORT:-55432}:5432"
    volumes:
      #- postgres_data:/var/lib/postgresql
      - ./docker-compose/scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Headless Chrome for `browser` checks. Optional and OFF by default — start it
  # with `docker compose --profile browser up -d`. The main image is distroless
  # and carries no Chrome on purpose; the checker talks CDP to this container.
  browser:
    image: chromedp/headless-shell:157.0.8103.27
    container_name: solidping-browser
    profiles: ["browser"]
    # Loopback only, CDP is unauthenticated. `make dev` on macOS drives this
    # Chrome from the host (ws://127.0.0.1:9322). Not 9222 on the host: a
    # desktop Chrome with remote debugging on often holds it already.
    ports:
      - "127.0.0.1:9322:9222"
    # Replaces the image's run.sh, which word-splits its arguments (so a
    # --host-resolver-rules value cannot get through). Same two processes:
    # Chrome only listens on 127.0.0.1, socat relays 9222 to it.
    #
    # --remote-allow-origins is required from Chrome 111 on for a websocket
    # client that is not a browser page.
    # --host-resolver-rules sends a check on localhost / 127.0.0.1 to the host
    # (the Mac running `make dev`, or the `server` port published there):
    # inside this container, loopback is only Chrome itself.
    entrypoint:
      - /bin/bash
      - -c
      - |
        socat TCP4-LISTEN:9222,fork TCP4:127.0.0.1:9223 &
        exec /headless-shell/headless-shell --no-sandbox --disable-gpu \
          --use-gl=angle --use-angle=swiftshader \
          --remote-debugging-port=9223 --remote-allow-origins='*' \
          --host-resolver-rules='MAP localhost host.docker.internal, MAP 127.0.0.1 host.docker.internal'
    # Chrome mounts /dev/shm and the Docker default (64 MB) makes tabs crash.
    shm_size: 1gb
    # Docker Desktop and OrbStack define it; plain Docker on Linux needs this.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stop_grace_period: 1s

  server:
    image: golang:1.27.3-trixie
    container_name: solidping-server
    working_dir: /app
    command: sh -c "go install github.com/air-verse/air@v1.63.4 && air -c .air.toml"
    ports:
      - "4000:4000"
    volumes:
      - ./server:/app
      - go_modules:/go/pkg/mod
    environment:
      - SP_DB_TYPE=postgres
      - SP_DB_URL=postgres://solidping:solidping@postgres:5432/solidping?sslmode=disable
      - SP_AUTH_JWT_SECRET=dev-secret-change-in-production
      - SP_SERVER_LISTEN=:4000
      - SP_SERVER_JOB_WORKER_NB=1
      # Uncomment together with the `browser` profile above to run browser
      # checks against the sidecar instead of a local Chrome binary.
      # - SP_CHECKERS_BROWSER_CDP_URL=ws://browser:9222
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 1s

volumes:
  go_modules:
