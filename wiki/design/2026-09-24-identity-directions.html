<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SolidPing design directions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&family=Geist:wght@400..800&family=Plus+Jakarta+Sans:wght@400..800&family=Space+Grotesk:wght@400..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
body { margin: 0; background: #e9e9ec; color: #18181b; font-family: Inter, system-ui, sans-serif; font-size: 14px; }
.bar { position: sticky; top: 0; z-index: 50; background: #fff; border-bottom: 1px solid #d9d9de; padding: 10px 20px; display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; }
.bar .grp { display: flex; align-items: center; gap: 8px; }
.bar .lbl { font-size: 12px; color: #71717a; font-weight: 500; }
.seg { display: inline-flex; background: #f1f1f4; border: 1px solid #e0e0e5; border-radius: 9px; padding: 2px; }
.seg button { border: 0; background: transparent; padding: 5px 11px; font: inherit; font-size: 13px; font-weight: 500; color: #52525b; border-radius: 7px; cursor: pointer; }
.seg button.on { background: #fff; color: #18181b; box-shadow: 0 1px 2px rgb(0 0 0 / .1), 0 0 0 1px rgb(0 0 0 / .04); }
.desc { max-width: 1400px; margin: 18px auto 0; padding: 0 20px; display: flex; gap: 18px; align-items: baseline; }
.desc h2 { margin: 0; font-size: 18px; white-space: nowrap; }
.desc p { margin: 0; color: #52525b; line-height: 1.5; }
.stage { max-width: 1400px; margin: 14px auto 40px; padding: 0 20px; }
.compare { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; }
.compare .cell h3 { margin: 0 0 8px; font-size: 14px; }
.compare .cell .app { zoom: .5; }
.compare .cell { cursor: pointer; }

/* ---------- the mock app ---------- */
.app { --hf: 'Inter'; display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 900px; border-radius: 14px; overflow: hidden; background: var(--bg); color: var(--fg); box-shadow: 0 30px 60px -20px rgb(0 0 0 / .25), 0 0 0 1px rgb(0 0 0 / .08); font-family: Inter, system-ui, sans-serif; }
.app[data-sidebar=dark] { --sb-bg: var(--sbd-bg); --sb-fg: var(--sbd-fg); --sb-mfg: var(--sbd-mfg); --sb-active: var(--sbd-active); --sb-afg: var(--sbd-afg); --sb-bar: var(--sbd-bar); --sb-border: var(--sbd-border); --sb-hover: rgb(255 255 255 / .05); }
.app[data-sidebar=light] { --sb-bg: var(--sbl-bg); --sb-fg: var(--sbl-fg); --sb-mfg: var(--sbl-mfg); --sb-active: var(--sbl-active); --sb-afg: var(--sbl-afg); --sb-bar: var(--sbl-bar); --sb-border: var(--sbl-border); --sb-hover: rgb(0 0 0 / .035); }
.app svg.lucide { width: 16px; height: 16px; stroke-width: 2; flex-shrink: 0; }
.h { font-family: var(--hf), Inter, sans-serif; }

.sb { background: var(--sb-bg); color: var(--sb-fg); border-right: 1px solid var(--sb-border); display: flex; flex-direction: column; padding: 14px 10px; }
.sb-head { display: flex; align-items: center; gap: 10px; padding: 2px 8px 16px; }
.sb-head svg.logo { width: 30px; height: 30px; }
.sb-name { font-weight: 700; font-size: 14px; letter-spacing: -.01em; }
.sb-org { font-size: 12px; color: var(--sb-mfg); }
.sb-group { font-size: 11px; font-weight: 600; color: var(--sb-mfg); padding: 14px 10px 6px; letter-spacing: .02em; }
.sb a { position: relative; display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; font-size: 13.5px; font-weight: 500; color: var(--sb-fg); text-decoration: none; }
.sb a svg { opacity: .8; }
.sb a:hover { background: var(--sb-hover); }
.sb a.active { background: var(--sb-active); color: var(--sb-afg); font-weight: 600; }
.sb a.active svg { opacity: 1; }
.sb a.active::before { content: ""; position: absolute; left: -10px; top: 6px; bottom: 6px; width: 3px; border-radius: 0 3px 3px 0; background: var(--sb-bar); }
.sb .cnt { margin-left: auto; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 99px; background: var(--sb-hover); color: var(--sb-mfg); }
.sb .cnt.err { background: color-mix(in oklab, var(--err) 22%, transparent); color: var(--err-sb, var(--err)); }
.sb-foot { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 10px 8px 2px; border-top: 1px solid var(--sb-border); }
.avatar { width: 30px; height: 30px; border-radius: 99px; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #fff; background: var(--avatar, var(--primary)); }
.sb-foot .n { font-size: 13px; font-weight: 600; }
.sb-foot .e { font-size: 11.5px; color: var(--sb-mfg); }

main { position: relative; min-width: 0; }
.glow { position: absolute; inset: 0 0 auto 0; height: 260px; background: var(--glow); pointer-events: none; }
.topbar { position: relative; display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 24px; border-bottom: 1px solid var(--topbar-border, var(--border)); background: var(--topbar-bg, transparent); }
.crumb { font-size: 13.5px; font-weight: 500; color: var(--mfg); display: flex; gap: 8px; align-items: center; }
.crumb b { color: var(--fg); font-weight: 600; }
.search { margin-left: auto; display: flex; align-items: center; gap: 8px; width: 260px; height: 34px; padding: 0 10px; border: 1px solid var(--border); background: var(--control); border-radius: 9px; color: var(--mfg); font-size: 13px; }
.search kbd { margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 11px; border: 1px solid var(--border); border-radius: 5px; padding: 1px 5px; background: var(--muted); }
.content { position: relative; padding: 26px 28px 32px; display: flex; flex-direction: column; gap: 18px; }

.ph { display: flex; align-items: center; gap: 14px; }
.ph-tile { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--tile); color: var(--tile-fg); box-shadow: var(--tile-shadow, none); }
.ph-tile svg.lucide { width: 22px; height: 22px; }
.ph h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -.025em; line-height: 1.15; }
.ph p { margin: 3px 0 0; color: var(--mfg); font-size: 13.5px; }
.ph-actions { margin-left: auto; display: flex; gap: 8px; }

.btn { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 14px; border-radius: 9px; font: inherit; font-size: 13.5px; font-weight: 600; border: 1px solid transparent; cursor: pointer; white-space: nowrap; transition: transform .1s, box-shadow .15s, filter .15s; }
.btn.sm { height: 30px; padding: 0 10px; font-size: 12.5px; border-radius: 8px; }
.btn.primary { background: var(--pbg); color: var(--pfg); box-shadow: var(--pshadow); }
.btn.primary:hover { filter: brightness(1.06); transform: translateY(-1px); }
.btn.outline { background: var(--control); border-color: var(--border-strong, var(--border)); color: var(--fg); box-shadow: 0 1px 2px rgb(0 0 0 / .04); }
.btn.ghost { background: transparent; color: var(--fg); }
.btn.ghost:hover, .btn.outline:hover { background: var(--accent); color: var(--afg); }
.btn.destructive { background: var(--err); color: #fff; box-shadow: 0 6px 14px -6px color-mix(in oklab, var(--err) 60%, transparent); }
.btn.icon { width: 36px; padding: 0; justify-content: center; }

.banner { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 12px; border: 1px solid color-mix(in oklab, var(--err) 35%, transparent); background: color-mix(in oklab, var(--err) 8%, var(--card)); }
.banner .dot { width: 9px; height: 9px; border-radius: 99px; background: var(--err); box-shadow: 0 0 0 4px color-mix(in oklab, var(--err) 20%, transparent); }
.banner b { color: var(--err-fg); font-size: 15px; }
.banner span.t { color: var(--mfg); font-size: 13px; }
.banner .pill { margin-left: auto; }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--card-shadow); }
.kpi { padding: 16px 18px; position: relative; overflow: hidden; }
.kpi .k { display: flex; align-items: center; justify-content: space-between; font-size: 11.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--mfg); }
.kpi .ki { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: var(--muted); color: var(--mfg); }
.kpi .v { font-size: 30px; font-weight: 700; letter-spacing: -.03em; margin: 10px 0 2px; font-variant-numeric: tabular-nums; }
.kpi .s { font-size: 12.5px; color: var(--mfg); display: flex; align-items: center; gap: 8px; }
.kpi.hero { background: var(--hero-bg); color: var(--hero-fg); border-color: var(--hero-border); box-shadow: var(--hero-shadow, var(--card-shadow)); }
.kpi.hero .k, .kpi.hero .s { color: var(--hero-mfg); }
.kpi.hero .ki { background: var(--hero-chip, var(--muted)); color: var(--hero-fg); }
.kpi.hero .spark { display: flex; gap: 2px; align-items: flex-end; height: 22px; margin-top: 10px; }
.kpi.hero .spark i { flex: 1; border-radius: 2px; background: var(--hero-spark, var(--ok)); opacity: .9; }
.v.err { color: var(--err-fg); }

.badge { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 99px; font-size: 12px; font-weight: 600; }
.badge.ok { background: color-mix(in oklab, var(--ok) 15%, transparent); color: var(--ok-fg); }
.badge.err { background: color-mix(in oklab, var(--err) 15%, transparent); color: var(--err-fg); }
.badge.warn { background: color-mix(in oklab, var(--warn) 20%, transparent); color: var(--warn-fg); }
.badge.muted { background: var(--muted); color: var(--mfg); }
.badge.brand { background: var(--accent); color: var(--afg); }
.badge.solid { background: var(--pbg); color: var(--pfg); }
.badge .d { width: 6px; height: 6px; border-radius: 99px; background: currentColor; }

.tcard-h { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--border); }
.tcard-h .h { font-size: 15px; font-weight: 700; }
.tcard-h .tabs { margin-left: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th { text-align: left; font-size: 11.5px; font-weight: 600; color: var(--mfg); letter-spacing: .03em; text-transform: uppercase; padding: 9px 18px; background: var(--thead, var(--muted)); border-bottom: 1px solid var(--border); }
td { padding: 11px 18px; border-bottom: 1px solid var(--border); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: color-mix(in oklab, var(--accent) 45%, transparent); }
td .nm { display: flex; align-items: center; gap: 10px; font-weight: 600; }
td .sd { width: 8px; height: 8px; border-radius: 99px; }
td .sd.ok { background: var(--ok); }
td .sd.err { background: var(--err); box-shadow: 0 0 0 3px color-mix(in oklab, var(--err) 22%, transparent); }
.chip { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500; padding: 2px 7px; border-radius: 6px; border: 1px solid var(--border); background: var(--muted); color: var(--mfg); }
.mono { font-family: 'JetBrains Mono', monospace; font-size: 12.5px; color: var(--mfg); }
.strip { display: flex; gap: 2px; }
.strip i { width: 5px; height: 18px; border-radius: 2px; background: var(--ok); opacity: .85; }
.strip i.e { background: var(--err); opacity: 1; }
.strip i.w { background: var(--warn); opacity: 1; }
.ms { font-family: 'JetBrains Mono', monospace; font-size: 12.5px; font-weight: 500; }
.ms.slow { color: var(--warn-fg); }

.segc { display: inline-flex; background: var(--muted); border: 1px solid var(--border); border-radius: 9px; padding: 2px; }
.segc span { padding: 4px 10px; font-size: 12.5px; font-weight: 600; color: var(--mfg); border-radius: 7px; }
.segc span.on { background: var(--seg-on, var(--card)); color: var(--seg-on-fg, var(--fg)); box-shadow: 0 1px 2px rgb(0 0 0 / .08); }

.comps { padding: 18px; display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 14px 18px; align-items: center; }
.comps .l { font-size: 12px; font-weight: 600; color: var(--mfg); text-transform: uppercase; letter-spacing: .04em; }
.comps .r { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.input { display: flex; align-items: center; gap: 8px; height: 36px; width: 240px; padding: 0 12px; border: 1px solid var(--border-strong, var(--border)); background: var(--control); border-radius: 9px; font-size: 13.5px; }
.input.focus { border-color: var(--ring); box-shadow: 0 0 0 3px color-mix(in oklab, var(--ring) 22%, transparent); }
.input .ph2 { color: var(--mfg); }
.sw { width: 36px; height: 20px; border-radius: 99px; background: var(--pbg); position: relative; }
.sw::after { content: ""; position: absolute; right: 2px; top: 2px; width: 16px; height: 16px; border-radius: 99px; background: #fff; box-shadow: 0 1px 2px rgb(0 0 0 / .25); }
.sw.off { background: var(--border-strong, var(--border)); }
.sw.off::after { right: auto; left: 2px; }
.cb { width: 18px; height: 18px; border-radius: 5px; background: var(--pbg); display: grid; place-items: center; color: var(--pfg); }
.cb svg.lucide { width: 12px; height: 12px; stroke-width: 3; }
a.lnk { color: var(--link, var(--primary)); font-weight: 600; text-decoration: none; font-size: 13.5px; display: inline-flex; gap: 4px; align-items: center; }
.pb { width: 180px; height: 8px; border-radius: 99px; background: var(--muted); overflow: hidden; }
.pb i { display: block; width: 62%; height: 100%; background: var(--pbg); border-radius: 99px; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.inc { padding: 4px 0; }
.inc-row { display: flex; gap: 12px; align-items: flex-start; padding: 12px 18px; border-bottom: 1px solid var(--border); }
.inc-row:last-child { border-bottom: 0; }
.inc-row .ic { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: color-mix(in oklab, var(--err) 14%, transparent); color: var(--err-fg); }
.inc-row .ic.ok { background: color-mix(in oklab, var(--ok) 14%, transparent); color: var(--ok-fg); }
.inc-row .t1 { font-weight: 600; font-size: 13.5px; }
.inc-row .t2 { color: var(--mfg); font-size: 12.5px; margin-top: 2px; }
.inc-row .tm { margin-left: auto; color: var(--mfg); font-size: 12px; white-space: nowrap; }

/* ---------- directions ---------- */
.app {
  --ok: oklch(.65 .2 145); --ok-fg: oklch(.44 .14 145);
  --err: oklch(.6 .22 25); --err-fg: oklch(.48 .19 25);
  --warn: oklch(.75 .18 85); --warn-fg: oklch(.47 .12 80);
  --card-shadow: 0 1px 3px 0 rgb(15 23 42 / .04), 0 4px 12px -2px rgb(15 23 42 / .05);
}
.app[data-mode=dark] {
  --ok: oklch(.7 .18 145); --ok-fg: oklch(.8 .15 145);
  --err: oklch(.65 .2 25); --err-fg: oklch(.78 .15 25);
  --warn: oklch(.8 .16 85); --warn-fg: oklch(.85 .13 85);
  --card-shadow: 0 1px 2px rgb(0 0 0 / .3);
}

/* Current */
.app[data-dir=current] {
  --bg: oklch(.978 .005 250); --fg: oklch(.18 .02 250); --card: #fff; --control: #fff; --border: oklch(.91 .009 250);
  --muted: oklch(.95 .01 250); --mfg: oklch(.48 .02 250);
  --primary: oklch(.55 .18 250); --pfg: oklch(.98 .01 250); --pbg: var(--primary);
  --pshadow: 0 8px 16px -4px color-mix(in oklab, var(--primary) 15%, transparent), 0 4px 8px -4px color-mix(in oklab, var(--primary) 11%, transparent);
  --accent: oklch(.93 .025 250); --afg: oklch(.25 .08 250); --ring: var(--primary);
  --tile: var(--muted); --tile-fg: var(--fg); --glow: none;
  --hero-bg: var(--card); --hero-fg: var(--fg); --hero-mfg: var(--mfg); --hero-border: var(--border); --hero-spark: var(--ok);
  --sbd-bg: oklch(.16 .02 250); --sbd-fg: oklch(.92 .01 250); --sbd-mfg: oklch(.62 .02 250); --sbd-active: oklch(.25 .03 250); --sbd-afg: #fff; --sbd-bar: transparent; --sbd-border: oklch(.24 .02 250);
  --sbl-bg: oklch(.985 .004 250); --sbl-fg: oklch(.25 .02 250); --sbl-mfg: oklch(.5 .02 250); --sbl-active: oklch(.93 .02 250); --sbl-afg: oklch(.15 .02 250); --sbl-bar: transparent; --sbl-border: oklch(.91 .009 250);
  --avatar: oklch(.55 .18 250);
}
.app[data-dir=current][data-mode=dark] {
  --bg: oklch(.14 .015 250); --fg: oklch(.95 .01 250); --card: oklch(.18 .02 250); --control: oklch(.16 .018 250); --border: oklch(.28 .03 250);
  --muted: oklch(.22 .025 250); --mfg: oklch(.65 .02 250);
  --primary: oklch(.65 .16 250); --pfg: oklch(.15 .02 250); --accent: oklch(.3 .05 250); --afg: oklch(.95 .015 250);
  --sbl-bg: oklch(.16 .02 250); --sbl-fg: oklch(.95 .01 250); --sbl-mfg: oklch(.62 .02 250); --sbl-active: oklch(.25 .03 250); --sbl-afg: #fff; --sbl-border: oklch(.28 .03 250);
  --sbd-bg: oklch(.12 .02 250);
}

/* A — Crimson */
.app[data-dir=crimson] {
  --bg: oklch(.984 .004 355); --fg: oklch(.19 .02 355); --card: #fff; --control: #fff; --border: oklch(.92 .01 355); --border-strong: oklch(.88 .012 355);
  --muted: oklch(.965 .007 355); --mfg: oklch(.5 .02 355);
  --primary: oklch(.6 .235 360); --pfg: #fff;
  --pbg: linear-gradient(135deg, oklch(.68 .21 8) 0%, oklch(.6 .235 360) 50%, oklch(.52 .22 350) 100%);
  --pshadow: inset 0 1px 0 rgb(255 255 255 / .25), 0 8px 18px -6px oklch(.6 .235 360 / .55);
  --accent: oklch(.955 .03 358); --afg: oklch(.44 .18 358); --ring: oklch(.6 .235 360);
  --tile: linear-gradient(135deg, oklch(.7 .2 10), oklch(.55 .24 355)); --tile-fg: #fff; --tile-shadow: 0 8px 18px -8px oklch(.6 .235 360 / .7);
  --glow: radial-gradient(50% 200px at 18% 0, oklch(.6 .235 360 / .10), transparent 70%), radial-gradient(40% 160px at 80% 0, oklch(.72 .17 30 / .08), transparent 70%);
  --hero-bg: linear-gradient(135deg, oklch(.64 .22 6) 0%, oklch(.54 .23 355) 55%, oklch(.42 .19 342) 100%);
  --hero-fg: #fff; --hero-mfg: rgb(255 255 255 / .82); --hero-border: transparent; --hero-chip: rgb(255 255 255 / .18); --hero-spark: rgb(255 255 255 / .85);
  --hero-shadow: 0 14px 28px -12px oklch(.55 .23 355 / .65);
  --sbd-bg: linear-gradient(180deg, oklch(.2 .035 352), oklch(.15 .025 345)); --sbd-fg: oklch(.9 .015 355); --sbd-mfg: oklch(.64 .035 355);
  --sbd-active: linear-gradient(90deg, oklch(.6 .235 360 / .34), oklch(.6 .235 360 / .06)); --sbd-afg: #fff; --sbd-bar: oklch(.7 .2 8); --sbd-border: oklch(.26 .03 352);
  --sbl-bg: #fff; --sbl-fg: oklch(.28 .02 355); --sbl-mfg: oklch(.52 .02 355); --sbl-active: oklch(.955 .03 358); --sbl-afg: oklch(.47 .2 358); --sbl-bar: oklch(.6 .235 360); --sbl-border: oklch(.92 .01 355);
  --err: oklch(.62 .2 35); --err-fg: oklch(.5 .17 35);
  --avatar: linear-gradient(135deg, oklch(.7 .2 10), oklch(.5 .22 350));
  --seg-on: var(--pbg); --seg-on-fg: #fff;
}
.app[data-dir=crimson][data-mode=dark] {
  --bg: oklch(.145 .012 350); --fg: oklch(.96 .006 355); --card: oklch(.185 .016 352); --control: oklch(.165 .014 352); --border: oklch(.27 .02 352); --border-strong: oklch(.32 .025 352);
  --muted: oklch(.22 .018 352); --mfg: oklch(.68 .02 355);
  --primary: oklch(.68 .21 2); --accent: oklch(.28 .06 358); --afg: oklch(.9 .06 358);
  --glow: radial-gradient(50% 220px at 18% 0, oklch(.6 .235 360 / .20), transparent 70%), radial-gradient(40% 180px at 80% 0, oklch(.7 .17 30 / .10), transparent 70%);
  --sbd-bg: linear-gradient(180deg, oklch(.135 .02 350), oklch(.115 .015 345)); --sbd-border: oklch(.22 .02 352);
  --sbl-bg: oklch(.17 .014 352); --sbl-fg: oklch(.92 .01 355); --sbl-mfg: oklch(.64 .03 355); --sbl-active: oklch(.3 .07 358); --sbl-afg: #fff; --sbl-border: oklch(.26 .02 352);
  --err: oklch(.68 .19 38); --err-fg: oklch(.8 .14 40);
}

/* B — Sunset */
.app[data-dir=sunset] {
  --bg: oklch(.982 .007 300); --fg: oklch(.2 .03 290); --card: #fff; --control: #fff; --border: oklch(.92 .014 298); --border-strong: oklch(.88 .016 298);
  --muted: oklch(.962 .01 300); --mfg: oklch(.5 .03 295);
  --primary: oklch(.55 .23 315); --pfg: #fff;
  --pbg: linear-gradient(120deg, oklch(.64 .24 358) 0%, oklch(.57 .25 325) 45%, oklch(.52 .24 290) 100%);
  --pshadow: inset 0 1px 0 rgb(255 255 255 / .25), 0 8px 20px -6px oklch(.55 .25 320 / .5);

<script>
const DIRS = {
  current:  { name: "Current", sidebar: "light", text: "Today's theme, for reference. Slate neutrals, flat blue primary, light sidebar. Crimson only exists inside the logo." },
  crimson:  { name: "A · Crimson", sidebar: "dark", text: "Go all-in on the brand: the logo and website pink becomes the primary color. Tonal crimson gradients on primary actions and one hero tile per page, plum-black sidebar. \"Down\" red is pushed toward orange so it never reads as a brand color." },
  sunset:   { name: "B · Sunset", sidebar: "dark", text: "Pink to violet gradient as the signature, on buttons, the active nav pill and hero tiles. Deep indigo sidebar. The most \"modern SaaS\" of the four, and the furthest from status colors." },
  ink:      { name: "C · Ink & crimson", sidebar: "dark", text: "High contrast and restrained. Near-black chrome and ink buttons (white in dark mode), crimson as a sharp accent: active nav bar, focus rings, links, a warm crimson-to-orange glow at the top of each page. Status colors keep the stage." },
  electric: { name: "D · Electric blue (chosen)", sidebar: "dark", text: "Keep blue, but make it electric: cyan-to-indigo gradients, navy sidebar. Lowest risk and closest to today, but it stays disconnected from the pink logo and website." },
};
const FONTS = { "Inter": "Inter", "Geist": "Geist", "Jakarta": "Plus Jakarta Sans", "Space Grotesk": "Space Grotesk" };
const state = { dir: "electric", mode: "light", sidebar: "dark", font: "Inter", view: "single" };
try { Object.assign(state, JSON.parse(localStorage.getItem("sp-dirs") || "{}")); } catch (e) {}
const qs = new URLSearchParams(location.search);
for (const k of ["dir", "mode", "sidebar", "font"]) if (qs.get(k)) state[k] = qs.get(k);

const ic = (n) => `<i data-lucide="${n}"></i>`;
const strip = (pattern) => `<span class="strip">${pattern.split("").map(c => `<i class="${c === "x" ? "e" : c === "w" ? "w" : ""}"></i>`).join("")}</span>`;

  ["err", "Nightly backup", "HEARTBEAT", "acme-heartbeat-backup", "oooooooooooooooooxxxxxxx", "Down", "—"],

  ["ok", "Ping edge-1", "ICMP", "edge-1.acme.com", "oooooooooooowwwoooooooooo".slice(0, 24), "Up", "1011ms"],
  ["err", "Postgres primary", "TCP", "db.acme.internal:5432", "oooooooooooooooooooooxxx", "Down", "49ms"],
  ["ok", "Status page", "HTTP", "https://status.acme.com/", "oooooooooooooooooooooooo", "Up", "13ms"],

  const tr = rows.map(r => `<tr>

    <td><span class="chip">${r[2]}</span></td>
    <td class="mono">${r[3]}</td>
    <td>${strip(r[4])}</td>
    <td><span class="badge ${r[0]}"><span class="d"></span>${r[5]}</span></td>
    <td><span class="ms ${r[6] === "1011ms" ? "slow" : ""}">${r[6]}</span></td>
    <td style="text-align:right"><button class="btn ghost sm icon" style="width:30px">${ic("pencil")}</button></td></tr>`).join("");
  const spark = Array.from({ length: 28 }, (_, i) => `<i style="height:${[70,85,90,100,95,100,100,92,100,100,98,100,100,100,60,100,100,97,100,100,100,94,100,100,100,100,100,100][i]}%"></i>`).join("");
  return `<div class="app" data-dir="${s.dir}" data-mode="${s.mode}" data-sidebar="${s.sidebar}" style="--hf:'${FONTS[s.font]}'">
  <aside class="sb">
    <div class="sb-head"><svg class="logo"><use href="#logo"/></svg><div><div class="sb-name h">SolidPing</div><div class="sb-org">Acme production</div></div></div>
    <div class="sb-group">Monitoring</div>
    <a class="active">${ic("layout-dashboard")}Dashboard</a>
    <a>${ic("list-checks")}Checks<span class="cnt">42</span></a>
    <a>${ic("triangle-alert")}Incidents<span class="cnt err">1</span></a>
    <a>${ic("calendar-days")}Events</a>
    <a>${ic("target")}SLOs</a>
    <div class="sb-group">Alerting</div>
    <a>${ic("blocks")}Integrations</a>
    <a>${ic("phone-call")}On-call</a>
    <a>${ic("git-fork")}Escalation policies</a>
    <a>${ic("bell")}My alerts</a>
    <div class="sb-group">Public status</div>
    <a>${ic("globe")}Status pages</a>
    <a>${ic("megaphone")}Updates &amp; notices</a>
    <a>${ic("wrench")}Maintenance</a>
    <div class="sb-foot"><div class="avatar">AL</div><div><div class="n">Alice</div><div class="e">alice@acme.com</div></div></div>
  </aside>
  <main>
    <div class="glow"></div>
    <div class="topbar">
      <button class="btn ghost icon sm" style="width:30px">${ic("panel-left")}</button>
      <span class="crumb">Acme production ${ic("chevron-right")} <b>Dashboard</b></span>
      <div class="search">${ic("search")}Search checks, incidents…<kbd>⌘K</kbd></div>
    </div>
    <div class="content">
      <div class="ph">
        <div class="ph-tile">${ic("layout-dashboard")}</div>
        <div><h1 class="h">Dashboard</h1><p>What's broken right now, what changed, and where to jump</p></div>
        <div class="ph-actions"><button class="btn outline">${ic("download")}Export</button><button class="btn primary">${ic("plus")}New check</button></div>
      </div>
      <div class="banner"><span class="dot"></span><b class="h">Issues detected</b><span class="t">2 checks down, 1 active incident</span><span class="badge err pill">${ic("triangle-alert")}Active outage</span></div>
      <div class="kpis">
        <div class="card kpi hero"><div class="k">24h availability<span class="ki">${ic("activity")}</span></div><div class="v h">99.87%</div><div class="spark">${spark}</div></div>
        <div class="card kpi"><div class="k">Monitored checks<span class="ki">${ic("list-checks")}</span></div><div class="v h">42</div><div class="s"><span class="badge ok">40 up</span>across 3 regions</div></div>
        <div class="card kpi"><div class="k">Currently down<span class="ki">${ic("circle-alert")}</span></div><div class="v h err">2</div><div class="s"><span class="badge err">Needs action</span></div></div>
        <div class="card kpi"><div class="k">Median response<span class="ki">${ic("gauge")}</span></div><div class="v h">84<span style="font-size:18px;color:var(--mfg);font-weight:600">ms</span></div><div class="s"><span class="badge brand">−12% vs last week</span></div></div>
      </div>
        <div class="card" style="overflow:hidden">
          <div class="tcard-h">${ic("layers")}<span class="h">Production services</span><span class="badge warn">Degraded</span><span class="segc tabs"><span class="on">Groups</span><span>Host</span></span></div>
          <table><thead><tr><th>Name</th><th>Type</th><th>Target</th><th>Last 24h</th><th>Status</th><th>Resp.</th><th></th></tr></thead><tbody>${tr}</tbody></table>
        </div>
      <div class="two">
          <div class="card inc">
            <div class="tcard-h"><span class="h">Recent activity</span><a class="lnk" style="margin-left:auto">View all ${ic("arrow-right")}</a></div>
            <div class="inc-row"><div class="ic">${ic("triangle-alert")}</div><div><div class="t1">Postgres primary is down</div><div class="t2">Connection refused from eu-west, us-east</div></div><div class="tm">3 min</div></div>
            <div class="inc-row"><div class="ic">${ic("triangle-alert")}</div><div><div class="t1">Nightly backup missed</div><div class="t2">No heartbeat for 7h</div></div><div class="tm">7 h</div></div>

            <div class="l">Buttons</div><div class="r"><button class="btn primary sm">${ic("plus")}Create</button><button class="btn outline sm">Cancel</button><button class="btn ghost sm">${ic("refresh-cw")}Refresh</button><button class="btn destructive sm">${ic("trash-2")}Delete</button></div>
            <div class="l">Badges</div><div class="r"><span class="badge ok"><span class="d"></span>Up</span><span class="badge err"><span class="d"></span>Down</span><span class="badge warn">Degraded</span><span class="badge muted">Paused</span><span class="badge brand">Beta</span><span class="badge solid">Team plan</span></div>
            <div class="l">Controls</div><div class="r"><span class="sw"></span><span class="sw off"></span><span class="cb">${ic("check")}</span><div class="pb"><i></i></div></div>
            <div class="l">Input</div><div class="r"><div class="input focus">${ic("search")}<span>api.acme.com</span></div><a class="lnk">Read the docs ${ic("external-link")}</a></div>
          </div>
      </div>
    </div>
  </main>
</div>`;
}

function seg(id, opts, key, onSet) {
  const el = document.getElementById(id);
  el.innerHTML = opts.map(([v, l]) => `<button data-v="${v}" class="${state[key] === v ? "on" : ""}">${l}</button>`).join("");
  el.onclick = (e) => { const b = e.target.closest("button"); if (!b) return; state[key] = b.dataset.v; if (onSet) onSet(); render(); };
}
function render() {
  try { localStorage.setItem("sp-dirs", JSON.stringify(state)); } catch (e) {}
  seg("dir", [...Object.entries(DIRS).map(([k, d]) => [k, d.name]), ["compare", "Compare all"]], "dir", () => { if (DIRS[state.dir]) state.sidebar = DIRS[state.dir].sidebar; });
  seg("mode", [["light", "Light"], ["dark", "Dark"]], "mode");
  seg("sidebar", [["dark", "Dark"], ["light", "Light"]], "sidebar");
  seg("font", Object.keys(FONTS).map(f => [f, f]), "font");
  const stage = document.getElementById("stage");
  if (state.dir === "compare") {
    document.getElementById("dname").textContent = "Compare all";
    document.getElementById("dtext").textContent = "Every direction at half scale, each with its default sidebar. Click one to open it.";
    stage.innerHTML = `<div class="compare">${Object.entries(DIRS).map(([k, d]) => `<div class="cell" data-k="${k}"><h3>${d.name}</h3>${appHTML({ ...state, dir: k, sidebar: d.sidebar })}</div>`).join("")}</div>`;
    stage.querySelectorAll(".cell").forEach(c => c.onclick = () => { state.dir = c.dataset.k; state.sidebar = DIRS[state.dir].sidebar; render(); window.scrollTo(0, 0); });
  } else {
    document.getElementById("dname").textContent = DIRS[state.dir].name;
    document.getElementById("dtext").textContent = DIRS[state.dir].text;
    stage.innerHTML = appHTML(state);
  }
  if (window.lucide) lucide.createIcons();
}
render();
</script>
</body>
</html>
