# docs.solidping.io ingress
#
# Routes the docs subdomain to the SolidPing service so it serves the docs.
# The binary already redirects this host's root into /docs (server.docs_host),
# so all this does is get docs.solidping.io traffic to the pod.
#
# NOTE: docs already serve at solidping.io/docs without any of this — the
# subdomain is OPTIONAL. Apply this only if you want the docs.solidping.io host.
#
# Steps:
#   1. DNS: point docs.solidping.io at the cluster ingress (same target as the
#      app host).
#   2. Fill the TODO values below for your cluster.
#   3. kubectl apply -f deploy/docs-ingress.yaml --context=k8xp
#
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: solidping-docs
  namespace: solidping-dev
  annotations:
    # TODO: set to your cert-manager cluster issuer, or delete the annotation
    # and the tls block below if TLS is terminated elsewhere (e.g. Cloudflare).
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx # TODO: match your cluster's ingress controller
  tls:
    - hosts:
        - docs.solidping.io
      secretName: solidping-docs-tls
  rules:
    - host: docs.solidping.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: solidping # TODO: confirm the Service name (deployment is "solidping")
                port:
                  number: 4000 # the binary listens on :4000
