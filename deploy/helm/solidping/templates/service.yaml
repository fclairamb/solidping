apiVersion: v1
kind: Service
metadata:
  name: {{ include "solidping.fullname" . }}
  labels:
    {{- include "solidping.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    {{- include "solidping.selectorLabels" . | nindent 4 }}
