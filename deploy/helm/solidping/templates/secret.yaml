{{- if not .Values.auth.existingSecret }}
{{- $name := printf "%s-auth" (include "solidping.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "solidping.labels" . | nindent 4 }}
type: Opaque
data:
  jwt-secret: {{ if $existing }}{{ index $existing.data "jwt-secret" }}{{ else }}{{ randAlphaNum 48 | b64enc }}{{ end }}
{{- end }}
