{{- if .Values.database.cnpg.enabled }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "solidping.cnpgCluster" . }}
  labels:
    {{- include "solidping.labels" . | nindent 4 }}
  annotations:
    # helm uninstall must not drop the database with it.
    helm.sh/resource-policy: keep
spec:
  instances: {{ .Values.database.cnpg.instances }}
  {{- with .Values.database.cnpg.imageName }}
  imageName: {{ . | quote }}
  {{- end }}
  bootstrap:
    initdb:
      database: solidping
      owner: solidping
  storage:
    size: {{ .Values.database.cnpg.size }}
    {{- with .Values.database.cnpg.storageClass }}
    storageClass: {{ . | quote }}
    {{- end }}
{{- end }}
