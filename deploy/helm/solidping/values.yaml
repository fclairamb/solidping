image:
  repository: ghcr.io/fclairamb/solidping
  # Defaults to the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent

# Public URL of the instance, used in links and notifications.
baseUrl: "http://localhost:4000"

# SQLite on a persistent volume by default. SQLite means a single replica.
# For PostgreSQL either:
# - set database.type=postgres and point database.existingSecret at a Secret
#   holding the connection string under the key "url", or
# - set database.cnpg.enabled=true to let the chart create a CloudNativePG
#   cluster (the CNPG operator must be installed). This implies postgres.
database:
  type: sqlite
  existingSecret: ""
  cnpg:
    enabled: false
    instances: 1
    size: 5Gi
    storageClass: ""
    # PostgreSQL image, e.g. ghcr.io/cloudnative-pg/postgresql:17. Empty uses
    # the operator default.
    imageName: ""

# Secret holding the JWT signing key under the key "jwt-secret". When empty,
# the chart generates one and keeps it across upgrades.
auth:
  existingSecret: ""

# The /data volume: the SQLite database and uploaded files (logos, status page
# assets, screenshots). It is mounted with PostgreSQL too, for the files.
persistence:
  enabled: true
  size: 1Gi
  storageClass: ""
  existingClaim: ""

# Extra SP_* environment variables, e.g. { SP_SERVER_COMPRESSION: "true" }.
# The chart sets SP_LOG_FORMAT=json; an SP_LOG_FORMAT entry here replaces it.
extraEnv: {}

# ICMP (ping) checks need a raw socket.
icmp:
  enabled: true

service:
  type: ClusterIP
  port: 4000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: solidping.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
