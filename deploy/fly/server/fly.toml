app = "my-solidping"  # change: must be unique on Fly
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  SP_BASE_URL = "https://my-solidping.fly.dev"

[mounts]
  source = "solidping_data"
  destination = "/data"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "off"
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/api/mgmt/health"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
