# SolidPing platform ("system") check agent on fly.io — ONE app per region.
#
# This is a TEMPLATE: copy it to fly.<region>.toml, set `app` and
# `primary_region`, then `fly deploy -c fly.<region>.toml`. See README.md for the
# fly-region-code -> SolidPing-region-slug mapping and the secret set.
#
# The machine runs the SAME SolidPing binary the cluster runs, in agent mode:
# outbound-only WebSocket to the API, no database, no inbound port, no HTTP
# server. It exists so SolidPing can run its OWN cloud check workers outside the
# cluster without exposing PostgreSQL to fly (spec 2026-07-27-01).
#
# =============================================================================
# !! AUTO-STOP MUST STAY OFF. A STOPPED AGENT IS A REGION THAT GOES DARK. !!
# =============================================================================
# Fly only stops machines that sit behind its proxy, and `auto_stop_machines` /
# `min_machines_running` are ONLY valid inside a service block — fly.toml has no
# app-level equivalent, so they cannot be written as active top-level keys here.
# This app therefore guarantees "always on" the only two ways the format allows:
#
#   1. it declares NO service at all (see the end of this file), so fly's
#      autostop machinery has nothing to act on; and
#   2. `[[restart]] policy = "always"` below, which is an ACTIVE directive that
#      brings a machine back after any exit.
#
# If anyone ever adds an [http_service] (a health endpoint, metrics, anything),
# they MUST carry the settings spelled out at the end of this file, or fly's
# DEFAULT auto-stop kicks in, the region's machines scale to zero, and the
# region silently stops probing — with no alert, because the checks simply stop
# being claimed. Read the block at the end of this file before adding a service.

# Replace both with your own. Keep the real values in your infrastructure repo,
# not here — this file is the redistributable example.
app = "CHANGEME-agent-cdg"
primary_region = "cdg"

[build]
  # The published multi-arch server image; agent mode is a runtime role, not a
  # separate artifact. Pin a released tag in production.
  image = "ghcr.io/fclairamb/solidping:latest"

[env]
  # The role switch. Everything else about the process follows from it.
  SP_NODE_ROLE = "agent"
  # SP_AGENT_NAME is deliberately NOT set: the agent falls back to os.Hostname(),
  # which on a fly machine is the machine ID, so the agents list maps 1:1 onto
  # `fly machine list` for free. [env] is app-wide, so setting it here would make
  # every machine report the same name. See README.md.
  SP_AGENT_KEYS_FILE = "/data/agent-keys.json"
  LOG_LEVEL = "info"

# Per-machine identity. The keypair is generated on first boot and persisted
# here, so a restart reuses its agent row instead of enrolling a new one. The
# volume is per-machine by construction on fly, which is exactly right: the
# private key must NEVER be shared between machines.
[[mounts]]
  source = "agent_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1

# ACTIVE always-on directive: a machine that exits for any reason comes back.
# Together with "no service declared" (below) this is what keeps the region
# staffed 24/7.
[[restart]]
  policy = "always"

# -----------------------------------------------------------------------------
# NO SERVICE IS DECLARED — ON PURPOSE.
# -----------------------------------------------------------------------------
# The agent has no listener: it dials out and nothing ever dials in. With no
# service block, fly's proxy owns none of these machines and auto-stop can never
# apply to them, which is exactly the "auto-stop disabled, min_machines_running
# >= 1" requirement of spec 2026-07-27-01 expressed in the only way the format
# permits at app level.
#
# If a future change genuinely needs an inbound port, the service block is NOT
# optional-config — it MUST be written exactly like this:
#
#   [http_service]
#     internal_port = 8080
#     auto_stop_machines = "off"    # never "stop" / "suspend" / true
#     auto_start_machines = false
#     min_machines_running = 1      # >= 1; per-region staffing, never 0
#
# Omitting `auto_stop_machines` inherits fly's default (stop when idle), which
# for an agent app means the region goes dark without any error surfacing.
