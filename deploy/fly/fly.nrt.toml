# SolidPing platform ("system") check agent — Tokyo, Japan.
#
# Generated from fly.toml (the template). Serves the SolidPing region slug
# `jp-1` ("🇯🇵 JP1"), which is staffed ONLY by this app — there is no in-cluster
# checks Deployment for it, unlike `default`/`us-1`/`eu-2`. If these machines
# stop, jp-1 goes dark.
#
# Target API: https://solidping.k8xp.com (the dev deployment; prod is scaled to
# 0). The matching enrollment token lives in the k8xp repo at
# k8s/solidping/overlays/dev/secret.yaml under
# SP_SYSTEM_AGENT_ENROLLMENT_TOKENS, and the jp-1 slug must stay in that
# overlay's SP_REGIONS — enrollment validates the token's region against the
# catalog and refuses an unknown slug.
#
# See README.md and spec 2026-07-27-01.
#
# =============================================================================
# !! AUTO-STOP MUST STAY OFF. A STOPPED AGENT IS A REGION THAT GOES DARK. !!
# =============================================================================
# This app declares NO service block, so fly's proxy owns none of these
# machines and auto-stop can never apply. `[[restart]] policy = "always"` is
# the active counterpart. Read the block at the end of fly.toml before adding
# any [http_service].

app = "solidping-agent-nrt"
primary_region = "nrt"

[build]
  # Pinned to the release the API is running (k8xp dev is on 0.16.2). Agent mode
  # is a runtime role, not a separate artifact — same image the cluster runs.
  #
  # Bumped 0.7.1 -> 0.16.2 on 2026-08-19, restoring the invariant this comment
  # already stated: the pin had drifted nine minors behind the API. The visible
  # symptom was that jp-1's worker row carried a NULL `capabilities` — the
  # egress self-probe that fills it landed in v0.16.0 (commit a5ee7c439), so
  # this agent had no code to report with. NULL means "nothing probed", not
  # "no IPv6"; jp-1 has always passed the IPv6-only check.
  #
  # Safe to redeploy: identity is pinned in the SP_AGENT_KEYS secret and is
  # already enrolled, so recreated machines take the RECONNECT path rather than
  # enrolling fresh — no new agent rows to garbage-collect (see the NO VOLUME
  # note below).
  image = "ghcr.io/fclairamb/solidping:0.16.2"

[env]
  # The role switch. Everything else about the process follows from it.
  SP_NODE_ROLE = "agent"
  LOG_LEVEL = "info"
  # NOTE: no SP_AGENT_KEYS_FILE and no volume — identity comes from the
  # SP_AGENT_KEYS secret instead (see the mounts note below).
  # NOTE: SP_AGENT_NAME is deliberately NOT set. The agent falls back to
  # os.Hostname() (agentmode.go), and a fly machine's hostname is its machine
  # ID — so the agents list lines up 1:1 with `fly machine list` for free.
  # Setting it here would be WRONG: fly [env] is app-wide, so every machine
  # would report the same name. (fly.toml has no per-machine templating, and
  # the wrapper-ENTRYPOINT trick can't work either — the image is distroless
  # and has no /bin/sh.)

# NO VOLUME — identity is pinned via the SP_AGENT_KEYS secret (base64 of the
# identity JSON: both keypairs + agentUid + region). agentmode.loadIdentity()
# checks SP_AGENT_KEYS FIRST and only then the keys file, so this wins outright.
#
# Why this beats the volume here:
#   - The pinned identity is already enrolled (agentUid is set), so every boot
#     takes the RECONNECT path, not the enroll path. `fly deploy` recreates
#     machines, and with a volume each recreation enrolled a NEW agent, leaving
#     rows for the 7-day agent_gc. Now the agent row is stable across deploys.
#   - A pre-enrolled identity skips persistIdentity() entirely (it is only
#     reached from the enrollment path, onIdentityChange in ws.go), so there is
#     no per-deploy identity churn to reconcile.
#
# (Historical note: the agent used to log its identity — private keys included —
# in the clear at INFO on every enrollment, and this pinned-identity setup
# doubled as the mitigation. It no longer does: keys are never logged at any
# level unless SP_AGENT_PRINT_KEYS is explicitly set. Get the SP_AGENT_KEYS
# value from the volume instead:
#   fly ssh console -a <app> -C "base64 -w0 /data/agent-keys.json"
# Any machine that enrolled before that fix has its keys in fly's log stream —
# see "Rotating an exposed agent identity" in deploy/fly/README.md.)
#
# !! THE TRADE-OFF, READ BEFORE SCALING !!
# fly secrets are APP-WIDE, so every machine in this app now shares ONE private
# key. That is acceptable at count=1 and NOT acceptable above it: the design
# requires one keypair per machine (see wiki/features/deported-agents.md).
# Before `fly scale count > 1`, go back to the volume model — restore the
# [[mounts]] block and SP_AGENT_KEYS_FILE, and unset the SP_AGENT_KEYS secret.
#
# 256mb is deliberate, and measured — not a guess. The in-cluster workers
# running this exact workload sit at 27 MiB (eu-2) and 93 MiB (us-1, the
# busiest with real checks), so this leaves ~2.7x headroom over observed peak.
# At nrt prices that is $2.21/mo vs $3.62/mo for 512mb.
#
# If this app ever OOMs, RAISE THIS FIRST and don't be clever about it: jp-1 has
# no in-cluster checks Deployment behind it, so an OOM-killed machine is a
# region that goes dark. The `[[restart]] policy = "always"` below brings it
# back, but a crash loop still means missed checks with nothing alerting on it.
[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpus = 1

# ACTIVE always-on directive: a machine that exits for any reason comes back.
[[restart]]
  policy = "always"

# NO SERVICE IS DECLARED — ON PURPOSE. See fly.toml's closing block.
