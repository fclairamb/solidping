name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write
  pull-requests: read

jobs:
  # Wiki-only pull requests build and test nothing: wiki/ holds internal
  # engineering notes and is not an input to any build (the published docs site
  # is web/docs/, which is separate). Running the full pipeline for them costs a
  # ~28-minute E2E run to prove that prose did not break Go, so detect that case
  # once here and let every build job skip on it.
  #
  # Skipping is safe *specifically because* of how the `ci` gate below is
  # written: it runs with always() and fails only on 'failure' or 'cancelled',
  # so a skipped job satisfies it — the same property the release-please skip
  # already relies on. If that gate ever starts treating 'skipped' as a failure,
  # this must change with it.
  changes:
    name: Detect non-wiki changes
    runs-on: ubuntu-24.04
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Decide whether anything outside wiki/ changed
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Only pull requests carry a well-defined "what changed" set. A push
          # to main (and anything else) always builds — never let this become a
          # way for untested code to reach main.
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "not a pull request — building everything"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files=$(gh api --paginate \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '.[].filename')

          # An empty list means the API told us nothing, not that nothing
          # changed. Fail safe and build.
          if [[ -z "$files" ]]; then
            echo "could not determine changed files — building everything"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed files:"
          echo "$files" | sed 's/^/  /'

          # Deliberately a POSIX `case` glob rather than `grep -qv '^wiki/'`.
          # Inverted-quiet grep is not portable: ugrep, which is `grep` on some
          # developer machines, returns false there even when non-wiki files are
          # present, so anyone reproducing this check locally would be told a
          # 138-file code change was "wiki-only". `case` means exactly one thing
          # in every POSIX shell.
          #
          # A rename out of wiki/ lists the destination path too, so a file
          # leaving wiki/ correctly counts as a code change.
          code=false
          while IFS= read -r file; do
            if [[ -z "$file" ]]; then continue; fi
            case "$file" in
              wiki/*) ;;
              *) code=true ;;
            esac
          done <<< "$files"

          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [[ "$code" == "true" ]]; then
            echo "==> changes outside wiki/ — running the full pipeline"
          else
            echo "==> wiki-only change — skipping build, lint, test and E2E"
          fi

  backend-lint:
    name: Backend Lint & Test
    runs-on: ubuntu-24.04
    needs: [changes]
    if: ${{ !startsWith(github.ref, 'refs/tags/') && (github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release-please-')) && needs.changes.outputs.code == 'true' }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache-dependency-path: server/go.sum

      - name: Create embed placeholders for lint/test
        run: |
          mkdir -p internal/app/dash0res && echo "placeholder" > internal/app/dash0res/index.html
          mkdir -p internal/app/status0res && echo "placeholder" > internal/app/status0res/index.html
          # web/status0's `build:widget` script emits the embeddable status
          # widget into the real status0 build; the /embed/v1/widget.js route
          # resolves it out of the embedded FS, so it must exist here too or
          # TestServeEmbedWidgetV1 404s (spec 2026-08-08-08).
          mkdir -p internal/app/status0res/embed/v1
          echo "(()=>{})();" > internal/app/status0res/embed/v1/widget.js
          mkdir -p internal/app/docsres && echo "placeholder" > internal/app/docsres/index.html
          # Docusaurus emits 404.html into the real docs build; serveDocsFile
          # falls back to it for an unknown path and only degrades to a plain
          # http.Error when it is missing, so TestServeDocsFileResolutionAndHeaders
          # sees text/plain instead of the 404 page without this.
          echo "placeholder" > internal/app/docsres/404.html
          # docusaurus-plugin-llms emits these into the real docs build; the
          # root /llms.txt and /llms-full.txt routes resolve them out of the
          # embedded FS, so they must exist here too or those tests 404.
          echo "placeholder" > internal/app/docsres/llms.txt
          echo "placeholder" > internal/app/docsres/llms-full.txt
          # @easyops-cn/docusaurus-search-local emits this lunr index into the
          # real docs build; TestEmbeddedDocsContainSearchIndex asserts it's
          # present in the embedded FS, so it must exist here too.
          echo '[]' > internal/app/docsres/search-index.json

      # pkg/client/client_generated.go is committed once per batch/release,
      # not per commit (wiki/conventions/generated-client.md), so it can
      # legitimately lag internal/app/openapi/openapi.yaml mid-batch — that's
      # fine on its own. What isn't fine is a regeneration that doesn't
      # compile: that's a real defect in the openapi change, and it should
      # fail the PR that introduced it rather than surface at release time
      # (spec 2026-08-18-08). A byte-diff against the committed file would
      # false-fail on every legitimate mid-batch commit that touches
      # openapi.yaml without regenerating, so this checks the one invariant
      # that actually matters — regenerate here (this doesn't get committed)
      # and let the build/lint/test steps below run against it, same as they
      # would against a real regeneration.
      - name: Regenerate client from current openapi.yaml
        run: go generate ./pkg/client/...

      - name: Verify the freshly generated client still builds
        run: go build ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          # https://github.com/golangci/golangci-lint/releases
          version: v2.13.2
          install-mode: goinstall
          working-directory: server
          # only-new-issues: true

      - name: Run tests
        run: go test -count=1 ./... -short

  # The Postgres half of the Go suite. `backend-lint` above runs `-short`, and
  # `-short` is precisely what every *_postgres_test.go self-skips on — so
  # before this job existed the only database CI had ever exercised was SQLite.
  # Spec 2026-09-11-03 shipped a 500 through that gap (a parameter key pattern
  # SQLite accepted and Postgres refused, certified clean by three review
  # rounds), which is what spec 2026-09-12-05 and this job are for.
  #
  # It is a separate job rather than a step in backend-lint so a ~12-minute
  # database run never delays the ~2-minute lint/build/short-test feedback.
  backend-postgres:
    name: Backend Postgres Tests
    runs-on: ubuntu-24.04
    needs: [changes]
    if: ${{ !startsWith(github.ref, 'refs/tags/') && (github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release-please-')) && needs.changes.outputs.code == 'true' }}
    # Measured 10m19s for internal/db/postgres alone on a warm laptop; the rest
    # of the tree adds a couple of minutes. 20 gives headroom for a cold
    # embedded-Postgres download without letting a hung suite burn an hour.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache-dependency-path: server/go.sum

      # embedded-postgres downloads a ~100 MB Postgres distribution on first use
      # and unpacks it here. Caching it keeps that off the critical path of
      # every run — and off Maven Central's rate limiter, whose 403 would
      # otherwise be the most likely way this job fails for a reason unrelated
      # to the code under test.
      - name: Cache embedded PostgreSQL binaries
        uses: actions/cache@v4
        with:
          path: ~/.embedded-postgres-go
          key: embedded-postgres-${{ runner.os }}-${{ hashFiles('server/go.sum') }}
          restore-keys: |
            embedded-postgres-${{ runner.os }}-

      - name: Create embed placeholders for tests
        run: |
          mkdir -p internal/app/dash0res && echo "placeholder" > internal/app/dash0res/index.html
          mkdir -p internal/app/status0res && echo "placeholder" > internal/app/status0res/index.html
          mkdir -p internal/app/status0res/embed/v1
          echo "(()=>{})();" > internal/app/status0res/embed/v1/widget.js
          mkdir -p internal/app/docsres && echo "placeholder" > internal/app/docsres/index.html
          echo "placeholder" > internal/app/docsres/404.html
          echo "placeholder" > internal/app/docsres/llms.txt
          echo "placeholder" > internal/app/docsres/llms-full.txt
          echo '[]' > internal/app/docsres/search-index.json

      # -p 1 is not a performance choice: embedded-postgres shares one extracted
      # directory (~/.embedded-postgres-go/extracted, pwfile included) across
      # every instance, so two packages starting concurrently make the loser
      # fail with "unable to remove password file".
      #
      # SP_TEST_REQUIRE_POSTGRES=1 turns that failure — and every other
      # "embedded postgres unavailable" path — into a test FAILURE instead of a
      # skip (internal/testsupport). Without it this job would report ok while
      # proving nothing, which is the bug it exists to prevent, not catch.
      #
      # The live-network and Docker suites are NOT here: they sit behind the
      # `slowtests` build tag and run nightly (.github/workflows/nightly.yml).
      - name: Run the Postgres test layer
        run: |
          set -o pipefail
          SP_TEST_REQUIRE_POSTGRES=1 go test -count=1 -p 1 -v ./... 2>&1 \
            | tee "$RUNNER_TEMP/postgres-tests.log"

      # A green exit code is not evidence: `go test` prints ok for a package
      # whose every test skipped. This step asserts the layer actually EXECUTED.
      - name: Assert the Postgres layer really ran
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/postgres-tests.log"

          # A Postgres-named test may not skip here for ANY reason. Every skip
          # such a test can currently reach is the -short guard, and this job
          # does not pass -short; SP_TEST_REQUIRE_POSTGRES=1 covers the rest.
          if grep -E '^[[:space:]]*--- SKIP: .*([Pp]ostgres|Pg[A-Z])' "$log"; then
            echo "::error::A Postgres test was SKIPPED. This job exists to run them; a skip here is a failure."
            exit 1
          fi

          # Belt and braces, and free of false positives: this exact wording is
          # only ever printed by internal/testsupport's SKIP branch, so seeing
          # it means SP_TEST_REQUIRE_POSTGRES did not reach the test binary --
          # regardless of whether the test's name happens to say "Postgres".
          if grep -E 'embedded postgres (unavailable|init failed):.*set SP_TEST_REQUIRE_POSTGRES=1' "$log"; then
            echo "::error::A test skipped on an embedded-Postgres failure: SP_TEST_REQUIRE_POSTGRES did not take effect."
            exit 1
          fi

          # Floor on the count, so a change that stops COMPILING the suites in
          # (say) internal/db/postgres cannot quietly empty this job out. 116
          # top-level Postgres-named tests exist as of spec 2026-09-12-05;
          # raise this when that grows, and only lower it alongside a real
          # deletion.
          passed=$(grep -cE '^--- PASS: .*([Pp]ostgres|Pg[A-Z])' "$log" || true)
          echo "Postgres-named tests passed: $passed"
          if [[ "$passed" -lt 100 ]]; then
            echo "::error::Only $passed Postgres tests passed (floor 100). The layer did not run."
            exit 1
          fi

      - name: Upload the test log
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: postgres-tests-log
          path: ${{ runner.temp }}/postgres-tests.log
          retention-days: 7

  dash0:
    name: Dash0 Build
    runs-on: ubuntu-24.04
    needs: [changes]
    if: ${{ !startsWith(github.ref, 'refs/tags/') && (github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release-please-')) && needs.changes.outputs.code == 'true' }}
    defaults:
      run:
        working-directory: web/dash0
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: bun install

      # Nothing used to type-check e2e/: tsconfig.app.json is `include: ["src"]`
      # and tsconfig.node.json is `include: ["vite.config.ts"]`, so 159 spec and
      # fixture files compiled nowhere. tsconfig.e2e.json covers them and is
      # deliberately NOT referenced from the solution tsconfig.json, so a type
      # error in a Playwright spec fails CI loudly without ever blocking the
      # production bundle build below (spec 2026-09-09-03).
      - name: Type-check e2e
        run: bun run typecheck:e2e

      # Scoped to ./e2e on purpose. `bun run lint` (a bare `eslint .`) is red on
      # base with ~39 errors + ~440 warnings, effectively all under src/
      # (react-hooks), so adding it here would land red on day one; paying that
      # debt down is its own spec. Scoping to e2e keeps the e2e-only regression
      # guards — the E2E_API_BASE/localhost:4000 rules and
      # e2e-local/no-node-scope-in-browser-callback — actually enforced on PRs,
      # which they were not before (spec 2026-09-09-03).
      - name: Lint e2e
        run: bun run lint:e2e

      - name: Run unit tests
        run: bun run test:unit

      - name: Build
        run: bun run build

      - name: Upload dash0 dist
        uses: actions/upload-artifact@v7
        with:
          name: dash0-dist
          path: web/dash0/dist
          retention-days: 1

  status0:
    name: Status0 Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [changes]
    if: ${{ !startsWith(github.ref, 'refs/tags/') && (github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release-please-')) && needs.changes.outputs.code == 'true' }}
    defaults:
      run:
        working-directory: web/status0
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: bun install

      # Same rationale as the dash0 job's Type-check e2e step: nothing else
      # compiles e2e/ (spec 2026-09-09-03).
      - name: Type-check e2e
        run: bun run typecheck:e2e

      # Errors fail the job; warnings do not (eslint's default exit code).
      # The baseline here is 0 errors plus a dozen pre-existing
      # react-refresh/only-export-components warnings on the route files, so
      # --max-warnings 0 would land red on day one. Unlike dash0 — whose src/
      # ESLint debt forces its lint step to be scoped to e2e/ — this is a bare
      # `eslint .`, so it already covers e2e/ and needs no extra step.
      - name: Run lint
        run: bun run lint

      # Scoped to ./src on purpose: a bare `bun test` also collects e2e/*.spec.ts,
      # and those are Playwright specs (`@playwright/test` describe/test), which
      # blow up under the bun test runner. The unit suites are run by `bun test`
      # rather than through `tsc -b` because tsconfig.app.json deliberately
      # excludes src/**/*.test.ts — bun-types' ambient globals collide with that
      # project's DOM lib.
      - name: Run unit tests
        run: bun test ./src

      - name: Build
        run: bun run build

      - name: Upload status0 dist
        uses: actions/upload-artifact@v7
        with:
          name: status0-dist
          path: web/status0/dist
          retention-days: 1

  docs:
    name: Docs Build
    runs-on: ubuntu-24.04
    needs: [changes]
    if: ${{ !startsWith(github.ref, 'refs/tags/') && (github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release-please-')) && needs.changes.outputs.code == 'true' }}
    defaults:
      run:
        working-directory: web/docs
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: bun install

      # Scoped to ./src on purpose, same as the status0 job: a bare `bun test`
      # would also collect anything under build/ or node_modules.
      - name: Run unit tests
        run: bun run test:unit

      # `bun run build` runs gen-api-docs first, generating the API reference
      # from ../../server/internal/app/openapi/openapi.yaml (same repo).
      # onBrokenLinks is "throw", so a broken doc link fails the build here.
      - name: Build
        run: bun run build

      - name: Upload docs dist
        uses: actions/upload-artifact@v7
        with:
          name: docs-dist
          path: web/docs/build
          retention-days: 1

  build:
    name: Build Binary
    runs-on: ubuntu-24.04
    needs: [changes, dash0, status0, docs]
    if: ${{ !startsWith(github.ref, 'refs/tags/') && (github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release-please-')) && needs.changes.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache-dependency-path: server/go.sum

      - name: Download dash0 dist
        uses: actions/download-artifact@v8
        with:
          name: dash0-dist
          path: server/internal/app/dash0res

      - name: Download status0 dist
        uses: actions/download-artifact@v8
        with:
          name: status0-dist
          path: server/internal/app/status0res

      - name: Download docs dist
        uses: actions/download-artifact@v8
        with:
          name: docs-dist
          path: server/internal/app/docsres

      - name: Build binary
        working-directory: server
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null | sed 's/^v//' || echo "dev")
          COMMIT=$(git rev-parse --short HEAD)
          GIT_TIME=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ)

          go build \
            -ldflags "\
              -X 'github.com/fclairamb/solidping/server/internal/version.Version=${VERSION}' \
              -X 'github.com/fclairamb/solidping/server/internal/version.Commit=${COMMIT}' \
              -X 'github.com/fclairamb/solidping/server/internal/version.GitTime=${GIT_TIME}'" \
            -o ../solidping .

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: solidping-linux-amd64
          path: solidping
          retention-days: 7

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-24.04
    # Main suite + status0 specs + ~5 min for the session-continuity side-car
    # run below (session-continuity.spec.ts waits out real access-token
    # expiries, so it inherently takes longer than a normal spec).
    # Raised 30 -> 45 on 2026-08-30: the suite outgrew the old budget. Run
    # 33280066073 finished every step but got cancelled at exactly 30m during
    # the last one, after the batch added ~10 specs (TV mode alone adds 7) and
    # after enabling SP_AUTH_REGISTRATION_EMAIL_PATTERN un-skipped
    # membership-requests.spec.ts. This is a capacity bump, NOT a hang guard
    # being loosened: the known Playwright-install hang is still bounded by the
    # per-attempt timeout on that step, and every step here had succeeded.
    timeout-minutes: 45
    needs: [changes, build]
    if: ${{ !startsWith(github.ref, 'refs/tags/') && (github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release-please-')) && needs.changes.outputs.code == 'true' }}
    defaults:
      run:
        working-directory: web/dash0
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: bun install

      # Note: no --with-deps. The ubuntu-24.04 runner already ships Playwright's
      # browser system libraries, so --with-deps only triggers a fragile apt run
      # that can hang on the dpkg lock; killing it mid-apt orphans apt-get holding
      # that lock and breaks every retry. We only need the browser download here,
      # which is fast and reliable.
      - name: Install Playwright browsers
        run: |
          for attempt in 1 2 3; do
            if timeout 90 bunx playwright install chromium; then
              exit 0
            fi
            echo "Playwright browser download attempt $attempt failed or timed out; retrying after 10s..."
            sleep 10
          done
          echo "Playwright browser download failed after 3 attempts"
          exit 1

      - name: Download solidping binary
        uses: actions/download-artifact@v8
        with:
          name: solidping-linux-amd64
          path: .

      - name: Make binary executable
        working-directory: .
        run: chmod +x solidping

      # --wait blocks until the container's own healthcheck (defined in
      # docker-compose.yml) reports healthy. A hand-rolled `pg_isready` loop
      # starting immediately after `up -d` can race the official postgres
      # image's first-start behavior (initdb runs a short-lived temporary
      # instance before the real one starts) and false-positive against that
      # temporary instance, which then resets the connection mid-migration.
      # The healthcheck's 5s interval clears that window before its first probe.
      - name: Start PostgreSQL
        working-directory: .
        run: docker compose up -d --wait postgres

      - name: Start solidping server
        working-directory: .
        run: |
          # Capture server stdout+stderr so a crash (panic / fatal / OOM) leaves
          # debuggable evidence instead of a silent connection-refused cascade
          # in the E2E results. The log is surfaced on failure and uploaded.
          ./solidping serve > "$GITHUB_WORKSPACE/solidping-server.log" 2>&1 &
          echo "solidping server pid $!"
          disown
        env:
          # PORT is the documented listen override (config.go reads it into
          # server.listen); SOLIDPING_LISTEN was dead config that only worked
          # because the default is already :4000.
          PORT: "4000"
          SP_RUNMODE: test
          SP_DB_RESET: "true"
          # Point the E2E server at the PostgreSQL container started above
          # instead of falling back to the single-connection sqlite-memory
          # default (config.go: RunMode=="test" && Database.Type=="" ->
          # sqlite-memory). Matches docker-compose.yml's postgres service +
          # docker-compose/scripts/init-db.sh's provisioned `solidping` role.
          # See spec 2026-07-06-02.
          SP_DB_TYPE: postgres
          SP_DB_URL: postgres://solidping:solidping@localhost:55432/solidping?sslmode=disable
          SP_SERVER_RATE_LIMITING_REQUESTS_PER_MINUTE: "0"
          SP_SERVER_RATE_LIMITING_MAX_CONCURRENT: "0"
          # Self-registration is off unless auth.registration_email_pattern is
          # set, and systemconfig applies its DB overlay ONCE at process boot —
          # PUT-ing the parameter at runtime does not take effect. Specs that
          # drive the real register -> confirm flow (confirm-registration-no-org)
          # therefore need it set before the server starts. Note this is NOT
          # bound by koanf's env loader (which collapses every underscore to a
          # dot); it works because systemconfig declares this exact EnvVar.
          SP_AUTH_REGISTRATION_EMAIL_PATTERN: ".*"

      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:4000/api/mgmt/health && exit 0
            sleep 1
          done
          echo "Server failed to start" && exit 1

      - name: Run E2E tests
        run: bun run test:e2e
        env:
          CI: "true"

      # status0's public status page has its own Playwright suite, and the WHOLE
      # of it runs here — no hand-maintained file list, so a new spec is covered
      # the day it lands.
      #
      # It used to be three files (translate-resilience, response-time-chart,
      # dark-mode), because everything else hardcoded the `default` org and its
      # `status-0` page, which only `make dev` seeds — this job runs
      # SP_RUNMODE=test, which seeds `test` instead. Those specs now resolve the
      # org through `resolveDefaultStatusPage()` in e2e/fixtures.ts (honouring
      # the E2E_ORG below), so they pass on either server.
      #
      # That selection was not free: incident-publications.spec.ts had never
      # run in CI, and it had been failing deterministically for weeks
      # (spec 2026-09-09-04). Enumerating files here is how that stayed
      # invisible, so please do not go back to it — if a spec cannot run in CI,
      # fix the spec or skip it in its own file, where the reason is visible.
      #
      # Same browser-install guard as the dash0 step above: no --with-deps, plus
      # a per-attempt `timeout` so a hung download can't eat the job budget.
      - name: Run status0 E2E tests
        working-directory: web/status0
        run: |
          bun install
          for attempt in 1 2 3; do
            if timeout 90 bunx playwright install chromium; then
              installed=1
              break
            fi
            echo "Playwright browser download attempt $attempt failed or timed out; retrying after 10s..."
            sleep 10
          done
          if [[ -z "${installed:-}" ]]; then
            echo "Playwright browser download failed after 3 attempts"
            exit 1
          fi
          bunx playwright test --reporter=list
        env:
          CI: "true"
          E2E_BASE_URL: "http://localhost:4000"
          E2E_ORG: "test"

      # session-continuity.spec.ts's access-token-expiry tests need a server
      # started with a short SP_AUTH_ACCESS_TOKEN_EXPIRY — the main server
      # above runs with the default 1h expiry, which no test can wait out, so
      # those tests self-skip unless E2E_ACCESS_TOKEN_EXPIRY_SECONDS is set
      # (see the spec file header). Start a second, disposable instance of
      # the same binary on another port, pointed at the same already-seeded
      # Postgres DB (InitializeTestData/CreateTestData is idempotent — it
      # detects the existing "test" org and skips reseeding, so this is safe
      # without SP_DB_RESET), to give these tests something real to run
      # against instead of skipping every CI run.
      - name: Start side-car server (short access-token expiry)
        working-directory: .
        run: |
          ./solidping serve > "$GITHUB_WORKSPACE/solidping-sidecar.log" 2>&1 &
          echo "solidping side-car pid $!"
          disown
        env:
          PORT: "4001"
          SP_RUNMODE: test
          SP_DB_TYPE: postgres
          SP_DB_URL: postgres://solidping:solidping@localhost:55432/solidping?sslmode=disable
          SP_AUTH_ACCESS_TOKEN_EXPIRY: "10s"
          SP_SERVER_RATE_LIMITING_REQUESTS_PER_MINUTE: "0"
          SP_SERVER_RATE_LIMITING_MAX_CONCURRENT: "0"

      - name: Wait for side-car server
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:4001/api/mgmt/health && exit 0
            sleep 1
          done
          echo "Side-car server failed to start" && exit 1

      - name: Run session-continuity E2E tests (side-car, short expiry)
        # --reporter=list only: the default html/json reporters write to the
        # same playwright-report/test-results paths as the main run above,
        # and would clobber that report/summary in the uploaded artifact.
        run: bunx playwright test session-continuity.spec.ts --reporter=list
        env:
          CI: "true"
          E2E_BASE_URL: "http://localhost:4001/d/"
          E2E_ACCESS_TOKEN_EXPIRY_SECONDS: "10"

      - name: Surface server log on failure
        if: failure()
        working-directory: .
        run: |
          echo "::group::solidping server log (tail)"
          tail -n 300 "$GITHUB_WORKSPACE/solidping-server.log" || echo "(no server log)"
          echo "::endgroup::"
          echo "::group::solidping side-car log (tail)"
          tail -n 300 "$GITHUB_WORKSPACE/solidping-sidecar.log" || echo "(no side-car log)"
          echo "::endgroup::"
          echo "::group::server crash signatures"
          grep -nE "panic:|goroutine [0-9]+|fatal error|signal SIG|runtime error|nil pointer|out of memory|Killed" \
            "$GITHUB_WORKSPACE/solidping-server.log" "$GITHUB_WORKSPACE/solidping-sidecar.log" || echo "(no crash signatures found)"
          echo "::endgroup::"
          # If the server died during the run, report that as the real cause so a
          # connection-refused cascade is treated as a server-crash bug, not a flake.
          if ! curl -sf http://localhost:4000/api/mgmt/health >/dev/null 2>&1; then
            echo "::error::solidping server was DOWN at the end of the E2E run — an unrecovered crash (see log above) cascaded into the test failures, not a flake."
          fi

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            web/dash0/playwright-report/
            web/dash0/test-results/
            web/status0/playwright-report/
            web/status0/test-results/
            solidping-server.log
            solidping-sidecar.log
          retention-days: 7


  ci:
    name: CI
    runs-on: ubuntu-24.04
    needs: [changes, backend-lint, backend-postgres, dash0, status0, docs, build, e2e-tests]
    if: ${{ always() && !startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Verify no failures
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required jobs failed or were cancelled"
            exit 1
          fi
          echo "All checks passed (or skipped: release-please branch, or wiki-only change)"

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.version.outputs.image_tag }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set version variables
        id: version
        run: |
          VERSION=$(git describe --tags --always)
          GIT_HASH=$(git rev-parse --short HEAD)
          GIT_TIME=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ)
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          IMAGE_TAG="${TAG_NAME#v}"

          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "GIT_HASH=${GIT_HASH}" >> $GITHUB_OUTPUT
          echo "GIT_TIME=${GIT_TIME}" >> $GITHUB_OUTPUT
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT

      - name: Log in to the Container registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
            COMMIT=${{ steps.version.outputs.GIT_HASH }}
            GIT_TIME=${{ steps.version.outputs.GIT_TIME }}

  cli-release:
    name: Publish the sp CLI
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache-dependency-path: server/go.sum

      # Four archives, one per platform a SolidPing operator actually runs CI
      # or a laptop on. Until spec 2026-09-11-04 a release published ZERO
      # assets, so `sp checks validate config.yaml` — the validator the docs
      # point at — could not be obtained by a GitHub Actions job at all, and
      # third parties kept maintaining their own Python re-implementations
      # instead. A validator nobody can download is a validator nobody uses.
      - name: Build sp for every published platform
        working-directory: server
        run: |
          set -euo pipefail
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG_NAME#v}"
          COMMIT=$(git rev-parse --short HEAD)
          GIT_TIME=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ)

          mkdir -p ../dist

          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            out="../dist/sp"

            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
              -ldflags "-s -w \
                -X 'github.com/fclairamb/solidping/server/internal/version.Version=${VERSION}' \
                -X 'github.com/fclairamb/solidping/server/internal/version.Commit=${COMMIT}' \
                -X 'github.com/fclairamb/solidping/server/internal/version.GitTime=${GIT_TIME}'" \
              -o "$out" ./cmd/sp

            tar -czf "../dist/sp_${VERSION}_${os}_${arch}.tar.gz" -C ../dist sp
            rm "$out"
          done

          cd ../dist
          sha256sum sp_*.tar.gz > "sp_${VERSION}_checksums.txt"
          ls -l

      # release-please creates the GitHub release from the same tag push that
      # triggered this run, so the release may not exist yet. Wait for it rather
      # than racing it — and if it never appears (a hand-pushed tag), create it,
      # because an asset with nowhere to go is the failure this job exists to
      # prevent.
      - name: Attach the archives to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG_NAME="${GITHUB_REF#refs/tags/}"

          for _ in $(seq 1 30); do
            if gh release view "$TAG_NAME" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              break
            fi
            echo "waiting for release $TAG_NAME to be created..."
            sleep 10
          done

          if ! gh release view "$TAG_NAME" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::warning::release $TAG_NAME was not created by release-please; creating it for the assets"
            gh release create "$TAG_NAME" --repo "${{ github.repository }}" \
              --title "$TAG_NAME" --notes "Automated release." --target "${GITHUB_SHA}"
          fi

          gh release upload "$TAG_NAME" dist/sp_*.tar.gz dist/sp_*_checksums.txt \
            --repo "${{ github.repository }}" --clobber

      - name: Log in to the Container registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (sp)
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/sp
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}

      - name: Set version variables
        id: version
        run: |
          echo "VERSION=$(git describe --tags --always)" >> $GITHUB_OUTPUT
          echo "GIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "GIT_TIME=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      - name: Build and push the sp image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: Dockerfile.sp
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
            COMMIT=${{ steps.version.outputs.GIT_HASH }}
            GIT_TIME=${{ steps.version.outputs.GIT_TIME }}

  deploy:
    name: Deploy to k8xp
    runs-on: ubuntu-24.04
    needs: [docker]
    if: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}

    steps:
      - name: Deploy to k8xp.com
        run: |
          IMAGE_TAG="${{ needs.docker.outputs.image-tag }}"

          # Install kubectl
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl

          # Configure kubeconfig
          mkdir -p ~/.kube
          echo "${{ secrets.K8XP_KUBECONFIG }}" | base64 -d > ~/.kube/config

          # Update the image in the deployment
          ./kubectl set image deployment/solidping backend=ghcr.io/${{ env.IMAGE_NAME }}:${IMAGE_TAG} -n solidping-dev --context=k8xp

          # Wait for rollout to complete
          ./kubectl rollout status deployment/solidping -n solidping-dev --context=k8xp --timeout=5m
