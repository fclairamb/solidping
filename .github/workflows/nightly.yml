name: Nightly

# The test layer that cannot run on a pull request.
#
# `-short` used to be one switch guarding three unrelated needs — a database,
# the public internet, a Docker daemon — so the Postgres suites could not be
# turned on per-PR without also turning on live WHOIS lookups and a Pebble CA
# container. Spec 2026-09-12-05 split them: the database half is now the
# `backend-postgres` job in ci.yml, and what is left (the `slowtests` build tag)
# runs here, where a flaky registrar or a slow image pull costs a nightly
# notification instead of blocking a merge.
#
# The Postgres layer is repeated here on purpose: a nightly run against main
# catches an environment-shaped breakage (a Postgres release, a runner image
# change) on a day nobody happened to touch server code.
#
# Layer map: wiki/testing/test-layers.md

on:
  schedule:
    # 03:17 UTC — off the hour, where GitHub's scheduled-run queue is shortest.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Spec 2026-09-29-08: a fresh clone must build and pass the SQLite layer with
  # no frontend build, no Docker step and no .env (what a Claude cloud session
  # gets). Guards the tracked .gitkeep files in the embedded frontend dirs.
  clean-clone:
    name: Clean clone builds and tests
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Clone HEAD, go build ./..., make test
        run: scripts/check-clean-clone.sh

  slowtests:
    name: Live network + Docker suites
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Create embed placeholders for tests
        run: ../scripts/embed-placeholders.sh

      # Scoped to the packages that actually carry tagged files. Building the
      # whole tree under a tag it does not use would only slow this down.
      - name: Run the slowtests layer
        run: |
          set -o pipefail
          go test -count=1 -p 1 -tags slowtests -v \
            ./internal/checkers/... ./internal/tlsedge/... 2>&1 \
            | tee "$RUNNER_TEMP/slowtests.log"

      # Same reasoning as the backend-postgres guard in ci.yml: these suites
      # self-skip when Docker is missing, so an exit code of 0 does not mean
      # they ran. Naming the tests explicitly is what makes a silently
      # disappeared suite visible.
      - name: Assert the tagged suites really ran
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/slowtests.log"
          for name in \
            TestACMEEndToEndWithPebble \
            TestACMEChainedFallbackWithPebble \
            TestDomainChecker_Execute \
            TestSSLChecker_Execute
          do
            if ! grep -qE "^--- PASS: ${name}\b" "$log"; then
              echo "::error::${name} did not PASS (skipped, failed, or no longer compiled into the slowtests layer)"
              exit 1
            fi
          done
          echo "All four tagged suites passed."

      - name: Upload the test log
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: slowtests-log
          path: ${{ runner.temp }}/slowtests.log
          retention-days: 7

  # Spec 2026-10-12-04: a fresh instance must idle small. The docker harness is
  # too slow and noisy for a pull request (wiki/runbooks/memory-profiling.md
  # section 10), so the bound is checked here: the median cgroup anon+kernel 60 s
  # after a first boot must stay at or under 48 MiB. Embedded frontend assets are
  # placeholders: they move the file-backed pages, not the anon metric.
  membench-fresh-boot:
    name: Fresh-boot memory bound
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Create embed placeholders
        working-directory: server
        run: ../scripts/embed-placeholders.sh

      - name: Build the bench image from this tree
        run: make bench-memory-image BENCH_MEM_IMAGE=solidping-bench:nightly

      - name: Measure fresh-boot memory
        run: |
          make bench-memory \
            BENCH_MEM_MODE=docker \
            BENCH_MEM_IMAGE=solidping-bench:nightly \
            BENCH_MEM_SCENARIOS=fresh-boot \
            BENCH_MEM_LABEL=nightly-fresh-boot \
            BENCH_MEM_DURATION=1m \
            BENCH_MEM_REPS=3 \
            BENCH_MEM_ASSERT=cgroupUnreclaimableBytes=48MiB

      - name: Upload the memory report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: membench-fresh-boot
          path: bench-results/
          retention-days: 14

  postgres:
    name: Postgres layer (against main)
    runs-on: ubuntu-26.04
    # Same budget as backend-postgres in ci.yml. At -p 1 this layer needs ~40
    # min and hit the old 25 min timeout every night, so the job was cancelled
    # before it could report anything.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Cache embedded PostgreSQL binaries
        uses: actions/cache@v6
        with:
          path: ~/.embedded-postgres-go
          key: embedded-postgres-${{ runner.os }}-${{ hashFiles('server/go.sum') }}
          restore-keys: |
            embedded-postgres-${{ runner.os }}-

      # The shared script, not an inline copy: the inline copy here drifted
      # from ci.yml (it lacked the status0 assets/*.js bundle), and
      # TestCompressionEncodesEmbeddedStatus0JS failed every night for it.
      - name: Create embed placeholders for tests
        run: ../scripts/embed-placeholders.sh

      # -p 4, like backend-postgres in ci.yml (see the comment there for why
      # concurrent embedded-postgres instances are safe now).
      - name: Run the Postgres test layer
        run: |
          set -o pipefail
          SP_TEST_REQUIRE_POSTGRES=1 go test -count=1 -p 4 -v ./... 2>&1 \
            | tee "$RUNNER_TEMP/postgres-tests.log"

      - name: Assert the Postgres layer really ran
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/postgres-tests.log"

          if grep -E '^[[:space:]]*--- SKIP: .*([Pp]ostgres|Pg[A-Z])' "$log"; then
            echo "::error::A Postgres test was SKIPPED. This job exists to run them; a skip here is a failure."
            exit 1
          fi

          # Belt and braces, and free of false positives: this exact wording is
          # only ever printed by internal/testsupport's SKIP branch, so seeing
          # it means SP_TEST_REQUIRE_POSTGRES did not reach the test binary --
          # regardless of whether the test's name happens to say "Postgres".
          if grep -E 'embedded postgres (unavailable|init failed):.*set SP_TEST_REQUIRE_POSTGRES=1' "$log"; then
            echo "::error::A test skipped on an embedded-Postgres failure: SP_TEST_REQUIRE_POSTGRES did not take effect."
            exit 1
          fi

          passed=$(grep -cE '^--- PASS: .*([Pp]ostgres|Pg[A-Z])' "$log" || true)
          echo "Postgres-named tests passed: $passed"
          if [[ "$passed" -lt 100 ]]; then
            echo "::error::Only $passed Postgres tests passed (floor 100). The layer did not run."
            exit 1
          fi

      - name: Upload the test log
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: nightly-postgres-tests-log
          path: ${{ runner.temp }}/postgres-tests.log
          retention-days: 7
