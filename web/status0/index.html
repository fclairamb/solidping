<!DOCTYPE html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <!--
      Icon hrefs start with "/" (no /status0 prefix) so Vite rebases them onto
      the configured app base at build time — hardcoding the base here breaks
      the moment VITE_BASE_URL differs.
    -->
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Two media-gated metas instead of one static color: the browser
         chrome (address bar / task switcher) should match whichever palette
         actually painted, and that is decided before first paint by the
         inline script below — a single static theme-color would flash the
         light tint on a dark first paint.
         The colors are the page --background of each theme (spec
         2026-09-24-04), not the brand or dash0's navy: a status page belongs
         to the customer, so the browser bar blends into their page instead of
         carrying SolidPing's chrome. Keep them in sync with src/index.css. -->
    <meta name="theme-color" content="#f5f9fc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#060a13" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SolidPing - Status Page</title>
    <meta name="google" content="notranslate" />
    <!--
      No-flash dark mode: this MUST run before the bundle paints anything, so
      it is an inline, synchronous script (not a module, not deferred) placed
      before <div id="root">. It mirrors the same localStorage("theme") /
      prefers-color-scheme logic as ThemeToggle
      (src/components/ui/theme-toggle.tsx) so the very first paint already
      matches the eventual React state — dash0 can afford to flip the class in
      a useEffect because it sits behind a login, but this is a public page
      visited directly, so a dark-mode visitor must never see a white flash.
      Wrapped in try/catch because localStorage can throw (e.g. Safari private
      mode, or storage disabled by policy) — fall back to system preference
      rather than breaking page load.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var prefersDark = window.matchMedia(
            "(prefers-color-scheme: dark)"
          ).matches;
          if (stored === "dark" || (!stored && prefersDark)) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {
          // Ignore — page renders in the light default.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!--
      Starts the page's API reads while the bundle is still downloading. The
      SPA used to send its first read only once the bundle had loaded and
      booted, ~200 ms after the HTML; the read itself takes ~20 ms. Same order
      as useStagedPublicStatusPage: the bare page (`include=`), then, only if
      it succeeded, availability/response time and updates. apiFetch takes
      these promises by exact URL (src/api/client.ts takePrefetched) instead
      of sending the same request again. TV routes are left alone.
    -->
    <script>
      (function () {
        try {
          var base = "%BASE_URL%";
          var path = location.pathname;
          var rest =
            path.indexOf(base) === 0
              ? path.slice(base.length)
              : path + "/" === base || path === "/"
                ? ""
                : null;
          if (rest === null) return;
          var parts = rest.split("/").filter(Boolean).map(decodeURIComponent);
          var page = null;
          if (parts.length === 0) {
            // A custom domain: the server names the page in a meta tag.
            var meta = document.querySelector('meta[name="sp-page"]');
            page = meta && meta.getAttribute("content");
          } else if (parts.length <= 2 && parts[parts.length - 1] !== "tv") {
            page = parts.join("/");
          }
          if (!page) return;
          var reads = (window.__spPrefetch = {});
          var read = function (include) {
            var url = "/api/v1/status-pages/" + page.trim() + "?include=" + include;
            var response = fetch(url, { cache: "no-cache" });
            response.catch(function () {});
            reads[url] = response;
            return response;
          };
          read("").then(function (response) {
            if (response.ok) {
              read("availability,responseTime");
              read("updates");
            }
          });
        } catch (e) {
          // The SPA sends its own reads.
        }
      })();
    </script>
  </body>
</html>
