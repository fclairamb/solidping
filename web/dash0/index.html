<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Icon hrefs must start with "/" so Vite rebases them onto the app base
      (/d/assets/...) at build time. A bare relative href resolves against
      the current SPA route (/d/orgs/x/checks/favicon.svg), which the
      server answers with the index.html fallback — a broken favicon.
    -->
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- The sidebar navy (#0a1731): the mobile browser bar continues the
         always-dark sidebar. Crimson is the logo only. -->
    <meta name="theme-color" content="#0a1731" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SolidPing - Status Dashboard</title>
  </head>
  <body>
    <script>
      (function() {
        var theme = localStorage.getItem("theme");
        var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (theme === "dark" || (!theme && prefersDark)) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
