<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="SolidPing">
  <title>SolidPing</title>
  <defs>
    <!-- Multi-stop gradient for better color depth -->
    <linearGradient id="shieldFill" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#ff89a5"/>
      <stop offset="35%" stop-color="#fb4f7b"/>
      <stop offset="70%" stop-color="#f03e6d"/>
      <stop offset="100%" stop-color="#dc2c58"/>
    </linearGradient>
    
    <!-- Glossy diagonal highlight with softer transition -->
    <linearGradient id="glossGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="47%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Precise Shield shape path -->
    <path id="shieldPath" d="M 128 24
      C 152 30, 180 42, 202 51
      C 214 56, 226 58, 226 72
      C 226 92, 225 112, 221 130
      C 215 164, 190 194, 146 220
      C 140 224, 132 228, 128 230
      C 124 228, 116 224, 110 220
      C 66 194, 41 164, 35 130
      C 31 112, 30 92, 30 72
      C 30 58, 42 56, 54 51
      C 76 42, 104 30, 128 24 Z"/>

    <!-- Layered shadow for professional depth -->
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#7d0e3b" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
    
    <filter id="lineShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.2" flood-color="#800020" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Shadow -->
  <use href="#shieldPath" fill="#000000" fill-opacity="0.1" transform="translate(0, 2)"/>

  <!-- Main Shield Group -->
  <g filter="url(#shadow)">
    <!-- Base Fill -->
    <use href="#shieldPath" fill="url(#shieldFill)"/>
    
    <!-- Darker bottom stroke -->
    <use href="#shieldPath" fill="none" stroke="#bd174d" stroke-width="1.5"/>
    
    <!-- Subtle Inner Glow / Gloss -->
    <path d="M 30 72 C 30 58, 42 56, 54 51 C 76 42, 104 30, 128 24 L 128 230 C 124 228, 116 224, 110 220 C 66 194, 41 164, 35 130 C 31 112, 30 92, 30 72 Z" 
          fill="url(#glossGrad)" />

    <!-- Bright Inner Rim (The "Edge" highlight) -->
    <path d="M 128 34
      C 150 40, 175 51, 194 59
      C 205 63, 216 65, 216 77
      C 216 94, 215 111, 211 128
      C 206 157, 185 185, 145 210
      C 140 214, 132 217, 128 219
      C 124 217, 116 214, 111 210
      C 71 185, 50 157, 45 128
      C 41 111, 40 94, 40 77
      C 40 65, 51 63, 62 59
      C 81 51, 106 40, 128 34 Z"
      fill="none" stroke="#ff8da9" stroke-width="3" stroke-opacity="0.7"/>
  </g>

  <!-- EKG Pulse Line: Perfected Spikes and Rhythms -->
  <path d="M 36 127 L 74 127 L 88 134 L 104 78 L 132 178 L 152 122 L 174 140 L 220 127"
    fill="none" stroke="#ffffff" stroke-width="12.5"
    stroke-linecap="round" stroke-linejoin="round" filter="url(#lineShadow)"/>
    
  <!-- Checkmark: Thick and assertive overlap -->
  <path d="M 154 90 L 180 120 L 226 72"
    fill="none" stroke="#ffffff" stroke-width="15"
    stroke-linecap="round" stroke-linejoin="round" filter="url(#lineShadow)"/>
</svg>
